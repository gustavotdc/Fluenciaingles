<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluência — Level 1</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap");

/* ===================================================================
   FLUÊNCIA — sistema visual
   Fundo: azul-carvão profundo, frio, para a sala ficar escura e o
   conteúdo acender. Acento: âmbar, o mesmo tom da notação fonética e
   do título Dominada — a cor que já significa "isto é seu".
   Tipos: Archivo para tudo que se lê; IBM Plex Mono para a fonética,
   os contadores e os rótulos técnicos, porque a notação é um
   instrumento, não um texto.
   Escada de títulos: frio → morno conforme a palavra amadurece.
=================================================================== */
:root{
  color-scheme: dark;

  --ground:#090A0E;
  --panel:#111420;
  --panel-2:#171B29;
  --panel-3:#1F2433;
  --line:#242939;
  --line-2:#333A4D;

  --ink:#EDEFF5;
  --ink-2:#98A1B6;
  --ink-3:#5F6880;

  --amber:#E9B44C;
  --amber-2:#C9942F;
  --amber-soft:#E9B44C1f;

  --nova:#6E7891;
  --aprend:#5E8ACF;
  --rev:#8E7BD4;
  --solida:#4FB286;
  --dom:#E9B44C;
  --ref:#DD6B62;

  --r:16px; --r2:11px; --r3:8px;
  --mx:1120px;
  --sans:"Archivo",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sombra:0 1px 2px #0006, 0 8px 28px -14px #000a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::selection{background:#E9B44C33}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------------- casca ---------------- */
#app{min-height:100%;display:flex;flex-direction:column}
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:#090A0Ee8;backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:var(--mx);margin:0 auto;padding:0 22px;height:60px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:12.5px;text-transform:uppercase;white-space:nowrap;flex:none}
.brand .dot{width:8px;height:8px;border-radius:2px;background:var(--amber);box-shadow:0 0 14px #E9B44Caa;flex:none}
.brand .dim{font-family:var(--mono);font-weight:400;letter-spacing:.02em;text-transform:none;font-size:12px;color:var(--ink-3)}
.sync{display:flex;align-items:center;gap:7px;font-size:11px;font-family:var(--mono);color:var(--ink-3);white-space:nowrap;flex:none}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none;transition:background .3s}
.sync.on i{background:var(--solida);box-shadow:0 0 8px #4FB28688}
.sync.wait i{background:var(--amber)}
.sync.off i{background:var(--line-2)}
nav.tabs{display:flex;gap:3px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  padding:8px 14px;border-radius:99px;color:var(--ink-3);font-size:13.5px;font-weight:500;
  white-space:nowrap;transition:color .15s,background .15s
}
nav.tabs button:hover{color:var(--ink-2)}
nav.tabs button.on{color:var(--ground);background:var(--ink)}
main{flex:1;max-width:var(--mx);width:100%;margin:0 auto;padding-inline:22px;padding-block:30px 100px}
@media(max-width:640px){
  .top-in{gap:12px;padding:0 16px;height:56px}
  .brand .dim{display:none}
  main{padding-inline:16px;padding-block:22px 84px}
}
@media(max-width:860px){.sync span{display:none}}

/* ---------------- base ---------------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card.tight{padding:16px 18px}
h1{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
h2{font-size:15px;font-weight:650;letter-spacing:-.01em;margin-bottom:14px}
.lbl{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.mini{font-size:12.5px;line-height:1.45;color:var(--ink-3)}
.big{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1}
.grid{display:grid;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:14px}
.sep{height:1px;background:var(--line);margin:18px 0}

.btn{
  background:var(--panel-3);border:1px solid var(--line-2);border-radius:var(--r2);
  padding:10px 17px;font-size:14px;font-weight:550;letter-spacing:-.005em;
  transition:background .15s,border-color .15s,transform .08s
}
.btn:hover{background:#262C3D}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1A1204;font-weight:650}
.btn.pri:hover{background:#F0BE60}
.btn.ok{background:#12301F;border-color:#245C3E;color:#8FE3B8}
.btn.ok:hover{background:#173D28}
.btn.bad{background:#341615;border-color:#6A2E2A;color:#F0AFA9}
.btn.bad:hover{background:#421C1A}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:var(--r3)}
.btn.lg{padding:15px 28px;font-size:15.5px;border-radius:13px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{background:var(--panel-3)}
.btn.sug{box-shadow:0 0 0 2px var(--amber)}
.edt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:var(--r3);padding:5px 10px;transition:.15s}
.edt:hover{color:var(--ink-2);border-color:var(--line-2);background:var(--panel-2)}

.bar{height:5px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--amber);transition:width .6s cubic-bezier(.2,.8,.2,1)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:99px;border:1px solid}
.dotc{width:6px;height:6px;border-radius:50%;flex:none}
.s-nova{color:var(--nova);border-color:#6E789133;background:#6E78911a}.s-nova .dotc{background:var(--nova)}
.s-aprend{color:var(--aprend);border-color:#5E8ACF33;background:#5E8ACF1a}.s-aprend .dotc{background:var(--aprend)}
.s-rev{color:var(--rev);border-color:#8E7BD433;background:#8E7BD41a}.s-rev .dotc{background:var(--rev)}
.s-solida{color:var(--solida);border-color:#4FB28633;background:#4FB2861a}.s-solida .dotc{background:var(--solida)}
.s-dom{color:var(--dom);border-color:#E9B44C33;background:#E9B44C1a}.s-dom .dotc{background:var(--dom)}
.s-ref{color:var(--ref);border-color:#DD6B6233;background:#DD6B621a}.s-ref .dotc{background:var(--ref)}

/* ---------------- painel ---------------- */
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.streak{display:flex;align-items:center;gap:12px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel)}
.streak b{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--amber)}

.next{
  position:relative;overflow:hidden;
  background:
    radial-gradient(120% 140% at 88% 0%, #2A2110 0%, transparent 58%),
    linear-gradient(170deg,#161B2B 0%,#111420 70%);
  border:1px solid #2C3348;border-radius:var(--r);padding:28px;
  display:flex;flex-direction:column;gap:20px;margin-bottom:14px;box-shadow:var(--sombra)
}
.next::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,#E9B44C55,transparent)}
.next .what{font-size:27px;font-weight:700;letter-spacing:-.035em;line-height:1.15;text-wrap:balance}
@media(max-width:560px){.next{padding:22px 20px}.next .what{font-size:22px}}

.hoje{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
/* 6 trilhas: 3 colunas no meio-termo, 2 no telefone. Nenhuma sobra sozinha. */
@media(max-width:1000px){ .hoje{grid-template-columns:repeat(3,1fr)} }
@media(max-width:700px){ .hoje{grid-template-columns:repeat(2,1fr)} }
.trilha{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);
  padding:15px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
  transition:border-color .15s,background .15s
}
.trilha.ativa{border-color:#3B3320;background:linear-gradient(180deg,#1A1710,var(--panel))}
.trilha .tt{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.trilha .ts{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
.anel{position:relative;width:62px;height:62px;flex:none}
.anel svg{transform:rotate(-90deg);display:block}
.anel-bg{fill:none;stroke:var(--panel-3);stroke-width:5}
.anel-fg{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.anel b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.03em}

.faixa{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-bottom:14px}
@media(max-width:820px){.faixa{grid-template-columns:1fr}}
.marco{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:17px 19px;display:flex;flex-direction:column;gap:11px}
.marco .n{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.04em;color:var(--dom)}
.treinos{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:17px 19px;display:flex;flex-direction:column;gap:12px}
.chk{
  width:100%;border-radius:var(--r3);border:1px solid var(--line-2);background:var(--panel-2);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;
  font-size:12.5px;font-weight:550;color:var(--ink-2);transition:.15s
}
.chk:hover{border-color:#3E4761}
.chk.on{background:#12301F;border-color:#245C3E;color:#8FE3B8}
.chk i{font-style:normal;font-family:var(--mono);font-size:12px;opacity:.8}

.stats{display:flex;flex-wrap:wrap;gap:8px}
.st{
  background:var(--panel);border:1px solid var(--line);border-radius:99px;
  padding:7px 14px 7px 11px;display:flex;align-items:center;gap:9px
}
.st .n{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.03em}

/* ---------------- sessão ---------------- */
.sess{max-width:680px;margin:0 auto}
.sbar{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.sbar .bar{flex:1}
.sbar .mini{font-family:var(--mono);white-space:nowrap}
.stage{
  min-height:400px;background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:40px 34px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;gap:20px;box-shadow:var(--sombra)
}
.stage>*{max-width:100%}
@media(max-width:560px){.stage{padding:28px 18px;min-height:340px;gap:17px;border-radius:16px}}
.step{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.word-pt{font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1.1;text-wrap:balance}
.word-en{font-size:38px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:1.05}
@media(max-width:560px){.word-pt,.word-en{font-size:30px}}
.pron{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--amber);letter-spacing:-.01em;line-height:1.3}
@media(max-width:560px){.pron{font-size:20px}}
.pav{font-size:19px;line-height:1.6;color:var(--ink);max-width:520px;text-wrap:pretty}
.hintbox{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;font-size:15px;line-height:1.55;color:var(--ink-2);max-width:520px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.kbd{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:14px;text-align:center}
.kbd span{display:inline-block;border:1px solid var(--line-2);border-radius:5px;padding:2px 7px;margin:0 3px}
.redo{font-family:var(--mono);background:#341615;border:1px solid #6A2E2A;color:#F0AFA9;border-radius:99px;padding:3px 11px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.ring{width:96px;height:96px;margin:0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:26px;font-weight:600}
.celebrate{text-align:center;padding:26px 0}
.celebrate .ic{font-size:46px;margin-bottom:14px;line-height:1}

.chute{
  width:100%;max-width:400px;background:var(--ground);border:1px solid var(--line-2);border-radius:var(--r2);
  padding:13px 16px;font-size:18px;text-align:center;outline:none;transition:border-color .15s
}
.chute::placeholder{color:var(--ink-3);font-size:15px}
.chute:focus{border-color:var(--amber)}
.chuteres{font-family:var(--mono);font-size:13.5px;font-weight:500}
.chuteres b{font-family:var(--sans);font-weight:650}
.ok-tx{color:var(--solida)}
.no-tx{color:var(--ref)}
.curio{font-family:var(--mono);font-size:11.5px;letter-spacing:.01em;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:99px;padding:6px 14px;display:inline-block}

.fam{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.fam span{font-size:12.5px;border:1px solid var(--line);border-radius:var(--r3);padding:4px 9px;color:var(--ink-2);background:var(--panel-2)}
.fam span b{color:var(--ink);font-weight:650}
.fam .rot{font-family:var(--mono);color:var(--ink-3);font-size:10px;letter-spacing:.04em}

/* ---------------- imagem do PAV ---------------- */
.pavimg{margin:0 auto;max-width:430px;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2);line-height:0}
.pavimg img{display:block;width:100%;height:auto}
.pavimg.sm{max-width:230px}
.pavimg.borrada img{filter:blur(14px) saturate(.6);transform:scale(1.06)}
.imgvazio{margin:0 auto;max-width:430px;width:100%;border:1px dashed var(--line-2);border-radius:14px;padding:20px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.5}

/* ---------------- leitura ---------------- */
.leitura{display:flex;flex-direction:column;gap:14px;text-align:left;max-width:60ch}
.lt-fon{font-family:var(--mono);font-size:19px;line-height:1.5;color:var(--amber);font-weight:500}
.lt-en{font-size:19px;line-height:1.5}
.lt-pt{font-size:14px;line-height:1.5;color:var(--ink-3);margin-top:3px}
@media(max-width:560px){.lt-fon,.lt-en{font-size:17px}}
.lt-card{cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.lt-card:hover{border-color:var(--line-2);background:var(--panel-2);transform:translateY(-1px)}
.girando{width:19px;height:19px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--amber);animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------------- listas ---------------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input,.filters select{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);
  padding:9px 12px;font-size:13.5px;outline:none;transition:border-color .15s
}
.filters input:focus,.filters select:focus{border-color:var(--amber)}
.wlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{
  background:var(--panel);padding:13px 16px;display:grid;
  grid-template-columns:42px 1fr 1fr 132px 92px;gap:12px;align-items:center;font-size:13.5px;
  cursor:pointer;transition:background .12s
}
.wrow:hover{background:var(--panel-2)}
.wrow .idx{font-family:var(--mono);color:var(--ink-3);font-size:11.5px}
.wrow .en{font-weight:600}
.wrow .en .mini{font-family:var(--mono);font-size:11.5px}
.wrow .pt{color:var(--ink-2)}
@media(max-width:780px){.wrow{grid-template-columns:34px 1fr 1fr}.wrow .c4,.wrow .c5{display:none}}
.more{text-align:center;padding:16px}
.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.empty .ic{font-size:32px;margin-bottom:12px;opacity:.4}

.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:start}
.tli:last-child{border-bottom:none}
@media(max-width:520px){.tli{grid-template-columns:1fr;gap:3px}}

/* ---------------- calendário ---------------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;padding-bottom:6px}
.cd{
  aspect-ratio:1;border-radius:var(--r3);background:var(--panel-2);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);cursor:pointer;transition:.12s
}
.cd:hover{border-color:var(--line-2)}
.cd.full{background:#12301F;border-color:#245C3E;color:#8FE3B8}
.cd.min{background:#2E2410;border-color:#5E4A1E;color:#E4C176}
.cd.esc{background:#191D28;border-color:#333A4D;color:#8E97AC}
.cd.today{outline:2px solid var(--amber);outline-offset:1px}
.cd.void{background:transparent;border-color:transparent;cursor:default}
.cd b{font-size:12px;font-weight:600}

/* ---------------- avisos e diálogos ---------------- */
.banner{
  border:1px solid #5E4A1E;background:linear-gradient(180deg,#221B0C,#1A1710);border-radius:var(--r2);
  padding:14px 17px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13.5px
}
.banner.ok{border-color:#245C3E;background:linear-gradient(180deg,#10261A,#0F1D16)}
.banner b{font-weight:650}
.toast{
  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(18px);
  background:var(--panel-3);border:1px solid var(--line-2);border-radius:99px;
  padding:11px 22px;font-size:13.5px;opacity:0;pointer-events:none;transition:.28s;z-index:99;
  box-shadow:var(--sombra);max-width:calc(100% - 32px);text-align:center
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:80;background:#050609d9;backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;overflow:auto}
textarea{
  width:100%;background:var(--ground);border:1px solid var(--line-2);border-radius:var(--r2);
  padding:13px 15px;font-size:15px;line-height:1.6;resize:vertical;outline:none;font-family:inherit
}
textarea:focus{border-color:var(--amber)}
/* ---------------- Relâmpago ---------------- */
.rel-ic{font-size:34px;line-height:1}
.rel-recs{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px
}
.rel-recs>div{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r3);
  padding:9px 13px;display:flex;flex-direction:column;gap:2px;align-items:center
}
.rel-recs span{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.rel-recs b{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--amber);letter-spacing:-.03em}

.rel-conta{

<body>
<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand"><span class="dot"></span> FLUÊNCIA <span class="dim" style="font-weight:500">· Level 1</span></div>
      <div class="sync" id="sync" title="Sincronização"></div>
      <nav class="tabs" id="tabs"></nav>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================ DADOS ============================ */
// [pt, comoFala, en, pav, classe, dia]
const W = /*__WORDS__*/[];
// reduções: [completa, reduzida, comoFala, pt, regra]
const R = /*__RED__*/[];
// blocos: [en, comoFala, pt, grupo]
const C = /*__CHK__*/[];
// famílias: id -> [[rótulo, forma], ...]
const FAM = /*__FAM__*/{};
// banco pronto de textos de leitura: {titulo, ctx, linhas:[[en,fon,pt],...]}
const TXT_BANCO = /*__TXTBANCO__*/[];
// banco pronto de itens do antecipar: {ctx, en, alvo, pt}
const ANT_BANCO = /*__ANTBANCO__*/[];

/* ============================ CONSTANTES ============================ */
const HOUR = 3600000, DAY = 86400000;
const GOAL_NEW = 25;       // palavras novas por dia
const GOAL_MIN = 10;       // mínimo para manter o streak
const BATCH = 5;           // palavras por lote
const GOAL_RED = 3;        // reduções novas por dia
const GOAL_CHK = 5;        // blocos novos por dia
const LEVEL_TOTAL = W.length;
const RED_TOTAL = R.length;
const CHK_TOTAL = C.length;
const STORE = "fluencia_v1";

/* Sincronização via Supabase — só é usada fora do Claude Artifact (ex: GitHub
   Pages), quando window.claude não existe. Chave "publishable" (anon): é
   segura em código de navegador, o acesso é controlado pelas políticas de
   RLS da tabela "estado" no banco. */
const SUPA_URL = "https://iopcocewxebrsiyqqezx.supabase.co";
const SUPA_KEY = "sb_publishable_ETBGBBnITeX2tI1YJFrVTA_INsQkRtp";
const SUPA_ROW = "principal";

const STATUS = {
  nova:    {label:"Nova",        cls:"s-nova"},
  aprend:  {label:"Aprendendo",  cls:"s-aprend"},
  rev:     {label:"Em revisão",  cls:"s-rev"},
  solida:  {label:"Sólida",      cls:"s-solida"},
  dom:     {label:"Dominada",    cls:"s-dom"},
  ref:     {label:"Reforço",     cls:"s-ref"}
};

const SCHED = [
  {n:1, nome:"1 hora depois"},
  {n:2, nome:"Fim do dia"},
  {n:3, nome:"Dia seguinte"},
  {n:4, nome:"2 dias depois"},
  {n:5, nome:"3 dias depois"},
  {n:6, nome:"1 semana depois"},
  {n:7, nome:"1 mês depois"},
  {n:8, nome:"3 meses depois"}
];

/* ============================ ESTADO ============================ */
let S = null;
let fileHandle = null;
let saveTimer = null;

function freshState(){
  return {
    v:1,
    criado: Date.now(),
    w:{},              // id -> {s:stage, n:next, l:learnedAt, e:errors, a:attempts, m:mastered, r:reforco}
    r:{},              // reduções  -> {s, n, l, e, a}
    c:{},              // blocos    -> {s, n, l, e, a}
    dias:{},           // 'YYYY-MM-DD' -> {novas, revs, dom, red, chk, li, sp, gr, limpo}
    pav:{},            // id -> PAV editado à mão (substitui o original)
    img:{},            // id -> id da imagem do PAV (a imagem fica no armazenamento do sistema)
    txt:[],            // textos de leitura gerados (os mais recentes)
    frasesDesde: null, // dia em que Frases entrou na meta diária
    rel:{seq:0, acertos:0, tempo:null, rodadas:[], recentes:[]}, // relâmpago: recordes e histórico
    ant:{feitas:0, cheios:0, perto:0, rodadas:[], itens:null, i:0}, // antecipar: ilha separada
    ultimo: null
  };
}
/* ============================ IMAGEM DO PAV ============================ */
/* As imagens ficam no armazenamento do próprio sistema, então sobem no PC
   e aparecem no celular. O estado guarda só o id; a imagem em si fica fora. */
let assetsRef = null;
async function initAssets(){
  try{ assetsRef = (window.claude && window.claude.use) ? await window.claude.use("assets") : null; }
  catch(e){ assetsRef = null; }
}
function imgOf(id){ return (S.img && S.img[id]) ? S.img[id] : null; }
function imgSrc(a){ return "/_blob/" + a; }
function temImagens(){ return !!assetsRef; }
function contaImagens(){ return Object.keys(S.img || {}).length; }

/* reduz antes de subir: o que importa é a cena, não a resolução */
function reduzirImagem(file, maxLado, qualidade){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      let w = im.naturalWidth, h = im.naturalHeight;
      if(!w || !h){ rej(new Error("vazia")); return; }
      const k = Math.min(1, maxLado / Math.max(w, h));
      w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#14171D"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(im, 0, 0, w, h);
      c.toBlob(b => b ? res(b) : rej(new Error("canvas")), "image/jpeg", qualidade);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("invalida")); };
    im.src = url;
  });
}
async function subirImagem(id, file){
  if(!assetsRef){ toast("Aqui não dá para guardar imagens. Use o link do sistema."); return false; }
  if(!/^image\//.test(file.type || "")){ toast("Escolha um arquivo de imagem."); return false; }
  let blob;
  try{ blob = await reduzirImagem(file, 1100, 0.82); }
  catch(e){ toast("Não consegui ler essa imagem."); return false; }
  try{
    const r = await assetsRef.upload(blob, {type:"image/jpeg"});
    const antigo = imgOf(id);
    if(!S.img) S.img = {};
    if(!Array.isArray(S.txt)) S.txt = [];
    S.img[id] = r.id;
    save();
    if(antigo && antigo !== r.id){ try{ await assetsRef.delete(antigo); }catch(e){} }
    return true;
  }catch(e){
    const c = e && e.code;
    toast(c === "too_large" ? "Imagem grande demais." :
          c === "quota_or_state" ? "O espaço de imagens acabou." :
          c === "rate_limited" ? "Muitos envios seguidos. Espere um pouco." :
          c === "unsupported_type" ? "Formato de imagem não aceito." :
          "Não deu para guardar a imagem agora.");
    return false;
  }
}
async function removerImagem(id){
  const a = imgOf(id); if(!a) return;
  delete S.img[id]; save();
  try{ if(assetsRef) await assetsRef.delete(a); }catch(e){}
}
function escolherImagem(id, depois){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    toast("Enviando imagem…");
    const ok = await subirImagem(id, f);
    if(ok) toast("Imagem salva.");
    if(depois) depois();
  };
  inp.click();
}
function blocoImagem(id, cls){
  const a = imgOf(id);
  return a ? `<div class="pavimg ${cls||""}"><img src="${imgSrc(a)}" alt=""></div>` : "";
}
function botaoImagem(id){
  if(!temImagens()) return "";
  return `<button class="edt" data-img="${id}">${imgOf(id) ? "trocar imagem" : "+ imagem"}</button>`;
}

/* ============================ RETORNO IMEDIATO ============================ */
/* Sem som, mas o celular ainda tem um canal de retorno instantâneo. */
const VIB_KEY = "fluencia_vib";
let vibLigada = (function(){ try{ return localStorage.getItem(VIB_KEY) !== "0"; }catch(e){ return true; } })();
function vibrar(ok){
  if(!vibLigada) return;
  try{ if(navigator.vibrate) navigator.vibrate(ok ? 18 : [26, 60, 26]); }catch(e){}
}

/* ============================ FAMÍLIA DA PALAVRA ============================ */
function blocoFamilia(id){
  const f = FAM[id];
  if(!f || !f.length) return "";
  return `<div class="fam">${f.map(x => `<span><span class="rot">${esc(x[0])}</span> <b>${esc(x[1])}</b></span>`).join("")}</div>`;
}

/* ============================ LACUNA DE CURIOSIDADE ============================ */
/* Curiosidade antes da resposta ativa o circuito de recompensa e melhora a
   fixação — inclusive do que vem junto. Fato pequeno, nunca uma dica. */
function curiosidade(id){
  const x = S.w[id] || {}, op = [];
  if(x.e > 0) op.push("você já errou esta " + x.e + (x.e === 1 ? " vez" : " vezes"));
  if(x.a > 2) op.push("já passou por ela " + x.a + " vezes");
  if(x.l){
    const dd = Math.round((Date.now() - x.l) / DAY);
    if(dd > 0) op.push("aprendida há " + dd + (dd === 1 ? " dia" : " dias"));
  }
  if(imgOf(id)) op.push("tem imagem — ela aparece quando você revelar");
  op.push("é a nº " + (id + 1) + " das " + LEVEL_TOTAL);
  if(W[id][5]) op.push("entrou no seu dia " + W[id][5]);
  return op[(id * 7 + (x.a || 0)) % op.length];
}

/* ============================ CHUTE ANTES DE REVELAR ============================ */
/* Tentar antes de ver a resposta melhora a retenção mesmo quando o chute
   está errado. O campo existe para você não conseguir se enganar. */
function campoChute(dica){
  return `<input id="chute" class="chute" placeholder="${esc(dica)}" autocomplete="off"
            autocapitalize="off" autocorrect="off" spellcheck="false">`;
}
function ligaChute(aoEnviar){
  const el = $("#chute"); if(!el) return;
  try{ el.focus(); }catch(e){}
  el.onkeydown = e => {
    e.stopPropagation();
    if(e.key === "Enter"){ e.preventDefault(); aoEnviar(el.value); }
  };
}
/* destaca o botão coerente com o que foi digitado, sem decidir por você */
function sugereBotao(dig, esperado){
  const v = avaliaChute(dig, esperado);
  if(v === null) return;
  const alvo = v ? $("#ok") : $("#err");
  if(alvo) alvo.classList.add("sug");
}
function valorChute(){ const el = $("#chute"); return el ? el.value : ""; }
function normResp(t){
  return String(t == null ? "" : t).toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim();
}
/* true acertou, false errou, null não escreveu nada */
function avaliaChute(dig, esperado){
  const a = normResp(dig);
  if(!a) return null;
  const alvos = String(esperado).split(/[\/;,]| ou /).map(normResp).filter(Boolean);
  const solta = t => t.replace(/^(to|a|an|the|o|os|as|um|uma|uns|umas)\s+/, "");
  for(const b of alvos){ if(a === b || solta(a) === solta(b)) return true; }
  return false;
}
function linhaChute(dig, esperado){
  const v = avaliaChute(dig, esperado);
  if(v === null) return "";
  return `<div class="chuteres ${v ? "ok-tx" : "no-tx"}">${v ? "✓" : "✗"} você escreveu: <b>${esc(dig.trim())}</b></div>`;
}

/* PAV em uso: o editado à mão, se existir; senão o original */
function pavOf(id){
  return (S.pav && S.pav[id]) ? S.pav[id] : W[id][3];
}

document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-img]");
  if(!b) return;
  e.preventDefault(); e.stopPropagation();
  escolherImagem(+b.dataset.img, () => render());
});
function dayKey(d){
  d = d || new Date();
  const z = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return z.toISOString().slice(0,10);
}
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function atHour(d,h){ const x = new Date(d); x.setHours(h,0,0,0); return x.getTime(); }
function today(){ return dia(dayKey()); }
function dia(k){
  if(!S.dias[k]) S.dias[k] = {novas:0, revs:0, dom:0, red:0, chk:0, li:false, sp:false, gr:false, limpo:false};
  const d = S.dias[k];
  if(d.red === undefined) d.red = 0;
  if(d.chk === undefined) d.chk = 0;
  if(d.txt === undefined) d.txt = 0;
  if(d.rel === undefined) d.rel = 0;
  if(d.ant === undefined) d.ant = 0;
  if(d.wr === undefined) d.wr = false;
  return d;
}
function wd(id){
  if(!S.w[id]) S.w[id] = {s:0, n:null, l:null, e:0, a:0, m:false, r:false};
  return S.w[id];
}
function isLearned(id){ return !!(S.w[id] && S.w[id].l); }

function statusOf(id){
  const w = S.w[id];
  if(!w || !w.l) return "nova";
  if(w.r) return "ref";
  if(w.m) return "dom";
  if(w.s <= 2) return "aprend";
  if(w.s <= 6) return "rev";
  return "solida";
}

/* ============================ FRASES: REDUÇÕES E BLOCOS ============================ */
/* Os dois usam a mesma agenda de 8 revisões das palavras. */
const DECK = {
  red: {dados:()=>R, meta:GOAL_RED, campo:"red", nome:"Reduções",  rot:"redução"},
  chk: {dados:()=>C, meta:GOAL_CHK, campo:"chk", nome:"Blocos",    rot:"bloco"}
};
function fStore(k){ if(k === "red"){ if(!S.r) S.r = {}; return S.r; } if(!S.c) S.c = {}; return S.c; }
function fd(k, id){
  const st = fStore(k);
  if(!st[id]) st[id] = {s:0, n:null, l:null, e:0, a:0};
  return st[id];
}
function fLearned(k, id){ const st = fStore(k); return !!(st[id] && st[id].l); }
function fStatus(k, id){
  const x = fStore(k)[id];
  if(!x || !x.l) return "nova";
  if(x.s <= 2) return "aprend";
  if(x.s <= 6) return "rev";
  if(x.s >= 8) return "dom";
  return "solida";
}
function fDue(k){
  const now = Date.now(), st = fStore(k), out = [];
  for(const id in st){
    const x = st[id];
    if(x.l && x.n && x.n <= now && x.s < 8) out.push(+id);
  }
  out.sort((a,b)=> st[a].n - st[b].n);
  return out;
}
function fNovas(k, n){
  const tot = DECK[k].dados().length, out = [];
  for(let i=0;i<tot && out.length<n;i++) if(!fLearned(k,i)) out.push(i);
  return out;
}
function fCounts(k){
  const tot = DECK[k].dados().length;
  let learned = 0, dom = 0;
  for(let i=0;i<tot;i++){
    const s = fStatus(k,i);
    if(s === "nova") continue;
    learned++;
    if(s === "dom") dom++;
  }
  return {total:tot, learned, dom, nova:tot-learned};
}
function fFaltaHoje(k){
  const d = today(), feito = d[DECK[k].campo] || 0;
  const disp = fCounts(k).nova;
  return Math.max(0, Math.min(DECK[k].meta - feito, disp));
}
function fApply(k, id, ok){
  const x = fd(k, id);
  x.a++;
  if(ok){
    x.s = Math.min(8, x.s + 1);
    scheduleNext(x);
  } else {
    x.e++;
    x.n = atHour(addDays(new Date(),1), 9);
  }
  S.ultimo = Date.now();
  save();
}
/* modo da pergunta conforme a revisão */
function fModo(k, target){
  if(k === "red") return target <= 4 ? "ouvir" : "produzir";
  if(target <= 3) return "pt2en";
  if(target === 4) return "en2pt";
  return "pt2en_seco";
}

/* ============================ AGENDA ============================ */
function scheduleNext(w){
  const now = new Date();
  let t = null;
  switch(w.s){
    case 0: t = Date.now() + HOUR; break;
    case 1: { const e = atHour(now,21); t = (e > Date.now() + 30*60000) ? e : Date.now() + 2*HOUR; break; }
    case 2: t = atHour(addDays(now,1),9); break;
    case 3: t = atHour(addDays(now,2),9); break;
    case 4: t = atHour(addDays(now,3),9); break;
    case 5: t = atHour(addDays(now,7),9); break;
    case 6: t = atHour(addDays(now,30),9); break;
    case 7: t = atHour(addDays(now,90),9); break;
    default: t = null;
  }
  w.n = t;
}
function dueList(){
  const now = Date.now(), out = [];
  for(const id in S.w){
    const w = S.w[id];
    if(w.l && w.n && w.n <= now && w.s < 8) out.push(+id);
  }
  out.sort((a,b)=> S.w[a].n - S.w[b].n);
  return out;
}
/* Pauta pro treino de fora (listening/speaking): pega o que está pra
   revisar hoje e, se faltar, completa com o que ele estudou por último.
   Isso vira o material de verdade — antes era só marcar o checkbox
   sem nenhum conteúdo apontado. */
function pautaHoje(n){
  const ids = dueList().slice(0, n);
  if(ids.length < n){
    const vistos = [];
    for(const id in S.w) if(S.w[id].l) vistos.push(+id);
    vistos.sort((a,b)=> (S.w[b].l||0) - (S.w[a].l||0));
    for(const id of vistos){ if(ids.length >= n) break; if(ids.indexOf(id) < 0) ids.push(id); }
  }
  return ids;
}
function soonList(){
  const now = Date.now(), out = [];
  for(const id in S.w){
    const w = S.w[id];
    if(w.l && w.n && w.n > now && w.n <= now + 12*HOUR && w.s < 8) out.push(+id);
  }
  return out;
}
function modeFor(target){
  if(target <= 3) return {mostra:"pt+pav", pede:"en"};
  if(target === 4) return {mostra:"en+pav", pede:"pt"};
  if(target <= 6) return {mostra:"pav", pede:"en"};
  return {mostra:"pt", pede:"en"};
}

/* ============================ CONTADORES ============================ */
function counts(){
  let nova=0, aprend=0, rev=0, solida=0, dom=0, ref=0, learned=0;
  for(let i=0;i<W.length;i++){
    const st = statusOf(i);
    if(st==="nova"){ nova++; continue; }
    learned++;
    if(st==="aprend") aprend++;
    else if(st==="rev") rev++;
    else if(st==="solida") solida++;
    else if(st==="dom") dom++;
    else if(st==="ref") ref++;
  }
  return {nova, aprend, rev, solida, dom, ref, learned};
}
/* pedido dele em 25/09: não repetir sempre a mesma sequência de palavras
   novas (fica óbvio depois de zerar o sistema). Sorteia dentro de uma janela
   perto de onde ele está — mantém fácil→difícil por frequência, só varia a
   ordem exata. Reduções e blocos (fNovas) continuam sequenciais, de propósito. */
const JANELA_NOVAS = 150;
function nextNewIds(n){
  const pool = [];
  for(let i=0;i<W.length && pool.length<JANELA_NOVAS;i++) if(!isLearned(i)) pool.push(i);
  const embaralhado = pool.slice().sort(() => Math.random() - .5);
  return embaralhado.slice(0, n);
}
function dominioPool(){
  const sol = [], dm = [];
  for(let i=0;i<W.length;i++){
    const w = S.w[i];
    if(!w || !w.l || w.r) continue;
    if(w.m) dm.push(i);
    else if(w.s >= 7) sol.push(i);
  }
  return {sol, dm};
}
function totalRevs(){ let t=0; for(const k in S.dias) t += S.dias[k].revs; return t; }

/* ---- streak ---- */
function dayMin(k){ const d = S.dias[k]; return !!d && d.novas >= GOAL_MIN && d.limpo; }
function dayFull(k){
  const d = S.dias[k];
  if(!(d && d.novas >= GOAL_NEW && d.limpo && d.li && d.sp && d.gr)) return false;
  // Frases só entram na conta a partir do dia em que o módulo foi ligado
  if(S.frasesDesde && k >= S.frasesDesde) return (d.red||0) >= GOAL_RED && (d.chk||0) >= GOAL_CHK;
  return true;
}
/* Perder uma sequência longa é o que faz gente abandonar. Duas folgas por
   mês seguram o tranco sem tirar a pressão. */
const ESCUDOS_MES = 2;
function streak(){
  // a contagem não passa do primeiro dia com registro: buraco antes disso
  // é "ainda não usava o sistema", não falta, e não deve gastar folga
  const dias = Object.keys(S.dias);
  if(!dias.length) return {cur:0, best:0, protegidos:[], escudosUsados:0, escudosSobrando:ESCUDOS_MES};
  const inicio = dias.sort()[0];
  const gastos = {}, protegidos = [];
  let cur = 0, k = dayKey();
  if(!dayMin(k)) k = dayKey(addDays(new Date(), -1));   // o dia de hoje ainda dá tempo
  while(k >= inicio){
    if(dayMin(k)){
      cur++;
    } else {
      if(cur === 0) break;                              // não começa a contagem com folga
      const mes = k.slice(0, 7), g = gastos[mes] || 0;
      if(g >= ESCUDOS_MES) break;
      gastos[mes] = g + 1;
      protegidos.push(k);
    }
    k = dayKey(addDays(new Date(k + "T12:00:00"), -1));
  }
  const keys = Object.keys(S.dias).filter(dayMin).sort();
  let best = 0, run = 0, prev = null;
  for(const kk of keys){
    if(prev && (new Date(kk+"T12:00:00") - new Date(prev+"T12:00:00")) === DAY) run++;
    else run = 1;
    best = Math.max(best, run); prev = kk;
  }
  const mesAtual = dayKey().slice(0, 7);
  return {cur, best:Math.max(best,cur), protegidos,
          escudosUsados: gastos[mesAtual] || 0,
          escudosSobrando: Math.max(0, ESCUDOS_MES - (gastos[mesAtual] || 0))};
}
/* metas curtas: a barra de 1.200 quase não anda e desmotiva */
function proximoMarco(n){
  const passos = [10,25,50,75,100,150,200,300,400,500,600,700,800,900,1000,1100,1200];
  for(const p of passos) if(n < p) return p;
  return LEVEL_TOTAL;
}
function diasEstudados(){ return Object.keys(S.dias).filter(k=>S.dias[k].novas>0 || S.dias[k].revs>0).length; }

function markClean(){

}

/* ---- sincronização entre aparelhos (banco do artifact) ---- */
let dbRef = null, dbUnsub = null;
let pushTimer = null, pushing = false, pushAgain = false;
let syncEstado = "off";   // off | wait | on

function setSync(e){
  syncEstado = e;

/* -------------------------------------------------------------------
   CHAVES ESTÁVEIS
   O progresso é guardado pela PALAVRA, não pela posição dela na lista.
   Foi assim que eu deixei o sistema à prova de atualização: dá para
   acrescentar palavras novas sem que o seu histórico escorregue de
   lugar. Dentro do programa tudo continua funcionando por índice;
   a tradução acontece só na hora de gravar e de ler.
-------------------------------------------------------------------- */
const CONTEUDO = W.length + "/" + R.length + "/" + C.length;
const idW = i => String((W[i] && W[i][2]) || "").toLowerCase();
const idR = i => String((R[i] && R[i][1]) || "").toLowerCase();
const idC = i => String((C[i] && C[i][0]) || "").toLowerCase();
const ixW = {}, ixR = {}, ixC = {};
for(let i = 0; i < W.length; i++) ixW[idW(i)] = i;
for(let i = 0; i < R.length; i++) ixR[idR(i)] = i;
for(let i = 0; i < C.length; i++) ixC[idC(i)] = i;
let orfas = 0;   // chaves guardadas que não existem mais na lista atual

function porId(obj, id){
  const o = {};
  for(const i in (obj || {})){ const k = id(+i); if(k) o[k] = obj[i]; }
  return o;
}
function porIndice(obj, ix){
  const o = {};
  for(const k in (obj || {})){
    const i = ix[String(k).toLowerCase()];
    if(i === undefined){ orfas++; continue; }
    o[i] = obj[k];
  }
  return o;
}
/* estado antigo vinha com a posição como chave: ainda casa, porque a
   lista não mudou desde então. Na primeira gravação já sai convertido. */
function porIndiceOuNumero(obj, ix){
  const chaves = Object.keys(obj || {});
  const numerico = chaves.length && chaves.every(k => /^\d+$/.test(k));
  if(numerico){ const o = {}; for(const k in obj) o[+k] = obj[k]; return o; }
  return porIndice(obj, ix);
}

/* formato compacto para caber com folga no limite do documento */
function packF(src){
  const o = {};
  for(const id in (src||{})){
    const x = src[id];
    o[id] = [x.s|0, x.n?Math.round(x.n/1000):0, x.l?Math.round(x.l/1000):0, x.e|0, x.a|0];
  }
  return o;
}
function unpackF(src){
  const o = {};
  for(const id in (src||{})){
    const a = src[id];
    o[id] = {s:a[0]|0, n:a[1]?a[1]*1000:null, l:a[2]?a[2]*1000:null, e:a[3]|0, a:a[4]|0};
  }
  return o;
}
/* O relâmpago guarda recordes (números puros, sempre válidos) e uma lista
   curta de palavras recém-sorteadas — essa vai por texto, como o resto. */
function packRel(r){
  if(!r) return null;
  return {seq:r.seq|0, acertos:r.acertos|0, tempo:r.tempo||null,
          rodadas:(r.rodadas||[]).slice(-REL_HIST),
          recentes:(r.recentes||[]).map(i => idW(+i)).filter(Boolean)};
}
function unpackRel(r, antigo){
  const o = {seq:0, acertos:0, tempo:null, rodadas:[], recentes:[]};
  if(!r) return o;
  o.seq = r.seq|0; o.acertos = r.acertos|0; o.tempo = r.tempo||null;
  o.rodadas = Array.isArray(r.rodadas) ? r.rodadas : [];
  const rec = Array.isArray(r.recentes) ? r.recentes : [];
  o.recentes = antigo ? rec.map(x => +x).filter(x => x === x)
                      : rec.map(k => ixW[String(k).toLowerCase()]).filter(i => i !== undefined);
  return o;
}
/* O antecipar guarda só números e o histórico de rodadas — nada preso a
   índice de palavra, então nenhuma atualização de conteúdo o afeta. */
function packAnt(a){
  if(!a) return null;
  return {f:a.feitas|0, c:a.cheios|0, r:(a.rodadas||[]).slice(-ANT_HIST)};
}
function unpackAnt(a){
  const o = {feitas:0, cheios:0, perto:0, rodadas:[], itens:null, i:0};
  if(!a) return o;
  o.feitas = a.f|0; o.cheios = a.c|0;
  o.rodadas = Array.isArray(a.r) ? a.r : [];
  return o;
}
function pack(){
  const w = {}, d = {};
  for(const id in S.w){
    const x = S.w[id], k = idW(+id);
    if(!k) continue;
    w[k] = [x.s|0, x.n?Math.round(x.n/1000):0, x.l?Math.round(x.l/1000):0, x.e|0, x.a|0, x.m?1:0, x.r?1:0];
  }
  for(const k in S.dias){
    const y = S.dias[k];
    d[k] = [y.novas|0, y.revs|0, y.dom|0, y.li?1:0, y.sp?1:0, y.gr?1:0, y.limpo?1:0, y.red|0, y.chk|0, y.txt|0, y.rel|0, y.ant|0, y.wr?1:0];
  }
  return {f:4, cv:CONTEUDO, criado:S.criado||Date.now(), ultimo:S.ultimo||0,
          w, dias:d,
          pav:porId(S.pav, idW), img:porId(S.img, idW),
          r:porId(packF(S.r), idR), c:porId(packF(S.c), idC),
          fd:S.frasesDesde||null, txt:(S.txt||[]).slice(0,MAX_TXT_GUARDADOS),
          rel:packRel(S.rel), ant:packAnt(S.ant)};
}
function unpack(p){
  if(!p) return null;
  if(p.f !== 2 && p.f !== 3 && p.f !== 4) return (p.w && p.dias) ? p : null;
  orfas = 0;
  const antigo = p.f !== 4;
  const o = {v:1, criado:p.criado||Date.now(), ultimo:p.ultimo||0, w:{}, dias:{},
             pav: antigo ? (p.pav||{}) : porIndiceOuNumero(p.pav, ixW),
             img: antigo ? (p.img||{}) : porIndiceOuNumero(p.img, ixW),
             r: unpackF(antigo ? p.r : porIndiceOuNumero(p.r, ixR)),
             c: unpackF(antigo ? p.c : porIndiceOuNumero(p.c, ixC)),
             frasesDesde:p.fd||null, txt:Array.isArray(p.txt)?p.txt:[],
             rel:unpackRel(p.rel, antigo), ant:unpackAnt(p.ant)};
  for(const id in p.w){
    const a = p.w[id];
    let i = id;
    if(!antigo){
      i = ixW[String(id).toLowerCase()];
      if(i === undefined){ orfas++; continue; }
    }
    o.w[i] = {s:a[0]|0, n:a[1]?a[1]*1000:null, l:a[2]?a[2]*1000:null, e:a[3]|0, a:a[4]|0, m:!!a[5], r:!!a[6]};
  }
  for(const k in p.dias){
    const a = p.dias[k];
    o.dias[k] = {novas:a[0]|0, revs:a[1]|0, dom:a[2]|0, li:!!a[3], sp:!!a[4], gr:!!a[5], limpo:!!a[6], red:a[7]|0, chk:a[8]|0, txt:a[9]|0, rel:a[10]|0, ant:a[11]|0, wr:!!a[12]};
  }
  return o;
}
function schedulePush(){
  if(!dbRef) return;
  setSync("wait");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushRemote, 1200);
}
/* grava na hora quando a aba sai da frente ou fecha: nada fica pendente */
function flushPush(){
  if(!dbRef || !pushTimer) return;
  clearTimeout(pushTimer); pushTimer = null;
  pushRemote();
}
document.addEventListener("visibilitychange", () => { if(document.hidden) flushPush(); });
window.addEventListener("pagehide", flushPush);
window.addEventListener("blur", flushPush);
async function pushRemote(){
  if(!dbRef) return;
  if(pushing){ pushAgain = true; return; }
  pushing = true;
  try{ await dbRef.set(pack()); setSync("on"); }
  catch(e){ setSync("wait"); }
  finally{
    pushing = false;
    if(pushAgain){ pushAgain = false; setTimeout(pushRemote, 500); }
  }
}
/* dbRef "de mentira" que fala com o Supabase pela REST (PostgREST), com a
   mesma forma (get/set) que o dbRef do Claude Artifact usa. */
function supaRef(){
  return {
    get: async () => {
      const r = await fetch(SUPA_URL + "/rest/v1/estado?id=eq." + SUPA_ROW + "&select=dados", {
        headers: { apikey: SUPA_KEY, Authorization: "Bearer " + SUPA_KEY }
      });
      if(!r.ok) throw new Error("supa get " + r.status);
      const rows = await r.json();
      const dados = rows.length ? rows[0].dados : null;
      return { exists: !!dados, data: () => dados };
    },
    set: async (obj) => {
      const r = await fetch(SUPA_URL + "/rest/v1/estado", {
        method: "POST",
        headers: {
          apikey: SUPA_KEY, Authorization: "Bearer " + SUPA_KEY,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates,return=minimal"
        },
        body: JSON.stringify([{ id: SUPA_ROW, dados: obj }])
      });
      if(!r.ok) throw new Error("supa set " + r.status);
    }
  };
}
function normaliza(o){
  if(!o) return o;
  if(!o.pav) o.pav = {};
  if(!o.r) o.r = {};
  if(!o.img) o.img = {};
  if(!Array.isArray(o.txt)) o.txt = [];
  if(!o.c) o.c = {};
  if(!o.frasesDesde) o.frasesDesde = dayKey();
  if(!o.rel) o.rel = {seq:0, acertos:0, tempo:null, rodadas:[], recentes:[]};
  if(!Array.isArray(o.rel.rodadas)) o.rel.rodadas = [];
  if(!Array.isArray(o.rel.recentes)) o.rel.recentes = [];
  if(!o.ant) o.ant = {feitas:0, cheios:0, perto:0, rodadas:[], itens:null, i:0};
  if(!Array.isArray(o.ant.rodadas)) o.ant.rodadas = [];
  return o;
}
function adota(remoto, msg){
  S = normaliza(remoto);
  try{ localStorage.setItem(STORE, JSON.stringify(pack())); }catch(e){}
  render();
  if(msg) toast(msg);
}
async function initSync(){
  let db = null;
  try{ db = (window.claude && window.claude.use) ? await window.claude.use("db") : null; }catch(e){ db = null; }
  if(db){
    dbRef = db.doc("estado/principal");
    try{
      const snap = await dbRef.get();
      const remoto = snap.exists ? unpack(snap.data()) : null;
      if(remoto && (remoto.ultimo||0) > (S.ultimo||0)) adota(remoto, null);
      else if(!remoto || (S.ultimo||0) > (remoto.ultimo||0)) await pushRemote();
      setSync("on");
    }catch(e){ setSync("wait"); }
    dbUnsub = dbRef.onSnapshot(snap => {
      if(!snap.exists || snap.metadata.hasPendingWrites) return;
      const r = unpack(snap.data());
      if(!r || (r.ultimo||0) <= (S.ultimo||0)) return;
      if(SESSION) return;                       // não troca o estado no meio de uma sessão
      adota(r, "Progresso atualizado do outro aparelho.");
      setSync("on");
    }, () => { dbRef = null; dbUnsub = null; setSync("off"); });
    return;
  }
  /* fora do Claude Artifact (ex: GitHub Pages): usa o Supabase, se configurado */
  if(!SUPA_URL || !SUPA_KEY){ setSync("off"); return; }
  dbRef = supaRef();
  try{
    const snap = await dbRef.get();
    const remoto = snap.exists ? unpack(snap.data()) : null;
    if(remoto && (remoto.ultimo||0) > (S.ultimo||0)) adota(remoto, null);
    else if(!remoto || (S.ultimo||0) > (remoto.ultimo||0)) await pushRemote();
    setSync("on");
  }catch(e){ setSync("wait"); }
  /* sem tempo real por REST simples: ao voltar pra aba, busca de novo pra
     pegar o que foi feito no outro aparelho */
  document.addEventListener("visibilitychange", async () => {
    if(document.hidden || !dbRef || SESSION) return;
    try{
      const snap = await dbRef.get();
      const r = snap.exists ? unpack(snap.data()) : null;
      if(r && (r.ultimo||0) > (S.ultimo||0)) adota(r, "Progresso atualizado do outro aparelho.");
      setSync("on");
    }catch(e){ setSync("wait"); }
  });
}
async function writeFile(){
  if(!fileHandle) return;
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(S));
    await w.close();
  }catch(e){ console.warn("arquivo", e); }

/* handle do arquivo guardado no IndexedDB */
function idb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("fluencia_fs",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("kv");
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function idbSet(k,v){ const db = await idb(); return new Promise(r=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=r; }); }
async function idbGet(k){ const db = await idb(); return new Promise(r=>{ const t=db.transaction("kv","readonly"); const q=t.objectStore("kv").get(k); q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }); }

async function connectFile(){
  if(!window.showSaveFilePicker){ toast("Aqui não dá para conectar arquivo. Use Exportar, na aba Dados, para guardar uma cópia."); return; }
  try{
    const h = await window.showSaveFilePicker({
      suggestedName: "dados-ingles.json",
      types:[{description:"Dados do sistema", accept:{"application/json":[".json"]}}]
    });
    fileHandle = h; await idbSet("fh", h); await writeFile();
    toast("Arquivo conectado. Seu progresso é salvo nele a cada ação.");

  }catch(e){}
}
async function restoreFile(){
  if(!window.showSaveFilePicker) return;
  try{
    const h = await idbGet("fh");
    if(!h) return;
    const p = await h.queryPermission({mode:"readwrite"});
    if(p === "granted"){ fileHandle = h; }
    else { window.__pendingHandle = h; }
  }catch(e){}
}
async function reauthFile(){
  const h = window.__pendingHandle; if(!h) return connectFile();
  const p = await h.requestPermission({mode:"readwrite"});
  if(p === "granted"){ fileHandle = h; window.__pendingHandle = null; await writeFile(); toast("Arquivo reconectado."); render(); }
}
async function exportJSON(){
  const nome = "dados-ingles-" + dayKey() + ".json";
  const txt = JSON.stringify(S, null, 1);
  try{
    const dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
    if(dl){ await dl.save({filename:nome, data:txt}); toast("Cópia salva."); return; }
  }catch(e){
    if(e && e.code === "declined") return;
    if(e && e.code) { toast("Não deu para salvar a cópia agora."); return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], {type:"application/json"}));
  a.download = nome;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  toast("Cópia baixada.");
}
function importJSON(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    try{
      const j = JSON.parse(await f.text());
      if(!j || !j.w || !j.dias) throw 0;
      if(!(await confirmar("Isso substitui o progresso atual pelo do arquivo. Continuar?"))) return;
      S = normaliza(j); save(); toast("Progresso restaurado."); render();
    }catch(e){ toast("Arquivo inválido."); }
  };
  inp.click();
}

const $ = s => document.querySelector(s);
const el = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2600); }
/* modal próprio pra confirmação: o Artifact publicado roda num iframe sandboxed
   que bloqueia silenciosamente confirm() nativo (sem erro, sem aviso — só
   retorna false na hora). Todo "tem certeza?" do sistema passa por aqui. */
function confirmar(msg, msg2){
  return new Promise(res => {
    const box = el(`<div class="modal">
      <div class="card" style="max-width:420px;width:100%;background:var(--panel-2)">
        <div style="font-size:15px;color:var(--ink);line-height:1.5;margin-bottom:${msg2?"8px":"18px"}">${esc(msg)}</div>
        ${msg2 ? `<div class="mini" style="margin-bottom:18px">${esc(msg2)}</div>` : ""}
        <div class="acts" style="justify-content:flex-end">
          <button class="btn ghost" id="cfN">Cancelar</button>
          <button class="btn bad" id="cfS">Confirmar</button>
        </div>
      </div></div>`);
    document.body.appendChild(box);
    const fim = v => { box.remove(); res(v); };
    box.onclick = e => { if(e.target === box) fim(false); };
    box.querySelector("#cfN").onclick = () => fim(false);
    box.querySelector("#cfS").onclick = () => fim(true);
  });
}

function nextAction(){
  const d = today(), c = counts(), due = dueList();
  if(due.length) return {t:"rev", txt:`Revisar ${due.length} ${plural(due.length,"palavra","palavras")}`, sub:`${Math.ceil(due.length*10/60)} min estimados`, run:()=>startReview(due)};
  if(d.novas < GOAL_NEW && c.nova > 0){
    const falta = GOAL_NEW - d.novas, n = Math.min(BATCH, falta);
    return {t:"new", txt:`Aprender ${n} ${plural(n,"palavra nova","palavras novas")}`, sub:`Lote de ${BATCH} · faltam ${falta} hoje`, run:()=>startLearn()};
  }
  const redDue = fDue("red"), redNov = fFaltaHoje("red");
  if(redDue.length || redNov){
    const n = redDue.length || redNov;
    return {t:"red",
      txt: redDue.length ? `Revisar ${n} ${plural(n,"redução","reduções")}` : `Treinar ${n} ${plural(n,"redução nova","reduções novas")}`,
      sub: "Fala conectada: gonna, lemme, gaddit. O ouvido vem antes da regra.",
      run:()=>startFrases("red")};
  }
  const chkDue = fDue("chk"), chkNov = fFaltaHoje("chk");
  if(chkDue.length || chkNov){
    const n = chkDue.length || chkNov;
    return {t:"chk",
      txt: chkDue.length ? `Revisar ${n} ${plural(n,"bloco","blocos")}` : `Aprender ${n} ${plural(n,"bloco novo","blocos novos")}`,
      sub: "Frases prontas que saem inteiras na conversa.",
      run:()=>startFrases("chk")};
  }
  const faltaTxt = Math.max(0, GOAL_TXT - textosHoje().length);
  const naoLidos = textosHoje().filter(t => !t.lido).length;
  if(temLeitura() && (faltaTxt || naoLidos)){
    return {t:"txt",
      txt: naoLidos ? `Ler ${naoLidos} ${plural(naoLidos,"texto","textos")} do dia` : `Escrever ${faltaTxt} ${plural(faltaTxt,"texto","textos")} do dia`,
      sub: "História nova com as palavras que você já domina. Som, inglês, tradução.",
      run:()=>go("ler")};
  }
  if(!d.rel){
    const rr = relEstado();
    return {t:"rel", txt:`Relâmpago — ${REL_SEG} segundos`,
      sub: rr.seq ? `Velocidade de reconhecimento. Seu recorde: ${rr.seq} seguidas.`
                  : "Velocidade de reconhecimento. Palavra na tela, duas opções, sem pensar muito.",
      run:()=>startRelampago()};
  }
  if(!d.li) return {t:"li", txt:"Listening — 20 minutos", sub:"Música ou série. Marque quando terminar.", run:()=>{ d.li = true; save(); toast("Listening concluído."); render(); }};
  if(!d.sp) return {t:"sp", txt:"Speaking — 20 minutos", sub:"Shadowing ou cantar. Marque quando terminar.", run:()=>{ d.sp = true; save(); toast("Speaking concluído."); render(); }};
  if(!d.gr) return {t:"gr", txt:"Grammar — 20 minutos", sub:"To be e have. Marque quando terminar.", run:()=>{ d.gr = true; save(); toast("Grammar concluído."); render(); }};
  const pool = dominioPool();
  if(pool.sol.length + pool.dm.length > 0 && d.dom < 10)
    return {t:"dom", txt:"Treino de domínio", sub:`${pool.sol.length} ${plural(pool.sol.length,"palavra sólida","palavras sólidas")} esperando o teste final`, run:()=>startDominio()};
  return {t:"done", txt:"Dia completo", sub:"Missão cumprida. Volte amanhã.", run:null};
}

function anel(frac, pronto, dentro){
  const r = 26, c = 2 * Math.PI * r;
  const cor = pronto ? "var(--solida)" : "var(--amber)";
  const off = c * (1 - Math.max(0, Math.min(1, frac)));
  return `<div class="anel">
    <svg viewBox="0 0 62 62" width="62" height="62" aria-hidden="true">
      <circle class="anel-bg" cx="31" cy="31" r="${r}"></circle>
      <circle class="anel-fg" cx="31" cy="31" r="${r}" style="stroke:${cor};stroke-dasharray:${c.toFixed(1)};stroke-dashoffset:${off.toFixed(1)}"></circle>
    </svg><b style="color:${pronto ? "var(--solida)" : "var(--ink)"}">${dentro}</b></div>`;
}
function trilha(nome, feito, meta, sub, ativa){
  const pronto = feito >= meta;
  return `<div class="trilha ${ativa ? "ativa" : ""}">

    <div>
      <div class="tt">${nome}</div>
      <div class="ts">${esc(sub)}</div>
    </div>
  </div>`;
}

/* ============================ SESSÃO: APRENDER ============================ */
function startLearn(){
  const d = today();
  const falta = Math.max(0, GOAL_NEW - d.novas);
  const n = Math.min(BATCH, falta || BATCH);
  const ids = nextNewIds(n);
  if(!ids.length){ toast("Não há mais palavras novas no Level 1."); return; }
  SESSION = new LearnSession(ids);
  render();
}
class LearnSession{
  constructor(ids){
    this.ids = ids; this.i = 0; this.step = 0; this.done = 0;
    this.revealed = false; this.timer = null; this.left = 12;
    this.chute = "";
    this.extra = null;   // revisão do lote
    this.fase = "learn";
  }
  get id(){ return this.ids[this.i]; }
  render(v){
    if(this.fase === "extra") return this.renderExtra(v);
    if(this.fase === "end") return this.renderEnd(v);
    const w = W[this.id];
    const steps = [
      {n:"01 — Significado", body:`<div class="word-pt">${esc(cap(w[0]))}</div>`},
      {n:"02 — Como fala",   body:`<div class="word-pt" style="font-size:24px;color:var(--tx2)">${esc(cap(w[0]))}</div>
                                   <div class="pron">${esc(w[1])}</div>
                                   <div class="mini">Leia em voz alta 3 vezes.</div>`},
      {n:"03 — PAV",         body:`${blocoImagem(this.id)}<div class="pav">${esc(pavOf(this.id))}</div>${this.linkEdit()}`},
      {n:"04 — Visualização",body:`<div class="muted" style="font-size:15px">Feche os olhos e veja a cena acontecendo.<br>No fim, diga a palavra em voz alta.</div>${this.ring()}`},
      {n:"05 — Como escreve",body:`<div class="word-en">${esc(w[2])}</div>${blocoFamilia(this.id)}<div class="mini">Grave a forma escrita.</div>`},
      {n:"06 — Recall",      body:this.revealed
          ? `<div class="pron">${esc(w[1])}</div><div class="word-en">${esc(w[2])}</div>${linhaChute(this.chute, w[2])}`
          : `<div class="muted" style="font-size:15px">Como se escreve em inglês?</div><div class="word-pt">${esc(cap(w[0]))}</div>${campoChute("escreva sua resposta")}`}
    ];
    const st = steps[this.step];
    const tot = this.ids.length;
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="bar"><i style="width:${pct(this.i*6+this.step, tot*6)}%"></i></div>
          <div class="mini">${this.i+1} / ${tot}</div>
        </div>
        <div class="stage">
          <div class="step">${st.n}</div>
          ${st.body}
          <div class="acts" id="acts"></div>
        </div>
        <div class="kbd">${this.step===5 && !this.revealed ? `<span>espaço</span> revelar` : this.step===5 ? `<span>1</span> errei &nbsp; <span>2</span> acertei` : `<span>espaço</span> continuar`}</div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair da sessão? O que já foi feito está salvo.")) go("home"); };
    const a = $("#acts");
    if(this.step === 3){
      a.innerHTML = `<button class="btn" id="pular">Pular espera</button>`;
      $("#pular").onclick = () => this.next();
      this.startRing();
    } else if(this.step === 5){
      if(!this.revealed){
        a.innerHTML = `<button class="btn pri lg" id="rev">Ver resposta</button>`;
        const revelar = () => { this.chute = valorChute(); this.revealed = true; this.render($("#view")); };
        $("#rev").onclick = revelar;
        ligaChute(revelar);
      } else {
        a.innerHTML = `<button class="btn bad" id="err">Errei</button><button class="btn ok" id="ok">Acertei</button>`;
        $("#err").onclick = () => this.answer(false);
        $("#ok").onclick = () => this.answer(true);
        sugereBotao(this.chute, w[2]);
      }
    } else {
      a.innerHTML = `<button class="btn pri" id="nx">Continuar</button>`;
      $("#nx").onclick = () => this.next();
    }
    const ed = $("#edPav"); if(ed) ed.onclick = () => editarPav(this.id, () => this.render($("#view")));
  }
  linkEdit(){ return `<div class="row" style="justify-content:center;gap:8px"><button class="edt" id="edPav">editar PAV</button>${botaoImagem(this.id)}</div>`; }
  ring(){
    return `<div class="ring"><svg width="96" height="96"><circle cx="48" cy="48" r="42" stroke="#272B33" stroke-width="5" fill="none"/>
      <circle id="rc" cx="48" cy="48" r="42" stroke="#5B8DEF" stroke-width="5" fill="none" stroke-linecap="round"
      stroke-dasharray="264" stroke-dashoffset="0"/></svg><b id="rt">12</b></div>`;
  }
  startRing(){
    clearInterval(this.timer); this.left = 12;
    this.timer = setInterval(()=>{
      this.left--;
      const rt = $("#rt"), rc = $("#rc");
      if(!rt){ clearInterval(this.timer); return; }
      rt.textContent = Math.max(0,this.left);
      if(rc) rc.setAttribute("stroke-dashoffset", String(264 * (1 - this.left/12)));
      if(this.left <= 0){ clearInterval(this.timer); this.next(); }
    }, 1000);
  }
  next(){
    clearInterval(this.timer);
    if(this.step < 5){ this.step++; this.revealed = false; this.render($("#view")); return; }
  }
  answer(ok){
    vibrar(ok);
    const id = this.id, w = wd(id);
    w.l = w.l || Date.now(); w.s = 0; w.a++; if(!ok){ w.e++; }
    scheduleNext(w);
    today().novas++;
    S.ultimo = Date.now();
    save();
    if(!ok) toast("Sem problema. Ela volta em 1 hora.");
    this.done++;
    clearInterval(this.timer);
    this.chute = "";
    if(this.i + 1 < this.ids.length){
      this.i++; this.step = 0; this.revealed = false; this.render($("#view"));
    } else {
      // fim do lote: 1 palavra antiga
      const due = dueList().filter(x => !this.ids.includes(x));
      if(due.length){ this.extra = due[0]; this.fase = "extra"; this.exRevealed = false; this.render($("#view")); }
      else { this.fase = "end"; this.render($("#view")); }
    }
  }
  renderExtra(v){
    const id = this.extra, w = W[id], st = S.w[id], target = st.s + 1, m = modeFor(target);
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <span class="pill s-rev"><span class="dotc"></span>Revisão do lote</span>
          <div class="bar"><i style="width:100%"></i></div>
          <div class="mini">extra</div>
        </div>
        <div class="stage">
          <div class="step">Revisão ${target} de 8 · ${SCHED[target-1].nome}</div>
          ${cardFront(w, m, this.exRevealed, id)}
          ${!this.exRevealed ? campoChute(m.pede === "en" ? "escreva em inglês" : "escreva em português") : ""}
          ${this.exRevealed ? cardBack(w, m, id) : ""}
          ${this.exRevealed ? linhaChute(this.exChute || "", m.pede === "en" ? w[2] : w[0]) : ""}
          <div class="acts" id="acts"></div>
        </div>
      </div>`;
    const a = $("#acts");
    if(!this.exRevealed){
      a.innerHTML = `<button class="btn pri lg" id="rev">Ver resposta</button>`;
      const revelar = () => { this.exChute = valorChute(); this.exRevealed = true; this.render($("#view")); };
      $("#rev").onclick = revelar;
      ligaChute(revelar);
    } else {
      a.innerHTML = `<button class="btn bad" id="err">Errei</button><button class="btn ok" id="ok">Acertei</button>`;
      $("#err").onclick = () => { applyReview(id,false); markClean(); this.fase="end"; this.render($("#view")); };
      $("#ok").onclick  = () => { applyReview(id,true);  markClean(); this.fase="end"; this.render($("#view")); };
      sugereBotao(this.exChute || "", m.pede === "en" ? w[2] : w[0]);
    }
  }
  renderEnd(v){
    const d = today();
    const full = d.novas >= GOAL_NEW;
    v.innerHTML = `
      <div class="sess">
        <div class="stage">
          <div class="celebrate">
            <div class="ic">${full ? "🔥" : "✓"}</div>
            <div style="font-size:22px;font-weight:650;letter-spacing:-.02em">${full ? "Vocabulário do dia completo" : "Lote concluído"}</div>
            <div class="muted" style="margin-top:6px">${d.novas} de ${GOAL_NEW} palavras novas hoje${this.extra?" · 1 revisão do lote":""}</div>
          </div>
          <div class="acts">
            ${!full && counts().nova ? `<button class="btn pri" id="mais">Próximo lote</button>` : ""}
            <button class="btn ghost" id="home">Voltar ao início</button>
          </div>
        </div>
      </div>`;
    if($("#mais")) $("#mais").onclick = () => startLearn();
    $("#home").onclick = () => go("home");
  }
  key(e){
    if(this.fase !== "learn") {
      if(e.key === " " && this.fase === "extra" && !this.exRevealed){ e.preventDefault(); this.exRevealed = true; this.render($("#view")); }
      return;
    }
    if(e.key === " "){
      e.preventDefault();
      if(this.step === 5 && !this.revealed){ this.revealed = true; this.render($("#view")); }
      else if(this.step < 5) this.next();
    }
    if(this.step === 5 && this.revealed){
      if(e.key === "1") this.answer(false);
      if(e.key === "2") this.answer(true);
    }
  }
}

/* ============================ CARTÃO DE REVISÃO ============================ */
function cardFront(w, m, revealed, id){
  if(revealed) return "";
  const pav = esc(pavOf(id)), img = blocoImagem(id);
  if(m.mostra === "pt+pav")  return `<div class="word-pt">${esc(cap(w[0]))}</div>${img}<div class="pav">${pav}</div>`;
  if(m.mostra === "en+pav")  return `<div class="word-en">${esc(w[2])}</div>${img}<div class="pav">${pav}</div>`;
  if(m.mostra === "pav")     return `${img}<div class="pav" style="font-size:21px">${pav}</div>`;
  // revisões 7 e 8: só o português. A imagem entra borrada, como isca —
  // a lacuna de curiosidade fecha quando você revela.
  return `<div class="word-pt">${esc(cap(w[0]))}</div>
          ${img ? `<div class="pavimg sm borrada"><img src="${imgSrc(imgOf(id))}" alt=""></div>` : ""}
          <div><span class="curio">${esc(curiosidade(id))}</span></div>`;
}
function cardBack(w, m, id){
  return `<div class="word-pt" style="font-size:22px;color:var(--tx2)">${esc(cap(w[0]))}</div>
          <div class="pron">${esc(w[1])}</div>
          <div class="word-en" style="font-size:30px">${esc(w[2])}</div>
          ${blocoFamilia(id)}
          ${blocoImagem(id, "sm")}`;
}
function applyReview(id, ok){
  const w = wd(id);
  w.a++;
  today().revs++;
  if(ok){
    w.s = Math.min(8, w.s + 1);
    w.r = false;
    if(w.s >= 8) w.m = true;
    scheduleNext(w);
  } else {
    w.e++; w.r = true;
    if(w.m) w.m = false;
    w.n = atHour(addDays(new Date(),1), 9);
  }
  S.ultimo = Date.now();
  save();
}

/* ============================ SESSÃO: REVISÃO ============================ */
function startReview(ids){
  if(!ids || !ids.length){ toast("Nenhuma revisão pendente."); return; }
  SESSION = new ReviewSession(ids.slice());
  render();
}
class ReviewSession{
  constructor(q){
    this.q = q.map(id => ({id, redo:false}));
    this.total = q.length; this.feitas = 0; this.acertos = 0;
    this.revealed = false; this.hinted = false; this.chute = "";
    this.seq = 0; this.melhor = 0; this.ultimoErrado = false;
    this.fecho = null; this.fechoFeito = false; this.fechoVisto = false;
  }
  render(v){
    if(!this.q.length) return this.renderFim(v);
    const {id, redo} = this.q[0];
    const w = W[id], st = S.w[id], target = Math.min(8, st.s + 1), m = modeFor(target);
    const hintable = target >= 5;
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="bar"><i style="width:${pct(this.feitas, this.total)}%"></i></div>
          <div class="mini">${this.feitas} / ${this.total}</div>
        </div>
        <div class="stage">
          <div class="row" style="justify-content:center;gap:8px">
            <div class="step">Revisão ${target} de 8 · ${SCHED[target-1].nome}</div>
            ${redo ? `<span class="redo">reteste</span>` : ""}
          </div>
          ${cardFront(w, m, this.revealed, id)}
          ${this.hinted && !this.revealed ? `<div class="hintbox">${target>=7 ? esc(pavOf(id)) : esc(cap(w[0]))}</div>${target>=7 ? blocoImagem(id, "sm") : ""}` : ""}
          ${!this.revealed ? campoChute(m.pede === "en" ? "escreva em inglês" : "escreva em português") : ""}
          ${this.revealed ? cardBack(w, m, id) : ""}
          ${this.revealed ? linhaChute(this.chute, m.pede === "en" ? w[2] : w[0]) : ""}
          ${this.revealed && this.lastWrong ? `<div class="hintbox" style="border-color:#6B2C28">${esc(pavOf(id))}<div class="mini" style="margin-top:8px;color:var(--ref)">Fale a palavra em voz alta 3 vezes. Ela volta daqui a pouco.</div></div>` : ""}
          <div class="acts" id="acts"></div>
          ${this.revealed ? `<div class="row" style="justify-content:center;gap:8px"><button class="edt" id="edPav">editar PAV</button>${botaoImagem(id)}</div>` : ""}
        </div>
        <div class="kbd">${this.revealed ? `<span>1</span> errei &nbsp; <span>2</span> acertei` : `<span>espaço</span> ver resposta`}</div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair da revisão? O que já foi feito está salvo.")) go("home"); };
    const a = $("#acts");
    if(!this.revealed){
      a.innerHTML = `${hintable && !this.hinted ? `<button class="btn ghost" id="dica">Dica</button>` : ""}<button class="btn pri lg" id="rev">Ver resposta</button>`;
      if($("#dica")) $("#dica").onclick = () => { this.chute = valorChute(); this.hinted = true; this.render($("#view")); };
      $("#rev").onclick = () => this.reveal();
      ligaChute(() => this.reveal());
    } else {
      a.innerHTML = `<button class="btn bad" id="err">Errei</button><button class="btn ok" id="ok">Acertei</button>`;
      $("#err").onclick = () => this.answer(false);
      $("#ok").onclick = () => this.answer(true);
      $("#edPav").onclick = () => editarPav(id, () => this.render($("#view")));
      sugereBotao(this.chute, m.pede === "en" ? w[2] : w[0]);
    }
  }
  reveal(){ this.chute = valorChute() || this.chute; this.revealed = true; this.lastWrong = false; this.render($("#view")); }
  answer(ok){
    const item = this.q.shift();
    const realOk = ok && !this.hinted;
    vibrar(realOk);
    this.seq = realOk ? (this.seq || 0) + 1 : 0;
    this.melhor = Math.max(this.melhor || 0, this.seq);
    this.ultimoErrado = !realOk;
    if(!item.redo){
      applyReview(item.id, realOk);
      this.feitas++;
      if(realOk) this.acertos++;
    } else if(realOk){
      const w = wd(item.id); w.r = false; save();
    }
    if(!realOk){
      if(this.hinted && ok) toast("Usou a dica: conta como erro.");
      const vezes = (item.vezes || 0) + 1;
      if(vezes <= 2){
        const pos = Math.min(this.q.length, 3);
        this.q.splice(pos, 0, {id:item.id, redo:true, vezes});
      }
    }
    this.revealed = false; this.hinted = false; this.lastWrong = false; this.chute = "";
    markClean();
    this.render($("#view"));
  }
  /* A gente julga a sessão pelo pico e pelo fim. Terminar num erro deixa
     lembrança ruim, então entra uma carta fácil para fechar em alta. */
  renderFim(v){
    // sessão com tropeço termina numa carta fácil: o que fica na lembrança
    // é o pico e o fim, não a média
    if(this.acertos < this.feitas && !this.fechoFeito && this.feitas >= 3){
      const pool = [];
      for(let i = 0; i < W.length && pool.length < 40; i++){
        const x = S.w[i];
        if(x && x.l && !x.r && (x.m || x.s >= 5)) pool.push(i);
      }
      if(pool.length){
        this.fechoFeito = true;
        this.fecho = pool[Math.floor(Math.random() * pool.length)];
      }
    }
    if(this.fecho !== null && this.fecho !== undefined) return this.renderFecho(v);
    return this.renderEnd(v);
  }
  renderFecho(v){
    const id = this.fecho, w = W[id];
    v.innerHTML = `
      <div class="sess">
        <div class="stage">
          <div class="step" style="color:var(--solida)">Fechando em alta · não vale nota</div>
          <div class="word-pt">${esc(cap(w[0]))}</div>
          ${this.fechoVisto ? `<div class="word-en" style="font-size:30px;color:var(--solida)">${esc(w[2])}</div>` : `<div class="mini">Uma que você já domina. Diga em inglês.</div>`}
          <div class="acts" id="acts"></div>
        </div>
      </div>`;
    const a = $("#acts");
    if(!this.fechoVisto){
      a.innerHTML = `<button class="btn pri lg" id="rev">Ver</button>`;
      $("#rev").onclick = () => { this.fechoVisto = true; vibrar(true); this.render($("#view")); };
    } else {
      a.innerHTML = `<button class="btn ok" id="fim">Encerrar</button>`;
      $("#fim").onclick = () => { this.fecho = null; this.render($("#view")); };
    }
  }
  renderEnd(v){
    const rest = dueList().length;
    v.innerHTML = `
      <div class="sess">
        <div class="stage">
          <div class="celebrate">
            <div class="ic">✓</div>
            <div style="font-size:22px;font-weight:650;letter-spacing:-.02em">Revisões em dia</div>
            <div class="muted" style="margin-top:6px">${this.feitas} ${plural(this.feitas,"revisão","revisões")} · ${pct(this.acertos,this.total)}% de acerto</div>
            ${(this.melhor||0) >= 3 ? `<div class="mini" style="margin-top:8px;color:var(--solida)">melhor sequência da sessão: ${this.melhor} seguidas</div>` : ""}
          </div>
          <div class="acts">
            ${rest ? `<button class="btn pri" id="mais">Revisar mais ${rest}</button>` : ""}
            <button class="btn ghost" id="home">Voltar ao início</button>
          </div>
        </div>
      </div>`;
    if($("#mais")) $("#mais").onclick = () => startReview(dueList());
    $("#home").onclick = () => go("home");
  }
  key(e){
    if(!this.q.length) return;
    if(e.key === " " && !this.revealed){ e.preventDefault(); this.reveal(); }
    if(this.revealed){
      if(e.key === "1") this.answer(false);
      if(e.key === "2") this.answer(true);
    }
  }
}
