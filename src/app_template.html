/* ============================ RELÂMPAGO ============================ */
/* 30 segundos, uma palavra por vez, duas opções. O que este treino mede é
   TEMPO DE REAÇÃO, não memória — por isso ele não avança estágio nenhum e
   não mexe na agenda de revisão. Fala real chega a 150 palavras por minuto:
   saber a palavra em 2 segundos é o mesmo que não saber. */
const REL_SEG = 30;          // duração da rodada
const REL_RECENTES = 80;     // palavras que não repetem na rodada seguinte
const REL_HIST = 60;         // rodadas guardadas para a linha do tempo
const REL_MIN_TEMPO = 8;     // acertos mínimos para o tempo médio valer recorde

function relEstado(){
  if(!S.rel) S.rel = {seq:0, acertos:0, tempo:null, rodadas:[], recentes:[]};
  const r = S.rel;
  if(!Array.isArray(r.rodadas)) r.rodadas = [];
  if(!Array.isArray(r.recentes)) r.recentes = [];
  return r;
}

/* ---- sorteio ---- */
/* Aleatório de verdade no banco inteiro (pedido dele em 25/09: com 3000
   palavras, não faz sentido travar sempre nas mesmas ~240 primeiras).
   Não toca na agenda de revisão nem exige palavra já estudada — zero risco,
   já que o relâmpago não mexe em SRS; errar uma que ele nunca viu não custa
   nada e ainda é exposição a mais. */
function relPool(){
  const evita = new Set(relEstado().recentes);
  const mistura = a => a.slice().sort(() => Math.random() - .5);
  const todas = []; for(let i = 0; i < W.length; i++) todas.push(i);
  let pool = mistura(todas.filter(i => !evita.has(i)));
  if(pool.length < 30) pool = pool.concat(mistura(todas.filter(i => evita.has(i))));
  return pool;
}

/* ---- distrator ---- */
/* Mesma classe gramatical e frequência parecida: obriga a reconhecer a
   palavra em vez de eliminar a opção absurda. */
const relTok = t => String(t || "").toLowerCase().split(/[\/,;()\s]+/).filter(x => x.length > 2);
function relColide(a, b){
  if(W[a][2].toLowerCase() === W[b][2].toLowerCase()) return true;
  const x = relTok(W[a][0]), y = relTok(W[b][0]);
  return x.some(t => y.indexOf(t) >= 0);
}
function relDistrator(id, usados){
  const classe = W[id][4], bloco = W[id][5];
  const acha = f => {
    const c = [];
    for(let i = 0; i < W.length; i++){
      if(i === id || usados.has(i)) continue;
      if(!f(i) || relColide(id, i)) continue;
      c.push(i);
    }
    return c.length ? c[Math.floor(Math.random() * c.length)] : null;
  };
  return acha(i => W[i][4] === classe && Math.abs(W[i][5] - bloco) <= 8)
      || acha(i => W[i][4] === classe)
      || acha(() => true);
}

function relMedia(itens){
  const bons = itens.filter(x => x.ok);
  if(!bons.length) return null;
  return Math.round(bons.reduce((s, x) => s + x.ms, 0) / bons.length);
}
const relSeg = ms => ms == null ? "—" : (ms / 1000).toFixed(2) + "s";

function startRelampago(){
  const pool = relPool();
  if(pool.length < 4){ toast("Sem palavras suficientes para o relâmpago."); return; }
  SESSION = new RelampagoSession(pool);
  render();
}

class RelampagoSession{
  constructor(pool){
    this.pool = pool; this.p = 0;
    this.fase = "pronto";          // pronto | contando | jogando | fim
    this.conta = 3;
    this.itens = []; this.atual = null;
    this.acertos = 0; this.erros = 0;
    this.seq = 0; this.melhorSeq = 0;
    this.usados = new Set();
    this.ultimo = null;
    this.fimEm = 0; this.timer = null; this.t0 = 0;
    this.recordes = null;
  }

  /* ---- ciclo ---- */
  comecar(){
    this.fase = "contando"; this.conta = 3;
    this.render($("#view"));
    const passo = () => {
      if(SESSION !== this) return;
      this.conta--;
      if(this.conta > 0){ this.render($("#view")); setTimeout(passo, 620); return; }
      this.jogar();
    };
    setTimeout(passo, 620);
  }
  jogar(){
    this.fase = "jogando";
    this.fimEm = performance.now() + REL_SEG * 1000;
    this.proxima();
    this.timer = setInterval(() => {
      if(SESSION !== this){ clearInterval(this.timer); return; }
      const resta = this.fimEm - performance.now();
      if(resta <= 0){ this.encerrar(); return; }
      const b = $("#relBar"), s = $("#relSeg");
      if(b) b.style.width = (resta / (REL_SEG * 1000) * 100).toFixed(1) + "%";
      if(s) s.textContent = (resta / 1000).toFixed(1);
    }, 80);
    this.render($("#view"));
  }
  proxima(){
    if(this.p >= this.pool.length) this.p = 0;
    const id = this.pool[this.p++];
    this.usados.add(id);
    const dist = relDistrator(id, this.usados);
    if(dist == null){ this.encerrar(); return; }
    this.usados.add(dist);
    const dir = Math.random() < .5 ? "en" : "pt";       // en: mostra inglês · pt: mostra português
    this.atual = {id, dist, dir, esq: Math.random() < .5};
    this.t0 = performance.now();
  }
  responder(certo){
    if(this.fase !== "jogando" || !this.atual) return;
    const a = this.atual, ms = Math.round(performance.now() - this.t0);
    vibrar(certo);
    if(certo){
      this.acertos++; this.seq++;
      if(this.seq > this.melhorSeq) this.melhorSeq = this.seq;
    } else { this.erros++; this.seq = 0; }
    this.itens.push({id:a.id, dist:a.dist, dir:a.dir, ok:certo, ms});
    this.ultimo = certo;          // pinta a arena da próxima carta por um instante
    this.proxima();
    if(this.fase === "jogando") this.render($("#view"));
  }
  encerrar(){
    clearInterval(this.timer); this.timer = null;
    this.fase = "fim";
    const rel = relEstado(), media = relMedia(this.itens);
    this.recordes = {
      seq: this.melhorSeq > (rel.seq || 0),
      acertos: this.acertos > (rel.acertos || 0),
      tempo: media != null && this.acertos >= REL_MIN_TEMPO && (rel.tempo == null || media < rel.tempo),
      antes: {seq: rel.seq || 0, acertos: rel.acertos || 0, tempo: rel.tempo}
    };
    if(this.recordes.seq) rel.seq = this.melhorSeq;
    if(this.recordes.acertos) rel.acertos = this.acertos;
    if(this.recordes.tempo) rel.tempo = media;
    if(this.itens.length){
      rel.rodadas.push([Date.now(), this.acertos, this.erros, this.melhorSeq, media || 0]);
      if(rel.rodadas.length > REL_HIST) rel.rodadas = rel.rodadas.slice(-REL_HIST);
      const novas = this.itens.map(x => x.id);
      rel.recentes = novas.concat(rel.recentes.filter(i => novas.indexOf(i) < 0)).slice(0, REL_RECENTES);
      today().rel = (today().rel || 0) + 1;
      save();
    }
    this.render($("#view"));
  }

  /* ---- telas ---- */
  render(v){
    if(this.fase === "fim") return this.renderFim(v);
    if(this.fase === "pronto") return this.renderPronto(v);
    if(this.fase === "contando") return this.renderConta(v);
    return this.renderJogo(v);
  }
  renderPronto(v){
    const rel = relEstado();
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="mini">Relâmpago · ${REL_SEG} segundos</div>
        </div>
        <div class="stage">
          <div class="rel-ic">⚡</div>
          <div style="font-size:26px;font-weight:700;letter-spacing:-.03em">Quantas você faz em ${REL_SEG} segundos?</div>
          <div class="muted" style="max-width:46ch;font-size:14.5px;line-height:1.55">
            Aparece uma palavra e duas opções. Toque na certa. Erro não para nada —
            no fim você vê tudo o que passou.
          </div>
          ${(rel.seq || rel.acertos) ? `<div class="rel-recs">
            <div><span>Recorde de sequência</span><b>${rel.seq || 0}</b></div>
            <div><span>Recorde de acertos</span><b>${rel.acertos || 0}</b></div>
            <div><span>Melhor tempo médio</span><b>${relSeg(rel.tempo)}</b></div>
          </div>` : ""}
          <div class="acts"><button class="btn pri lg" id="vai">Começar</button></div>
        </div>
        <div class="kbd"><span>1</span> opção da esquerda &nbsp; <span>2</span> opção da direita</div>
      </div>`;
    $("#sair").onclick = () => go("home");
    $("#vai").onclick = () => this.comecar();
  }
  renderConta(v){
    v.innerHTML = `<div class="sess"><div class="stage"><div class="rel-conta">${this.conta}</div></div></div>`;
  }
  renderJogo(v){
    const a = this.atual, w = W[a.id], d = W[a.dist];
    /* a carta é redesenhada a cada toque: o relógio tem que ser lido do tempo
       real, senão a barra volta para o começo toda vez que ele responde */
    const resta = Math.max(0, this.fimEm - performance.now());
    const pergunta = a.dir === "en" ? w[2] : cap(w[0]);
    const certa = a.dir === "en" ? cap(w[0]) : w[2];
    const errada = a.dir === "en" ? cap(d[0]) : d[2];
    const ops = a.esq ? [[certa, true], [errada, false]] : [[errada, false], [certa, true]];
    v.innerHTML = `
      <div class="sess rel-sess">
        <div class="rel-topo">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="rel-placar">
            <b class="ok">${this.acertos}</b><i>·</i><b class="bad">${this.erros}</b>
            ${this.seq >= 3 ? `<span class="rel-fogo">${this.seq} seguidas</span>` : ""}
          </div>
          <div class="rel-seg"><b id="relSeg">${(resta / 1000).toFixed(1)}</b>s</div>
        </div>
        <div class="rel-trilho"><i id="relBar" style="width:${(resta / (REL_SEG * 1000) * 100).toFixed(1)}%"></i></div>
        <div class="rel-arena ${this.ultimo === true ? "pulso-ok" : this.ultimo === false ? "pulso-bad" : ""}">
          <div class="rel-q">
            <div class="rel-dir">escolha ${a.dir === "en" ? "em português" : "em inglês"}</div>
            <div class="rel-alvo ${a.dir === "en" ? "en" : ""}">${esc(pergunta)}</div>
          </div>
          <div class="rel-ops">
            ${ops.map(([t, ok], i) => `<button class="rel-op" data-ok="${ok ? 1 : 0}"><span class="rel-n">${i + 1}</span>${esc(t)}</button>`).join("")}
          </div>
        </div>
      </div>`;
    $("#sair").onclick = () => { clearInterval(this.timer); go("home"); };
    v.querySelectorAll(".rel-op").forEach(b => b.onclick = () => this.responder(b.dataset.ok === "1"));
  }
  renderFim(v){
    const total = this.itens.length, media = relMedia(this.itens), rec = this.recordes || {};
    const errados = this.itens.filter(x => !x.ok), certos = this.itens.filter(x => x.ok);
    const linha = x => {
      const w = W[x.id], d = W[x.dist];
      const marcou = x.dir === "en" ? cap(d[0]) : d[2];
      return `<div class="rel-l ${x.ok ? "ok" : "bad"}">
        <div class="rel-par"><b>${esc(w[2])}</b><i>${esc(w[1])}</i><span>${esc(cap(w[0]))}</span></div>
        <div class="rel-meta">${x.ok ? relSeg(x.ms) : `marcou <em>${esc(marcou)}</em>`}</div>
      </div>`;
    };
    const medalha = (cond, txt) => cond ? `<div class="rel-med">🏅 ${txt}</div>` : "";
    v.innerHTML = `
      <div class="sess">
        <div class="stage" style="align-items:stretch;text-align:left">
          <div class="rel-fim">
            <div class="rel-ic">⚡</div>
            <div class="rel-placarF">
              <div><b class="ok">${this.acertos}</b><span>acertos</span></div>
              <div><b class="bad">${this.erros}</b><span>erros</span></div>
              <div><b>${this.melhorSeq}</b><span>maior sequência</span></div>
              <div><b>${relSeg(media)}</b><span>tempo médio</span></div>
            </div>
            ${medalha(rec.seq, `Novo recorde de sequência: ${this.melhorSeq} (antes ${rec.antes ? rec.antes.seq : 0})`)}
            ${medalha(rec.acertos, `Novo recorde de acertos: ${this.acertos} (antes ${rec.antes ? rec.antes.acertos : 0})`)}
            ${medalha(rec.tempo, `Novo melhor tempo médio: ${relSeg(media)} (antes ${relSeg(rec.antes ? rec.antes.tempo : null)})`)}
            ${total ? `<div class="mini" style="margin-top:2px">${total} ${plural(total, "palavra passou", "palavras passaram")} em ${REL_SEG} segundos · ${pct(this.acertos, total)}% de acerto</div>` : ""}
          </div>

          ${errados.length ? `<div class="rel-bloco">
            <div class="lbl" style="color:var(--ref)">Errou · ${errados.length}</div>
            ${errados.map(linha).join("")}
            <button class="btn sm" id="relRef">Mandar as que errei para reforço</button>
          </div>` : (total ? `<div class="rel-bloco"><div class="lbl" style="color:var(--solida)">Nenhum erro.</div></div>` : "")}

          ${certos.length ? `<div class="rel-bloco">
            <div class="lbl" style="color:var(--solida)">Acertou · ${certos.length}</div>
            ${certos.map(linha).join("")}
          </div>` : ""}

          <div class="acts">
            <button class="btn ghost" id="home">Voltar ao início</button>
            <button class="btn pri" id="dnv">Jogar de novo</button>
          </div>
        </div>
      </div>`;
    $("#home").onclick = () => go("home");
    $("#dnv").onclick = () => startRelampago();
    if($("#relRef")) $("#relRef").onclick = () => {
      let n = 0;
      errados.forEach(x => { if(isLearned(x.id) && !S.w[x.id].r){ S.w[x.id].r = true; n++; } });
      save();
      toast(n ? `${n} ${plural(n, "palavra marcada", "palavras marcadas")} para reforço.`
              : "Essas ainda não entraram no estudo — elas vêm na ordem normal.");
      $("#relRef").disabled = true;
    };
  }
  key(e){
    if(this.fase === "pronto" && (e.key === " " || e.key === "Enter")){ e.preventDefault(); this.comecar(); return; }
    if(this.fase !== "jogando") return;
    const b = document.querySelectorAll(".rel-op");
    if(e.key === "1" && b[0]) b[0].click();
    if(e.key === "2" && b[1]) b[1].click();
  }
}

/* ============================ SESSÃO: FRASES ============================ */
function startFrases(k){
  const due = fDue(k);
  const novas = fNovas(k, fFaltaHoje(k));
  const fila = due.map(id=>({id, novo:false})).concat(novas.map(id=>({id, novo:true})));
  if(!fila.length){
    toast(fCounts(k).nova ? `Meta de ${DECK[k].nome.toLowerCase()} já cumprida hoje.` : `Você já viu todos os ${DECK[k].nome.toLowerCase()}.`);
    return;
  }
  SESSION = new FrasesSession(k, fila);
  render();
}
class FrasesSession{
  constructor(k, fila){
    this.k = k; this.fila = fila;
    this.total = fila.length; this.feitas = 0; this.acertos = 0;
    this.step = 0; this.revealed = false; this.chute = "";
  }
  get it(){ return this.fila[0]; }
  modoAtual(){
    const it = this.it; if(!it) return "pt2en";
    const x = fd(this.k, it.id);
    const target = it.novo ? 1 : Math.min(8, x.s + 1);
    return it.novo ? (this.k === "red" ? "ouvir" : "pt2en") : fModo(this.k, target);
  }
  esperado(){
    const it = this.it; if(!it) return "";
    const m = this.modoAtual();
    if(this.k === "red") return m === "ouvir" ? R[it.id][0] : R[it.id][1];
    return m === "en2pt" ? C[it.id][2] : C[it.id][0];
  }
  dicaChute(){
    const m = this.modoAtual();
    if(this.k === "red") return m === "ouvir" ? "escreva a frase completa" : "escreva a forma natural";
    return m === "en2pt" ? "escreva em português" : "escreva em inglês";
  }
  render(v){
    if(!this.fila.length) return this.renderEnd(v);
    const it = this.it;
    const ensinando = it.novo && this.step < 2;
    const body = ensinando ? this.ensino() : this.teste();
    const passo = this.feitas + (this.fila.length ? 0 : 0);
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="bar"><i style="width:${pct(this.feitas,this.total)}%;background:${this.k==="red"?"var(--rev)":"var(--solida)"}"></i></div>
          <div class="mini">${Math.min(this.feitas+1,this.total)} / ${this.total}</div>
        </div>
        <div class="stage">
          ${body}
          ${!ensinando && !this.revealed ? campoChute(this.dicaChute()) : ""}
          ${!ensinando && this.revealed ? linhaChute(this.chute, this.esperado()) : ""}
          <div class="acts" id="acts"></div>
        </div>
        <div class="kbd">${(it.novo && this.step<2) || !this.revealed ? `<span>espaço</span> continuar` : `<span>1</span> errei &nbsp; <span>2</span> acertei`}</div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair do treino? O que já foi feito está salvo.")) go("home"); };
    const a = $("#acts");
    if(it.novo && this.step < 2){
      a.innerHTML = `<button class="btn pri" id="nx">Continuar</button>`;
      $("#nx").onclick = () => { this.step++; this.render($("#view")); };
    } else if(!this.revealed){
      a.innerHTML = `<button class="btn pri lg" id="rev">Ver resposta</button>`;
      const revelar = () => { this.chute = valorChute(); this.revealed = true; this.render($("#view")); };
      $("#rev").onclick = revelar;
      ligaChute(revelar);
    } else {
      a.innerHTML = `<button class="btn bad" id="err">Errei</button><button class="btn ok" id="ok">Acertei</button>`;
      $("#err").onclick = () => this.answer(false);
      $("#ok").onclick = () => this.answer(true);
      sugereBotao(this.chute, this.esperado());
    }
  }
  /* ---- ensino de um item novo ---- */
  ensino(){
    const it = this.it;
    if(this.k === "red"){
      const r = R[it.id];
      if(this.step === 0) return `
        <div class="step">01 — Como está escrito</div>
        <div class="word-pt" style="font-size:27px">${esc(r[0])}</div>
        <div class="muted" style="font-size:15px">${esc(r[3])}</div>
                <div class="mini">Essa é a frase completa. Ninguém fala assim na velocidade normal.</div>`;
      return `
        <div class="step" style="color:var(--rev)">02 — Como sai na boca</div>
        <div class="word-en" style="font-size:31px;text-transform:none;color:var(--rev)">${esc(r[1])}</div>
        <div class="pron">${esc(r[2])}</div>
                <div class="hintbox">${esc(r[4])}</div>
        <div class="mini">Ouça as duas e repita a versão natural 3 vezes.</div>`;
    }
    const c = C[it.id];
    if(this.step === 0) return `
      <div class="step">01 — O que você quer dizer</div>
      <div class="word-pt" style="font-size:28px">${esc(c[2])}</div>
      <div class="mini">${esc(c[3])}</div>`;
    return `
      <div class="step" style="color:var(--solida)">02 — O bloco em inglês</div>
      <div class="word-en" style="font-size:29px;text-transform:none">${esc(c[0])}</div>
      <div class="pron" style="font-size:24px">${esc(c[1])}</div>
      <div class="muted" style="font-size:15px">${esc(c[2])}</div>
            <div class="mini">Repita 3 vezes em voz alta, no mesmo ritmo do áudio.</div>`;
  }
  /* ---- teste ---- */
  teste(){
    const it = this.it, k = this.k;
    const x = fd(k, it.id);
    const target = it.novo ? 1 : Math.min(8, x.s + 1);
    const modo = it.novo ? (k==="red" ? "ouvir" : "pt2en") : fModo(k, target);
    const topo = `<div class="row" style="justify-content:center;gap:8px">
        <div class="step" style="color:${k==="red"?"var(--rev)":"var(--solida)"}">${it.novo ? "03 — Recall" : `Revisão ${target} de 8 · ${SCHED[target-1].nome}`}</div>
        ${it.redo ? `<span class="redo">reteste</span>` : ""}
      </div>`;
    if(k === "red"){
      const r = R[it.id];
      if(modo === "ouvir"){
        if(!this.revealed) return `${topo}
          <div class="word-en" style="font-size:30px;text-transform:none;color:var(--rev)">${esc(r[1])}</div>
                    <div class="mini">Qual é a frase completa e o que ela significa?</div>`;
        return `${topo}
          <div class="word-en" style="font-size:24px;text-transform:none;color:var(--rev)">${esc(r[1])}</div>
          <div class="pron" style="font-size:21px">${esc(r[2])}</div>
          <div class="word-pt" style="font-size:24px">${esc(r[0])}</div>
          <div class="muted" style="font-size:15px">${esc(r[3])}</div>
                    <div class="hintbox">${esc(r[4])}</div>`;
      }
      if(!this.revealed) return `${topo}
        <div class="word-pt" style="font-size:26px">${esc(r[3])}</div>
        <div class="mini">Fale em inglês, do jeito natural, em voz alta.</div>`;
      return `${topo}
        <div class="word-en" style="font-size:29px;text-transform:none;color:var(--rev)">${esc(r[1])}</div>
        <div class="pron">${esc(r[2])}</div>
        <div class="muted" style="font-size:14px">completa: ${esc(r[0])}</div>`;
    }
    const c = C[it.id];
    if(modo === "en2pt"){
      if(!this.revealed) return `${topo}
        <div class="word-en" style="font-size:27px;text-transform:none">${esc(c[0])}</div>
        <div class="mini">O que isso quer dizer em português?</div>`;
      return `${topo}
        <div class="word-en" style="font-size:23px;text-transform:none;color:var(--tx2)">${esc(c[0])}</div>
        <div class="word-pt" style="font-size:27px">${esc(c[2])}</div>`;
    }
    if(!this.revealed) return `${topo}
      <div class="word-pt" style="font-size:27px">${esc(c[2])}</div>
      <div class="mini">Diga o bloco em inglês, em voz alta.</div>`;
    return `${topo}
      <div class="word-en" style="font-size:28px;text-transform:none">${esc(c[0])}</div>
      ${modo === "pt2en" ? `<div class="pron" style="font-size:23px">${esc(c[1])}</div>` : ""}
      <div class="muted" style="font-size:15px">${esc(c[2])}</div>`;
  }
  answer(ok){
    vibrar(ok);
    const it = this.fila.shift(), k = this.k;
    if(it.redo){
      // reteste do erro: não mexe na agenda, só reforça
    } else if(it.novo){
      const x = fd(k, it.id);
      x.l = x.l || Date.now(); x.s = 0; x.a++; if(!ok) x.e++;
      scheduleNext(x);
      today()[DECK[k].campo]++;
      S.ultimo = Date.now(); save();
      this.feitas++; if(ok) this.acertos++;
    } else {
      fApply(k, it.id, ok);
      this.feitas++; if(ok) this.acertos++;
    }
    if(!ok && (it.vezes||0) < 2){
      const pos = Math.min(this.fila.length, 3);
      this.fila.splice(pos, 0, {id:it.id, novo:false, redo:true, vezes:(it.vezes||0)+1});
      toast("Sem problema. Ela volta daqui a pouco.");
    }
    this.step = 0; this.revealed = false; this.chute = "";
    this.render($("#view"));
  }
  renderEnd(v){
    const k = this.k, d = today(), meta = DECK[k].meta, feito = d[DECK[k].campo] || 0;
    const completo = feito >= meta;
    const resto = fDue(k).length + fFaltaHoje(k);
    v.innerHTML = `
      <div class="sess">
        <div class="stage">
          <div class="celebrate">
            <div class="ic">${completo ? "🔥" : "✓"}</div>
            <div style="font-size:22px;font-weight:650;letter-spacing:-.02em">${completo ? DECK[k].nome + " do dia completos" : "Rodada concluída"}</div>
            <div class="muted" style="margin-top:6px">${this.feitas} ${plural(this.feitas,"item","itens")} · ${pct(this.acertos,Math.max(1,this.total))}% de acerto</div>
            <div class="mini" style="margin-top:8px">${feito} de ${meta} novos hoje</div>
          </div>
          <div class="acts">
            ${resto ? `<button class="btn pri" id="mais">Continuar</button>` : ""}
            <button class="btn ghost" id="home">Voltar ao início</button>
          </div>
        </div>
      </div>`;
    if($("#mais")) $("#mais").onclick = () => startFrases(k);
    $("#home").onclick = () => go("home");
  }
  key(e){
    if(!this.fila.length) return;
    const it = this.it;
    if(e.key === " "){
      e.preventDefault();
      if(it.novo && this.step < 2){ this.step++; this.render($("#view")); }
      else if(!this.revealed){ this.revealed = true; this.render($("#view")); }
      return;
    }
    if(!(it.novo && this.step < 2) && this.revealed){
      if(e.key === "1") this.answer(false);
      if(e.key === "2") this.answer(true);
    }
  }
}

/* vocabulário liberado: o que já está dominado mais o que está em estudo */
function vocabDisponivel(limite){
  const dom = [], estudo = [];
  for(let i = 0; i < W.length; i++){
    const x = S.w[i];
    if(!x || !x.l) continue;
    (x.m || x.s >= 6 ? dom : estudo).push(W[i][2]);
  }
  const fon = {};
  for(let i = 0; i < W.length && Object.keys(fon).length < 70; i++){
    const x = S.w[i];
    if(x && x.l) fon[W[i][2]] = W[i][1];
  }
  return {dom: dom.slice(-limite), estudo: estudo.slice(-60), fon};
}

function montarPrompt(cena){
  const v = vocabDisponivel(340);
  const amostraFon = Object.keys(v.fon).map(k => k + " = " + v.fon[k]).join(" | ");
  return [
    "Você escreve textos curtos em inglês para um brasileiro estudando vocabulário.",
    "",
    "CENA DE HOJE: " + cena + ".",
    "",
    "PALAVRAS QUE ELE JÁ DOMINA (use principalmente estas):",
    v.dom.join(", ") || "(ainda nenhuma — use inglês básico de altíssima frequência)",
    "",
    "PALAVRAS QUE ELE ESTÁ ESTUDANDO AGORA (encaixe de 4 a 8 delas, naturalmente):",
    v.estudo.join(", ") || "(nenhuma)",
    "",
    "REGRAS DO TEXTO:",
    "- 90 a 120 palavras, uma história com começo, meio e fim, na cena acima.",
    "- No mínimo 95% das palavras têm que sair das duas listas ou ser gramática básica (artigos, preposições, pronomes, verbos auxiliares).",
    "- Frases curtas e faladas, inglês americano do dia a dia. Nada de vocabulário literário.",
    "- Quebre em 8 a 14 linhas, cada linha uma frase completa.",
    "",
    "PARA CADA LINHA você entrega três versões:",
    '- "en": a frase em inglês.',
    '- "fon": como a frase SOA, escrita para um brasileiro ler em voz alta. ' + LEGENDA_FON,
    '- "pt": a tradução natural em português do Brasil.',
    "",
    "Calibre a notação fonética por estes exemplos já usados com ele: " + amostraFon,
    "",
    'Responda SÓ com JSON: {"titulo":"...","linhas":[{"en":"...","fon":"...","pt":"..."}]}',
    'O título tem no máximo 4 palavras, em inglês.'
  ].join("\n");
}

/* banco pronto primeiro (pedido dele em 25/09, pra não gastar IA toda vez):
   evita repetir os textos que ainda estão na lista guardada (os 12 mais
   recentes); só cai pra geração ao vivo se o banco estiver vazio. */
function txtBancoEscolher(){
  if(!TXT_BANCO.length) return null;
  const recentes = new Set((S.txt||[]).map(x => x.t));
  let pool = TXT_BANCO.filter(b => !recentes.has(b.titulo));
  if(!pool.length) pool = TXT_BANCO;
  return pool[Math.floor(Math.random()*pool.length)];
}
async function gerarTexto(aoTerminar, aoErro){
  const doBanco = txtBancoEscolher();
  if(doBanco){
    if(!S.txt) S.txt = [];
    S.txt.unshift({d: dayKey(), ctx: doBanco.ctx || "", t: doBanco.titulo, l: doBanco.linhas, lido: 0});
    S.txt = S.txt.slice(0, MAX_TXT_GUARDADOS);
    save();
    if(aoTerminar) aoTerminar();
    return;
  }
  if(!sampleRef){ if(aoErro) aoErro("sem"); return; }
  const cena = CENAS[Math.floor(Math.random() * CENAS.length)];
  gerando = new AbortController();
  try{
    const j = await sampleRef.json(montarPrompt(cena), {
      cache: false, modelTier: "default", signal: gerando.signal
    });
    const linhas = (j && Array.isArray(j.linhas) ? j.linhas : [])
      .map(l => [String(l.en || "").trim(), String(l.fon || "").trim(), String(l.pt || "").trim()])
      .filter(l => l[0] && l[2]);
    if(linhas.length < 3) throw {code:"invalid_json"};
    if(!S.txt) S.txt = [];
    S.txt.unshift({d: dayKey(), ctx: cena, t: String((j && j.titulo) || "Sem título").slice(0, 60), l: linhas, lido: 0});
    S.txt = S.txt.slice(0, MAX_TXT_GUARDADOS);
    save();
    gerando = null;
    if(aoTerminar) aoTerminar();
  }catch(e){
    gerando = null;
    if(aoErro) aoErro((e && e.code) || "erro");
  }
}
function msgErroTexto(c){
  if(c === "cancelled") return null;
  if(c === "not_granted" || c === "sampling_disabled" || c === "not_declared")
    return "O sistema não tem permissão para escrever textos aqui.";
  if(c === "rate_limited") return "Muitos pedidos seguidos. Tente daqui a pouco.";
  if(c === "invalid_json" || c === "empty_completion") return "O texto saiu quebrado. Tente de novo.";
  if(c === "sem") return "Os textos só funcionam no link do sistema.";
  return "Não deu para escrever o texto agora.";
}

/* ---------------- Escrita curta corrigida pela IA ---------------- */
/* Pedido aprovado por ele em 24/09: "vou treinar escrita também, nem que
   sejam frases curtas." Não é módulo separado — é só mais um item nos
   treinos de fora, do lado de Listening/Speaking/Grammar. Não guarda
   histórico de frases, só marca o dia como feito quando ele corrige ou
   marca manualmente. */
/* pedido dele em 25/09: tirar o custo de IA da correção. Em vez de mandar
   a frase pra um modelo corrigir, sorteia uma frase já pronta de reduções
   ou blocos (custo zero, sempre disponível, funciona até na cópia offline)
   e mostra o português como o que ele tem que traduzir; ele escreve, depois
   revela a frase certa pra comparar sozinho — "aí eu vou saber se errei". */
let escUltimo = -1;
function escSorteio(){
  const pool = [];
  for(let i = 0; i < R.length; i++) pool.push({en:R[i][0], pt:R[i][3]});
  for(let i = 0; i < C.length; i++) pool.push({en:C[i][0], pt:C[i][2]});
  if(!pool.length) return null;
  let idx;
  do{ idx = Math.floor(Math.random() * pool.length); } while(pool.length > 1 && idx === escUltimo);
  escUltimo = idx;
  return pool[idx];
}
function abrirEscrita(){
  const item = escSorteio();
  const dica = item ? `Escreva em inglês: <b>${esc(item.pt)}</b>` : "Escreva 1 a 3 frases curtas em inglês, sobre qualquer coisa.";
  const box = el(`<div class="modal">
    <div class="card" style="max-width:520px;width:100%;background:var(--panel-2)">
      <div class="spread" style="margin-bottom:10px"><span class="lbl">Escrita — traduza pro inglês</span><button class="btn sm ghost" id="x">Fechar</button></div>
      <div class="mini" style="margin-bottom:10px">${dica}</div>
      <textarea id="escTxt" rows="3" placeholder="Write here..."></textarea>
      <div class="acts" style="justify-content:flex-start;margin-top:10px">
        <button class="btn pri" id="escGo">Ver resposta</button>
        <button class="btn ghost" id="escOk">Marcar como feito</button>
      </div>
      <div id="escRes" style="margin-top:12px"></div>
    </div></div>`);
  document.body.appendChild(box);
  box.onclick = e => { if(e.target === box || e.target.id === "x") box.remove(); };
  box.querySelector("#escGo").onclick = () => {
    if(item){
      box.querySelector("#escRes").innerHTML = `
        <div class="hintbox" style="text-align:left;max-width:100%">
          <div style="font-weight:600">${esc(item.en)}</div>
        </div>`;
    }
    const d = today(); if(!d.wr){ d.wr = true; save(); }
    box.querySelector("#escGo").disabled = true;
  };
  box.querySelector("#escOk").onclick = () => { const d = today(); d.wr = true; save(); box.remove(); render(); };
}

/* ---------------- sessão de leitura: três passadas ---------------- */
function abrirTexto(idx){
  const t = (S.txt || [])[idx];
  if(!t) return;
  SESSION = new LeituraSession(idx);
  render();
}
class LeituraSession{
  constructor(idx){ this.idx = idx; this.passo = 0; }
  get txt(){ return (S.txt || [])[this.idx]; }
  render(v){
    const t = this.txt;
    if(!t) return go("ler");
    const passos = [
      {n:"01 — O som", dica:"Leia em voz alta. Não é inglês escrito: é como a frase soa."},
      {n:"02 — O inglês", dica:"Agora confira o que você estava lendo."},
      {n:"03 — O significado", dica:"Por último, o que a história dizia."}
    ];
    const p = passos[this.passo];
    const corpo = t.l.map(l => {
      if(this.passo === 0) return `<div class="lt-fon">${esc(l[1])}</div>`;
      if(this.passo === 1) return `<div class="lt-en">${esc(l[0])}</div>`;
      return `<div class="lt-par"><div class="lt-en">${esc(l[0])}</div><div class="lt-pt">${esc(l[2])}</div></div>`;
    }).join("");
    v.innerHTML = `
      <div class="sess" style="max-width:720px">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="bar"><i style="width:${(this.passo+1)/3*100}%;background:var(--rev)"></i></div>
          <div class="mini">${this.passo+1} / 3</div>
        </div>
        <div class="card" style="padding:26px 24px">
          <div class="step" style="color:var(--rev)">${p.n}</div>
          <h2 style="margin:8px 0 2px;font-size:20px">${esc(t.t)}</h2>
          <div class="mini" style="margin-bottom:16px">${esc(cap(t.ctx))}</div>
          <div class="leitura">${corpo}</div>
          <div class="mini" style="margin-top:18px">${p.dica}</div>
          <div class="acts" style="justify-content:flex-start;margin-top:18px" id="acts"></div>
        </div>
      </div>`;
    $("#sair").onclick = () => go("ler");
    const a = $("#acts");
    if(this.passo < 2){
      a.innerHTML = `<button class="btn pri lg" id="nx">${this.passo === 0 ? "Ver em inglês" : "Ver a tradução"}</button>`;
      $("#nx").onclick = () => { this.passo++; this.render($("#view")); };
    } else {
      a.innerHTML = `<button class="btn ok" id="fim">Terminei</button><button class="btn ghost" id="volta">Ler de novo</button>`;
      $("#fim").onclick = () => {
        if(!this.txt.lido){ this.txt.lido = 1; today().txt = (today().txt || 0) + 1; save(); flushPush(); }
        vibrar(true);
        go("ler");
      };
      $("#volta").onclick = () => { this.passo = 0; this.render($("#view")); };
    }
  }
  key(e){
    if(e.key === " "){ e.preventDefault(); if(this.passo < 2){ this.passo++; this.render($("#view")); } }
  }
}

/* ============================ ANTECIPAR ============================ */
/* Priming semântico: o contexto pré-ativa a palavra antes de você precisar dela.
   É o "_arinha" — o cenário decide se vira varinha ou farinha. Aqui o cenário
   vem primeiro e a palavra vem furada; você aposta antes de ver.

   Por que isso existe: nativo não decodifica palavra por palavra a 150 por
   minuto, ele adianta o que vem e só confere. Isso é uma habilidade separada
   da memória, e nada mais no sistema treina ela.

   Este módulo é uma ilha: estado próprio (S.ant), aba própria, nenhuma
   palavra, redução ou bloco muda de estágio por causa dele. */

const ANT_ITENS = 8;
const ANT_HIST = 40;

function antEstado(){
  if(!S.ant) S.ant = {feitas:0, cheios:0, perto:0, rodadas:[], itens:null, i:0};
  const a = S.ant;
  if(!Array.isArray(a.rodadas)) a.rodadas = [];
  return a;
}
function temAntecipar(){ return !!sampleRef; }

/* ---- o que a IA escreve ---- */
const ANT_CENAS = [
  "uma cozinha, alguém cozinhando",
  "um aeroporto, alguém embarcando",
  "uma reunião de trabalho por vídeo",
  "uma loja, alguém comprando",
  "um hospital, alguém esperando notícia",
  "uma rua à noite, alguém voltando para casa",
  "um escritório no fim do expediente",
  "uma praia, um dia de calor",
  "um carro no trânsito parado",
  "uma ligação de venda com um cliente",
  "uma academia de manhã cedo",
  "uma oficina, um carro quebrado",
  "um hotel, o check-in",
  "uma sala de aula",
  "um banco, resolvendo um problema de conta",
  "uma mudança de casa, caixas por todo lado"
];

function antPalavrasBase(){
  /* palavras que ele já viu pelo menos uma vez: prever o que você nunca
     encontrou é adivinhação, não antecipação */
  const vistas = [];
  for(const id in S.w) if(S.w[id].l) vistas.push(W[id][2]);
  if(vistas.length < 30){
    for(let i = 0; i < W.length && vistas.length < 60; i++)
      if(!isLearned(i)) vistas.push(W[i][2]);
  }
  return vistas.sort(() => Math.random() - .5).slice(0, 45);
}

function antPrompt(){
  const cena = ANT_CENAS[Math.floor(Math.random() * ANT_CENAS.length)];
  const palavras = antPalavrasBase().join(", ");
  return `Você monta exercícios de ANTECIPAÇÃO para um brasileiro que estuda inglês.

A ideia: o contexto tem que puxar a palavra antes de a pessoa ler a palavra. Como em português, quando a cena é um bolo sendo feito, "_arinha" vira farinha; quando a cena é o Harry Potter, vira varinha. O cenário decide.

Escreva ${ANT_ITENS} itens ambientados em: ${cena}.

Cada item tem:
- "ctx": UMA frase curta em inglês que monta a cena e empurra fortemente para a palavra-alvo. Ela sozinha já tem que fazer alguém pensar na resposta. Não pode conter a palavra-alvo.
- "en": a frase seguinte, em inglês, contendo a palavra-alvo. Natural, curta, do dia a dia.
- "alvo": a palavra-alvo exatamente como aparece em "en". Uma só palavra.
- "pt": tradução da frase "en" para o português.

REGRAS
1. Use como alvo, sempre que couber, palavras desta lista: ${palavras}
2. O alvo tem que ser previsível pelo contexto. Se cinco palavras diferentes cabem igualmente bem na lacuna, o item está ruim — refaça com um contexto que aperte mais.
3. O alvo nunca é a primeira palavra da frase.
4. Frases curtas, inglês falado de verdade, nada literário.
5. Varie o alvo: não repita a mesma palavra em dois itens.

Responda SÓ com JSON neste formato:
{"itens":[{"ctx":"...","en":"...","alvo":"...","pt":"..."}]}`;
}

let antGerando = null;
/* banco pronto primeiro (pedido dele em 25/09, pra não gastar IA toda vez):
   sorteia sem repetir até esgotar os 150, depois embaralha de novo. Só cai
   pra geração ao vivo se o banco estiver vazio (build sem ele, ou já visto
   tudo e ele preferir gerar mais na hora). */
let antBancoIdx = null;
function antValida(it){
  const en = String(it.en||"").trim(), alvo = String(it.alvo||"").trim().replace(/[.,!?;:]$/, "");
  if(!en || !alvo) return null;
  const re = new RegExp("(^|[^A-Za-z'])(" + alvo.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")([^A-Za-z']|$)", "i");
  if(!re.test(en)) return null;
  return {ctx:String(it.ctx||"").trim(), en, alvo, pt:String(it.pt||"").trim()};
}
function antBancoRodada(){
  if(!ANT_BANCO.length) return null;
  if(!antBancoIdx || !antBancoIdx.length) antBancoIdx = ANT_BANCO.map((_,i)=>i).sort(()=>Math.random()-.5);
  const itens = antBancoIdx.splice(0, ANT_ITENS).map(i => antValida(ANT_BANCO[i])).filter(Boolean);
  return itens;
}
async function antGerar(ok, erro){
  const doBanco = antBancoRodada();
  if(doBanco && doBanco.length >= 3){
    const a = antEstado();
    a.itens = doBanco; a.i = 0;
    if(ok) ok();
    return;
  }
  if(!sampleRef){ if(erro) erro("sem"); return; }
  antGerando = new AbortController();
  try{
    const j = await sampleRef.json(antPrompt(), {cache:false, modelTier:"default", signal:antGerando.signal});
    const brutos = (j && Array.isArray(j.itens)) ? j.itens : [];
    const itens = [];
    for(const it of brutos){
      const en = String(it.en || "").trim();
      const alvo = String(it.alvo || "").trim().replace(/[.,!?;:]$/, "");
      if(!en || !alvo) continue;
      const re = new RegExp("(^|[^A-Za-z'])(" + alvo.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")([^A-Za-z']|$)", "i");
      if(!re.test(en)) continue;                    // o alvo precisa estar mesmo na frase
      itens.push({ctx:String(it.ctx||"").trim(), en, alvo, pt:String(it.pt||"").trim()});
    }
    if(itens.length < 3) throw {code:"invalid_json"};
    const a = antEstado();
    a.itens = itens; a.i = 0;
    antGerando = null;
    if(ok) ok();
  }catch(e){
    antGerando = null;
    if(erro) erro((e && e.code) || "erro");
  }
}

/* ---- a frase com a lacuna, e a dica que só tira o primeiro pedaço ---- */
function antLacuna(en, alvo, revelar){
  const re = new RegExp("(^|[^A-Za-z'])(" + alvo.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")([^A-Za-z']|$)", "i");
  const m = en.match(re);
  if(!m) return esc(en);
  const antes = en.slice(0, m.index + m[1].length);
  const depois = en.slice(m.index + m[1].length + m[2].length);
  const p = m[2];
  const buraco = revelar
    ? `<b class="ant-rev">${esc(p)}</b>`
    : `<span class="ant-buraco">${"·".repeat(Math.max(3, p.length))}</span>`;
  return esc(antes) + buraco + esc(depois);
}
/* a dica revela do FIM para o começo, como o "_arinha": a primeira letra é
   justamente a que o contexto tem que entregar */
function antDica(alvo, nivel){
  if(nivel <= 0) return "";
  const n = Math.min(nivel, alvo.length - 1);
  return "·".repeat(alvo.length - n) + alvo.slice(alvo.length - n);
}
const antLimpa = s => String(s || "").toLowerCase().replace(/[^a-z']/g, "");

function startAntecipar(){
  const a = antEstado();
  if(!a.itens || !a.itens.length){ toast("Gere a rodada primeiro."); return; }
  SESSION = new AnteciparSession(a.itens);
  render();
}

class AnteciparSession{
  constructor(itens){
    this.q = itens; this.i = 0;
    this.fase = "aposta";       // aposta | revelado
    this.chute = ""; this.dica = 0; this.pt = false;
    this.res = [];              // {alvo, chute, acerto, dica}
  }
  atual(){ return this.q[this.i]; }
  apostar(){
    const it = this.atual();
    const c = valorChute();
    this.chute = c;
    const acerto = antLimpa(c) === antLimpa(it.alvo);
    this.res.push({alvo:it.alvo, chute:c, acerto, dica:this.dica, en:it.en, pt:it.pt, ctx:it.ctx});
    vibrar(acerto);
    this.fase = "revelado";
    this.render($("#view"));
  }
  next(){
    this.i++; this.fase = "aposta"; this.chute = ""; this.dica = 0; this.pt = false;
    this.render($("#view"));
  }
  render(v){
    if(this.i >= this.q.length) return this.renderFim(v);
    const it = this.atual(), rev = this.fase === "revelado";
    const r = rev ? this.res[this.res.length - 1] : null;
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="bar"><i style="width:${pct(this.i, this.q.length)}%;background:var(--rev)"></i></div>
          <div class="mini">${this.i + 1} / ${this.q.length}</div>
        </div>
        <div class="stage" style="align-items:stretch;text-align:left">
          <div class="step" style="color:var(--rev)">Antecipar · deixe o contexto puxar</div>
          <div class="ant-ctx">${esc(it.ctx)}</div>
          <div class="ant-frase">${antLacuna(it.en, it.alvo, rev)}</div>
          ${rev ? `
            <div class="ant-res ${r.acerto ? "ok" : "no"}">
              ${r.acerto
                ? `Você antecipou.${r.dica ? ` <span class="dim">(com ${r.dica} ${plural(r.dica,"letra","letras")} de dica)</span>` : ""}`
                : `Era <b>${esc(it.alvo)}</b>${r.chute ? ` — você apostou em <em>${esc(r.chute)}</em>` : " — você passou"}.`}
            </div>
            <div class="ant-pt">${esc(it.pt)}</div>`
          : `
            <div class="mini">Que palavra cabe aí? Aposte antes de ver — errar aqui não custa nada.</div>
            ${this.dica ? `<div class="ant-dica">${esc(antDica(it.alvo, this.dica))}</div>` : ""}
            ${this.pt ? `<div class="ant-pt">${esc(it.pt)}</div>` : ""}
            ${campoChute("escreva sua aposta")}`}
          <div class="acts" id="acts"></div>
        </div>
        <div class="kbd">${rev ? `<span>espaço</span> continuar` : `<span>enter</span> apostar`}</div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair da rodada?")) go("home"); };
    const a = $("#acts");
    if(!rev){
      a.innerHTML = `${this.dica < it.alvo.length - 1 ? `<button class="btn ghost" id="dica">Revelar uma letra</button>` : ""}
                     ${!this.pt ? `<button class="btn ghost" id="ptOn">Ver tradução</button>` : ""}
                     <button class="btn pri" id="ap">Apostar</button>`;
      if($("#dica")) $("#dica").onclick = () => { this.dica++; const c = valorChute(); this.render($("#view")); if($("#chute")) $("#chute").value = c; };
      if($("#ptOn")) $("#ptOn").onclick = () => { this.pt = true; const c = valorChute(); this.render($("#view")); if($("#chute")) $("#chute").value = c; };
      $("#ap").onclick = () => this.apostar();
      ligaChute(() => this.apostar());
    } else {
      a.innerHTML = `<button class="btn pri" id="pr">${this.i + 1 >= this.q.length ? "Ver o resultado" : "Próxima"}</button>`;
      $("#pr").onclick = () => this.next();
    }
  }
  renderFim(v){
    const n = this.res.length, ac = this.res.filter(r => r.acerto).length;
    const limpos = this.res.filter(r => r.acerto && !r.dica).length;
    const a = antEstado();
    a.feitas += n; a.cheios += limpos;
    a.rodadas.push([Date.now(), n, ac, limpos]);
    if(a.rodadas.length > ANT_HIST) a.rodadas = a.rodadas.slice(-ANT_HIST);
    a.itens = null;
    const d = today(); d.ant = (d.ant || 0) + 1;
    save();
    v.innerHTML = `
      <div class="sess">
        <div class="stage" style="align-items:stretch;text-align:left">
          <div class="rel-fim">
            <div class="rel-ic">🔮</div>
            <div class="rel-placarF">
              <div><b class="ok">${ac}</b><span>antecipou</span></div>
              <div><b>${limpos}</b><span>sem nenhuma dica</span></div>
              <div><b>${n}</b><span>frases</span></div>
            </div>
            <div class="mini" style="margin-top:2px;text-align:center;max-width:44ch">
              O número que importa aqui é o do meio. Antecipar sem dica é o que acontece
              na sua cabeça quando alguém fala rápido e você acompanha mesmo assim.
            </div>
          </div>
          <div class="rel-bloco">
            <div class="lbl">A rodada inteira</div>
            ${this.res.map(r => `
              <div class="rel-l ${r.acerto ? "ok" : "bad"}">
                <div class="rel-par" style="flex-direction:column;align-items:flex-start;gap:2px">
                  <span style="font-size:14px">${antLacuna(r.en, r.alvo, true)}</span>
                  <span style="font-size:12.5px;color:var(--ink-3)">${esc(r.pt)}</span>
                </div>
                ${!r.acerto && r.chute ? `<div class="rel-meta">apostou <em>${esc(r.chute)}</em></div>` : ""}
              </div>`).join("")}
          </div>
          <div class="acts">
            <button class="btn ghost" id="home">Voltar ao início</button>
            <button class="btn pri" id="dnv">Outra rodada</button>
          </div>
        </div>
      </div>`;
    $("#home").onclick = () => go("home");
    $("#dnv").onclick = () => { SESSION = null; go("ant"); setTimeout(() => { const b = $("#antGerar"); if(b) b.click(); }, 60); };
  }
  key(e){
    if(this.i >= this.q.length) return;
    if(this.fase === "revelado" && (e.key === " " || e.key === "Enter")){ e.preventDefault(); this.next(); }
  }
}

/* ---- edição manual do PAV ---- */
function editarPav(id, depois){
  const w = W[id];
  const editado = !!(S.pav && S.pav[id]);
  const box = el(`<div class="modal">
    <div class="card" style="max-width:580px;width:100%;background:var(--surface2)">
      <div class="spread" style="margin-bottom:14px">
        <div>
          <div class="lbl">Editar PAV</div>
          <div style="font-weight:650;font-size:19px;margin-top:3px">${esc(w[2])} <span class="dim" style="font-weight:500;font-size:15px">· ${esc(cap(w[0]))}</span></div>
        </div>
        <button class="btn sm ghost" id="x">Cancelar</button>
      </div>
      <textarea id="ta" rows="4" placeholder="Escreva a cena do PAV…">${esc(pavOf(id))}</textarea>
      <div class="mini" style="margin-top:8px">Uma frase curta: o significado, um elemento que puxa o som (${esc(w[1])}) e uma ação impossível.</div>
      <div class="sep"></div>
      <div class="lbl" style="margin-bottom:8px">Imagem da cena</div>
      ${temImagens()
        ? (imgOf(id)
            ? `${blocoImagem(id)}<div class="row" style="gap:8px;margin-top:10px;justify-content:center">
                 <button class="edt" id="imgTrocar">trocar imagem</button>
                 <button class="edt" id="imgTirar">remover</button>
               </div>`
            : `<div class="imgvazio">Nenhuma imagem ainda.<div style="margin-top:10px"><button class="btn sm" id="imgTrocar">Enviar imagem</button></div></div>`)
        : `<div class="imgvazio">As imagens só funcionam no link do sistema, não nesta cópia.</div>`}
      <div class="spread" style="margin-top:16px">
        <button class="edt" id="orig" ${editado?"":"style=visibility:hidden"}>voltar ao original</button>
        <button class="btn pri" id="ok">Salvar</button>
      </div>
    </div></div>`);
  document.body.appendChild(box);
  const ta = box.querySelector("#ta");
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  const fechar = () => { box.remove(); if(depois) depois(); };
  box.onclick = e => { if(e.target === box) fechar(); };
  box.querySelector("#x").onclick = fechar;
  const bTrocar = box.querySelector("#imgTrocar");
  if(bTrocar) bTrocar.onclick = () => { box.remove(); escolherImagem(id, () => editarPav(id, depois)); };
  const bTirar = box.querySelector("#imgTirar");
  if(bTirar) bTirar.onclick = async () => {
    if(!(await confirmar("Remover a imagem desta palavra?"))) return;
    await removerImagem(id);
    toast("Imagem removida.");
    box.remove(); editarPav(id, depois);
  };
  box.querySelector("#orig").onclick = () => {
    if(S.pav) delete S.pav[id];
    save(); toast("PAV original restaurado."); fechar();
  };
  box.querySelector("#ok").onclick = () => {
    const txt = ta.value.trim();
    if(!txt){ toast("O PAV não pode ficar vazio."); return; }
    if(!S.pav) S.pav = {};
    if(txt === W[id][3]) delete S.pav[id]; else S.pav[id] = txt;
    save(); toast("PAV salvo."); fechar();
  };
  ta.onkeydown = e => {
    if(e.key === "Escape"){ e.preventDefault(); fechar(); }
    if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); box.querySelector("#ok").click(); }
    e.stopPropagation();
  };
}

let calRef = new Date();
function viewCal(v){
  const y = calRef.getFullYear(), m = calRef.getMonth();
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const off = (first.getDay()+6)%7;
  const nomes = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const st = streak(), protegidos = st.protegidos || [];
  let cells = "";
  for(let i=0;i<off;i++) cells += `<div class="cd void"></div>`;
  for(let d=1; d<=last.getDate(); d++){
    const k = dayKey(new Date(y,m,d));
    const cls = dayFull(k) ? "full" : dayMin(k) ? "min" : (protegidos.indexOf(k) >= 0 ? "esc" : "");
    const hoje = k === dayKey() ? "today" : "";

      <div class="row"><button class="btn sm ghost" id="pv">←</button><div style="min-width:150px;text-align:center;font-weight:600">${nomes[m]} ${y}</div><button class="btn sm ghost" id="nx">→</button></div>

        <span class="row mini"><span class="dotc" style="background:#E3B341"></span> dia mínimo (10+ novas, revisões em dia)</span>
        <span class="row mini"><span class="dotc" style="background:#6E7683"></span> folga usada (sequência mantida)</span>

/* O número que importa no relâmpago não é o placar: é o tempo caindo. */
function cardRelampago(){
  const r = relEstado(), n = r.rodadas.length;
  if(!n) return "";
  const tempos = r.rodadas.filter(x => x[4] > 0).map(x => x[4]);
  const media = a => a.length ? Math.round(a.reduce((s,x)=>s+x,0)/a.length) : null;
  const k = Math.min(5, Math.floor(tempos.length/2));
  const inicio = k ? media(tempos.slice(0,k)) : null;
  const agora  = k ? media(tempos.slice(-k)) : null;
  const ganho  = (inicio && agora) ? Math.round((1 - agora/inicio) * 100) : null;
  return `
    <div class="card" style="margin-bottom:14px">
      <div class="spread" style="margin-bottom:12px">
        <h2 style="margin:0">Relâmpago</h2>
        <div class="mini">${n} ${plural(n,"rodada","rodadas")}</div>
      </div>
      <div class="rel-placarF">
        <div><b>${r.seq||0}</b><span>recorde de sequência</span></div>
        <div><b>${r.acertos||0}</b><span>recorde de acertos</span></div>
        <div><b>${relSeg(r.tempo)}</b><span>melhor tempo médio</span></div>
        <div><b>${relSeg(agora)}</b><span>tempo médio agora</span></div>
      </div>
      <div class="mini" style="margin-top:10px">
        ${ganho !== null && ganho !== 0
          ? (ganho > 0
              ? `Você reconhece as palavras <b style="color:var(--solida)">${ganho}% mais rápido</b> do que nas primeiras rodadas (${relSeg(inicio)} → ${relSeg(agora)}). É essa queda que aparece na hora de entender fala real.`
              : `Seu tempo subiu ${-ganho}% em relação ao começo (${relSeg(inicio)} → ${relSeg(agora)}). Normal quando entram palavras novas no sorteio.`)
          : "Jogue mais algumas rodadas para o sistema medir se o seu tempo está caindo."}
      </div>
    </div>`;
}

        <h2>Como o sistema funciona</h2>
        <div class="tl">
          <div class="tli"><div class="lbl">Meta diária</div><div>${GOAL_NEW} palavras novas + revisões</div></div>
          <div class="tli"><div class="lbl">Lote</div><div>A cada ${BATCH} novas, 1 revisão antiga</div></div>
          <div class="tli"><div class="lbl">Dia mínimo</div><div>${GOAL_MIN} novas + revisões em dia mantêm a sequência</div></div>
          <div class="tli"><div class="lbl">Revisões 1–3</div><div>Português + PAV → inglês</div></div>
          <div class="tli"><div class="lbl">Revisão 4</div><div>Inglês + PAV → português</div></div>
          <div class="tli"><div class="lbl">Revisões 5–6</div><div>Só o PAV → inglês</div></div>
          <div class="tli"><div class="lbl">Revisões 7–8</div><div>Só o português → inglês</div></div>
          <div class="tli"><div class="lbl">Dica</div><div>Disponível da revisão 5 em diante · conta como erro</div></div>
          <div class="tli"><div class="lbl">Erro</div><div>Resposta + PAV, reteste na mesma sessão, revisão repete amanhã</div></div>
          <div class="tli"><div class="lbl">Reduções</div><div>${GOAL_RED} novas por dia · ${RED_TOTAL} no total</div></div>
          <div class="tli"><div class="lbl">Blocos</div><div>${GOAL_CHK} novos por dia · ${CHK_TOTAL} no total</div></div>
          <div class="tli"><div class="lbl">Frases nas revisões</div><div>Mesma agenda de 8 das palavras</div></div>
          <div class="tli"><div class="lbl">Leitura</div><div>${GOAL_TXT} textos por dia, escritos com o seu vocabulário</div></div>
          <div class="tli"><div class="lbl">Famílias</div><div>${Object.keys(FAM).length} palavras mostram suas flexões</div></div>
          <div class="tli"><div class="lbl">Chute</div><div>Escreva antes de revelar: tentar fixa mais que só ler</div></div>
          <div class="tli"><div class="lbl">Folgas</div><div>${ESCUDOS_MES} por mês mantêm a sequência viva</div></div>
          <div class="tli"><div class="lbl">PAVs editados</div><div>${Object.keys(S.pav||{}).length} de ${LEVEL_TOTAL}</div></div>
          <div class="tli"><div class="lbl">PAVs com imagem</div><div>${contaImagens()} de ${LEVEL_TOTAL}</div></div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>Zerar progresso</h2>
      <p class="muted" style="font-size:13.5px;margin-bottom:14px">Apaga todo o histórico e volta ao dia zero. As 1.200 palavras, os PAVs e as imagens continuam.</p>
      <button class="btn bad" id="zerar">Zerar tudo</button>
    </div>`;
  if($("#conn")) $("#conn").onclick = () => window.__pendingHandle && !fileHandle ? reauthFile() : connectFile();
  $("#exp").onclick = exportJSON;
  if($("#exp2")) $("#exp2").onclick = exportJSON;
  if($("#imp2")) $("#imp2").onclick = importJSON;
  if($("#vibTgl")) $("#vibTgl").onclick = () => {
    vibLigada = !vibLigada;
    try{ localStorage.setItem(VIB_KEY, vibLigada ? "1" : "0"); }catch(e){}
    if(vibLigada) vibrar(true);
    render();
  };
  if($("#imgEspaco")) $("#imgEspaco").onclick = async () => {
    const alvo = $("#imgInfo");
    alvo.innerHTML = `<div class="mini">Consultando…</div>`;
    try{
      const r = await assetsRef.list();
      const mb = n => (n / 1048576).toFixed(1) + " MB";
      const orfas = r.assets.filter(x => Object.values(S.img || {}).indexOf(x.id) < 0).length;
      alvo.innerHTML = `<div class="card tight"><div class="tl">
        <div class="tli"><div class="lbl">Imagens</div><div>${r.usage.files} de ${r.usage.maxFiles}</div></div>
        <div class="tli"><div class="lbl">Espaço</div><div>${mb(r.usage.bytes)} de ${mb(r.usage.maxBytes)}</div></div>
        <div class="tli"><div class="lbl">Sem dono</div><div>${orfas} ${plural(orfas,"arquivo","arquivos")} que nenhuma palavra usa</div></div>
      </div></div>`;
    }catch(e){ alvo.innerHTML = `<div class="mini">Não consegui consultar o espaço agora.</div>`; }
  };
  $("#imp").onclick = importJSON;
  $("#zerar").onclick = async () => {
    if(!(await confirmar("Apagar TODO o progresso? Isso não tem volta."))) return;
    if(!(await confirmar("Confirma mesmo?", "Recomendo exportar antes."))) return;
    const imgs = S.img || {};
    S = freshState(); S.img = imgs; save(); toast("Progresso zerado."); go("home");
  };
}

/* ============================ BOOT ============================ */
document.addEventListener("keydown", e => { if(SESSION && SESSION.key) SESSION.key(e); });

(async function boot(){
  try{
    const raw = localStorage.getItem(STORE);
    const cru = raw ? JSON.parse(raw) : null;
    // guardado empacotado (f) ou no formato cru antigo: os dois voltam
    S = cru ? (cru.f ? unpack(cru) : cru) : freshState();
    if(!S || !S.w) S = freshState();
    if(!S.pav) S.pav = {};
    if(!S.r) S.r = {};
    if(!S.img) S.img = {};
    if(!Array.isArray(S.txt)) S.txt = [];
    if(!S.c) S.c = {};
    // primeiro dia com o módulo Frases: só a partir daqui ele conta no dia completo
    if(!S.frasesDesde){ S.frasesDesde = dayKey(); try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
  }catch(e){ S = freshState(); }
  setSync("off");
  await restoreFile();
  if(fileHandle){
    // se o arquivo tiver dados mais recentes, usa ele
    try{
      const f = await fileHandle.getFile();
      if(f.size > 2){
        const j = JSON.parse(await f.text());
        if(j && j.w && (!S.ultimo || (j.ultimo||0) > (S.ultimo||0))) S = normaliza(j);
      }
    }catch(e){}
  }
  render();
  await initAssets();
  await initSample();
  await initSync();
  markClean();
  render();
})();
</script>
</body>
</html>
