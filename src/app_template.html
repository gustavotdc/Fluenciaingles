/* ---- céu de palavras (Home): as 3000 palavras como pontos de luz, em
   ordem de frequência — o céu vai acendendo de cima pra baixo conforme
   ele estuda. Passar o dedo/cursor mostra a palavra; tocar abre ela. ---- */
const CEU_COR = {nova:"#2A3149", aprend:"#5B8DEF", rev:"#A47CF6", solida:"#45D483", dom:"#2EE6C4", ref:"#FF6B6B"};
const CEU_RAIO = {nova:1.05, aprend:1.95, rev:2.1, solida:2.25, dom:2.4, ref:2.1};
let CEU = null;
function ceuIniciar(anima){
  const cv = $("#ceu");
  if(!cv || !cv.getContext) return;
  const hoje0 = new Date(); hoje0.setHours(0, 0, 0, 0);
  const st = new Array(W.length), novoHoje = new Uint8Array(W.length);
  let temDom = false;
  for(let i = 0; i < W.length; i++){
    st[i] = statusOf(i);
    if(st[i] === "dom") temDom = true;
    const w = S.w[i];
    if(w && w.l && w.l >= hoje0.getTime()) novoHoje[i] = 1;
  }
  if(CEU && CEU.raf) cancelAnimationFrame(CEU.raf);
  // mesma tela re-renderizada: continua a entrada de onde estava (sem piscar)
  const t0 = anima ? performance.now() : (CEU ? CEU.t0 : performance.now() - 60000);
  CEU = {cv, st, novoHoje, temDom, t0, mouse: null, raf: 0, ultimo: 0, sujo: true};
  ceuMedir();
  ceuEventos();
  ceuPede();
}
function ceuMedir(){
  const c = CEU;
  if(!c || !c.cv.isConnected) return;
  const larg = Math.max(200, c.cv.parentElement.clientWidth);
  const alvo = larg < 380 ? 5.4 : larg < 560 ? 6.6 : 7.8;
  const cols = Math.max(24, Math.floor(larg / alvo)), rows = Math.ceil(W.length / cols), p = larg / cols;
  const alt = Math.ceil(rows * p), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.cv.width = Math.round(larg * dpr); c.cv.height = Math.round(alt * dpr);
  c.cv.style.height = alt + "px";
  Object.assign(c, {larg, alt, cols, rows, p, dpr});
}
function ceuPede(){
  const c = CEU;
  if(!c || c.raf) return;
  c.raf = requestAnimationFrame(function tick(agora){
    c.raf = 0;
    if(!c.cv.isConnected){ if(CEU === c) CEU = null; return; }
    // "completo" e não só o relógio: se um quadro atrasar (aba em segundo
    // plano, travada), a entrada termina mesmo assim em vez de congelar no meio
    const entrando = !c.completo;
    const brilha = MOVE_OK && c.temDom && agora - c.ultimo > 70;
    if(entrando || c.sujo || c.mouse || brilha){ ceuDesenha(agora); c.ultimo = agora; c.sujo = false; }
    if(!c.completo || c.mouse || (MOVE_OK && c.temDom)) c.raf = requestAnimationFrame(tick);
  });
}
function ceuDesenha(agora){
  const c = CEU, ctx = c.cv.getContext("2d"), p = c.p, k = p / 8.5, m = c.mouse;
  ctx.setTransform(c.dpr, 0, 0, c.dpr, 0, 0);
  ctx.clearRect(0, 0, c.larg, c.alt);
  const prog = MOVE_OK ? Math.min(1, (agora - c.t0) / 1500) : 1;
  c.completo = prog >= 1;
  const frente = (1 - Math.pow(1 - prog, 3)) * (c.cols + c.rows + 8);
  for(let i = 0; i < W.length; i++){
    const col = i % c.cols, row = (i / c.cols) | 0, diag = col + row;
    if(diag > frente) continue;
    const x = col * p + p / 2, y = row * p + p / 2, s = c.st[i];
    let r = CEU_RAIO[s] * k, a = Math.min(1, (frente - diag) / 5), cor = CEU_COR[s];
    if(m){
      const dx = x - m.x, dy = y - m.y, d2 = dx * dx + dy * dy;
      if(d2 < 4900){ const t = 1 - Math.sqrt(d2) / 70; r *= 1 + t; if(s === "nova") cor = "#56607F"; }
    }
    if(s === "dom" && MOVE_OK) a *= .7 + .3 * Math.sin(agora / 520 + i * 1.7);
    ctx.globalAlpha = a; ctx.fillStyle = cor;
    if(s === "nova"){ ctx.fillRect(x - r, y - r, r * 2, r * 2); continue; }
    ctx.shadowBlur = s === "dom" ? 9 * k : 0; ctx.shadowColor = cor;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
    if(c.novoHoje[i]){
      ctx.globalAlpha = a * .5; ctx.strokeStyle = cor; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, r + 2.8 * k + (MOVE_OK ? Math.sin(agora / 380 + i) * k : 0), 0, 6.2832); ctx.stroke();
    }
  }
  if(m && m.i != null){
    const x = (m.i % c.cols) * p + p / 2, y = ((m.i / c.cols) | 0) * p + p / 2;
    ctx.globalAlpha = 1; ctx.strokeStyle = "#EDF0F7"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, Math.max(4, p * .75), 0, 6.2832); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function ceuEventos(){
  const c = CEU, cv = c.cv, tip = $("#ceuTip");
  const pos = e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const col = Math.floor(x / c.p), row = Math.floor(y / c.p);
    const i = (col >= 0 && col < c.cols && row >= 0) ? row * c.cols + col : -1;
    return {x, y, i: (i >= 0 && i < W.length) ? i : null};
  };
  const mostra = m => {
    c.mouse = m; ceuPede();
    if(!tip) return;
    if(m.i == null){ tip.classList.remove("on"); return; }
    const s = c.st[m.i];
    tip.innerHTML = `<b>${esc(W[m.i][2])}</b><span>${esc(W[m.i][0])}</span><em style="color:${s === "nova" ? "var(--ink-3)" : CEU_COR[s]}">${STATUS[s].label}</em>`;
    const tx = Math.max(64, Math.min(c.larg - 64, m.x)), cab = cv.offsetTop, baixo = m.y < 74;
    tip.style.transform = `translate(${tx}px, ${cab + m.y + (baixo ? 18 : -16)}px) translate(-50%, ${baixo ? "0" : "-100%"})`;
    tip.classList.add("on");
  };
  cv.onpointermove = e => mostra(pos(e));
  cv.onpointerdown = e => mostra(pos(e));
  cv.onpointerleave = () => { c.mouse = null; c.sujo = true; if(tip) tip.classList.remove("on"); ceuPede(); };
  cv.onclick = e => { const m = pos(e); if(m.i != null) openWord(m.i); };
}

function nextAction(){
  const d = today(), c = counts(), due = dueList();
  if(due.length) return {t:"rev", txt:`Revisar ${due.length} ${plural(due.length,"palavra","palavras")}`, sub:`${Math.ceil(due.length*10/60)} min estimados`, run:()=>startReview(due)};
  if(d.novas < GOAL_NEW && c.nova > 0){
    const falta = GOAL_NEW - d.novas, n = Math.min(BATCH, falta);
    return {t:"new", txt:`Aprender ${n} ${plural(n,"palavra nova","palavras novas")}`, sub:`Lote de ${BATCH} · faltam ${falta} hoje`, run:()=>startLearn()};
  }
  // Reduções e Blocos saíram da próxima ação (pedido dele, 13/10) — não
  // entram mais como tarefa diária. A aba Frases continua existindo pra
  // quem quiser usar por conta própria.
  const vDue = vbDue();
  if(vDue.length) return {t:"verb", txt:`Revisar ${vDue.length} ${plural(vDue.length,"verbo","verbos")}`, sub:"Prática curta de cada verbo estudado.", run:()=>startVerbReview()};
  const pendVerb = pendenteVerb();
  if(pendVerb){
    const hojeV = (S.vb.hoje && S.vb.hoje.k === dayKey()) ? VERBOS.find(x => x.id === S.vb.hoje.id) : null;
    return {t:"verb", txt:"Estudar o verbo do dia",
      sub: hojeV && !vbLearned(hojeV.id) ? `Verbo de hoje: ${hojeV.word.toLowerCase()}.` : "O sistema sorteia o verbo de hoje.",
      run:()=>startVerbStudy(verbDoDia())};
  }
  const faltaTxt = Math.max(0, GOAL_TXT - textosHoje().length);
  const naoLidos = textosHoje().filter(t => !t.lido).length;
  if(temLeitura() && (faltaTxt || naoLidos)){
    return {t:"txt",
      txt: naoLidos ? `Ler ${naoLidos} ${plural(naoLidos,"texto","textos")} do dia` : `Escrever ${faltaTxt} ${plural(faltaTxt,"texto","textos")} do dia`,
      sub: "História nova com as palavras que você já domina. Inglês, depois tradução.",
      run:()=>go("ler")};
  }
  if(!d.rel){
    const rr = relEstado();
    return {t:"rel", txt:`Relâmpago — ${REL_SEG} segundos`,
      sub: rr.seq ? `Velocidade de reconhecimento. Seu recorde: ${rr.seq} seguidas.`
                  : "Velocidade de reconhecimento. Palavra na tela, duas opções, sem pensar muito.",
      run:()=>startRelampago()};
  }
  // só entra na fila se der pra abrir sessão de verdade (mesmo piso de
  // rushElegiveis() usado pelo próprio Recall Rush) — nunca sugere uma
  // tarefa que ele não consegue cumprir por falta de vocabulário ainda.
  if((d.rush||0) < GOAL_RUSH && rushElegiveis().length >= 4){
    return {t:"rush", txt:"Recall Rush — 3 minutos",
      sub: "Recall rápido do que você já estuda. Palavra na tela, só o significado importa.",
      run:()=>startRush(180)};
  }
  const pool = dominioPool();
  if(pool.sol.length + pool.dm.length > 0 && d.dom < 10)
    return {t:"dom", txt:"Treino de domínio", sub:`${pool.sol.length} ${plural(pool.sol.length,"palavra sólida","palavras sólidas")} esperando o teste final`, run:()=>startDominio()};
  return {t:"done", txt:"Dia completo", sub:"Missão cumprida. Volte amanhã.", run:null};
}

  // de ações do "Ir direto para" (cada uma já se protege sozinha quando
  // não há nada pra fazer, ex: startReview/startLearn mostram um toast).
  const acoesTrilha = {
    new:()=>startLearn(), rev:()=>startReview(dueList()), verb:()=>go("verbos"),
    txt:()=>go("ler"), rel:()=>startRelampago(), rush:()=>startRush(180)
  };
  v.querySelectorAll("[data-trilha]").forEach(b => b.onclick = () => {
    const f = acoesTrilha[b.dataset.trilha]; if(f) f();
  });
}

/* ============================ SESSÃO: APRENDER ============================ */
function startLearn(){
  const d = today();
  const falta = Math.max(0, GOAL_NEW - d.novas);
  const n = Math.min(BATCH, falta || BATCH);
  const ids = nextNewIds(n);
  if(!ids.length){ toast("Não há mais palavras novas."); return; }
  SESSION = new LearnSession(ids);
  render();
}
class LearnSession{
  constructor(ids){
    this.ids = ids; this.i = 0; this.step = 0; this.done = 0;
    this.revealed = false; this.timer = null; this.left = 12;
    this.chute = "";
    this.extra = null;   // revisão do lote
    this.fase = "learn";
  }
  get id(){ return this.ids[this.i]; }
  render(v){
    if(this.fase === "extra") return this.renderExtra(v);
    if(this.fase === "end") return this.renderEnd(v);
    const w = W[this.id];
    const steps = [
      {n:"01 — Significado", body:`<div class="word-pt">${esc(cap(w[0]))}</div>`},
      {n:"02 — Como fala",   body:`<div class="word-pt" style="font-size:24px;color:var(--tx2)">${esc(cap(w[0]))}</div>
                                   <div class="pron">${esc(w[1])}</div>
                                   <div class="mini">Leia em voz alta 3 vezes.</div>`},
      {n:"03 — PAV",         body:`${blocoImagem(this.id)}<div class="pav">${esc(pavOf(this.id))}</div>${this.linkEdit()}`},
      {n:"04 — Visualização",body:`<div class="muted" style="font-size:15px">Feche os olhos e veja a cena acontecendo.<br>No fim, diga a palavra em voz alta.</div>${this.ring()}`},
      {n:"05 — Como escreve",body:`<div class="word-en">${esc(w[2])}</div>${blocoFamilia(this.id)}<div class="mini">Grave a forma escrita.</div>`},
      {n:"06 — Recall",      body:this.revealed
          ? `<div class="pron">${esc(w[1])}</div><div class="word-en">${esc(w[2])}</div>${linhaChute(this.chute, w[2])}`
          : `<div class="muted" style="font-size:15px">Como se escreve em inglês?</div><div class="word-pt">${esc(cap(w[0]))}</div>${campoChute("escreva sua resposta")}`}
    ];
    const st = steps[this.step];
    const tot = this.ids.length;
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="bar"><i style="width:${pct(this.i*6+this.step, tot*6)}%"></i></div>
          <div class="mini">${this.i+1} / ${tot}</div>
        </div>
        <div class="stage">
          <div class="step">${st.n}</div>
          ${st.body}
          <div class="acts" id="acts"></div>
        </div>
        <div class="kbd">${this.step===5 && !this.revealed ? `<span>espaço</span> revelar` : this.step===5 ? `<span>1</span> errei &nbsp; <span>2</span> acertei` : `<span>espaço</span> continuar`}</div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair da sessão? O que já foi feito está salvo.")) go("home"); };
    const a = $("#acts");
    if(this.step === 3){
      a.innerHTML = `<button class="btn" id="pular">Pular espera</button>`;
      $("#pular").onclick = () => this.next();
      this.startRing();
    } else if(this.step === 5){
      if(!this.revealed){
        a.innerHTML = `<button class="btn pri lg" id="rev">Ver resposta</button>`;
        const revelar = () => { this.chute = valorChute(); this.revealed = true; this.render($("#view")); };
        $("#rev").onclick = revelar;
        ligaChute(revelar);
      } else {
        a.innerHTML = `<button class="btn bad" id="err">Errei</button><button class="btn ok" id="ok">Acertei</button>`;
        $("#err").onclick = () => this.answer(false);
        $("#ok").onclick = () => this.answer(true);
        sugereBotao(this.chute, w[2]);
      }
    } else {
      a.innerHTML = `<button class="btn pri" id="nx">Continuar</button>`;
      $("#nx").onclick = () => this.next();
    }
    const ed = $("#edPav"); if(ed) ed.onclick = () => editarPav(this.id, () => this.render($("#view")));
  }
  linkEdit(){ return `<div class="row" style="justify-content:center;gap:8px"><button class="edt" id="edPav">editar PAV</button>${botaoImagem(this.id)}</div>`; }
  ring(){
    return `<div class="ring"><svg width="96" height="96"><circle cx="48" cy="48" r="42" stroke="#272B33" stroke-width="5" fill="none"/>
      <circle id="rc" cx="48" cy="48" r="42" stroke="#5B8DEF" stroke-width="5" fill="none" stroke-linecap="round"
      stroke-dasharray="264" stroke-dashoffset="0"/></svg><b id="rt">12</b></div>`;
  }
  startRing(){
    clearInterval(this.timer); this.left = 12;
    this.timer = setInterval(()=>{
      this.left--;
      const rt = $("#rt"), rc = $("#rc");
      if(!rt){ clearInterval(this.timer); return; }
      rt.textContent = Math.max(0,this.left);
      if(rc) rc.setAttribute("stroke-dashoffset", String(264 * (1 - this.left/12)));
      if(this.left <= 0){ clearInterval(this.timer); this.next(); }
    }, 1000);
  }
  next(){
    clearInterval(this.timer);
    if(this.step < 5){ this.step++; this.revealed = false; this.render($("#view")); return; }
  }
  answer(ok){
    vibrar(ok);
    const id = this.id, w = wd(id);
    w.l = w.l || Date.now(); w.s = 0; w.a++; if(!ok){ w.e++; }
    scheduleNext(w);
    today().novas++;
    S.ultimo = Date.now();
    save();
    if(!ok) toast("Sem problema. Ela volta em 1 hora.");
    this.done++;
    clearInterval(this.timer);
    this.chute = "";
    if(this.i + 1 < this.ids.length){
      this.i++; this.step = 0; this.revealed = false; this.render($("#view"));
    } else {
      // fim do lote: 1 palavra antiga
      const due = dueList().filter(x => !this.ids.includes(x));
      if(due.length){ this.extra = due[0]; this.fase = "extra"; this.exRevealed = false; this.render($("#view")); }
      else { this.fase = "end"; this.render($("#view")); }
    }
  }
  renderExtra(v){
    const id = this.extra, w = W[id], st = S.w[id], target = st.s + 1, m = modeFor(target);
    const soMC = m.pede === "pt_mc";
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <span class="pill s-rev"><span class="dotc"></span>Revisão do lote</span>
          <div class="bar"><i style="width:100%"></i></div>
          <div class="mini">extra</div>
        </div>
        <div class="stage">
          <div class="step">Revisão ${target} de 8 · ${SCHED[target-1].nome}</div>
          ${cardFront(w, m, this.exRevealed, id)}
          ${!this.exRevealed ? (soMC ? campoEscolha(id) : campoChute(m.pede === "en" ? "escreva em inglês" : "escreva em português")) : ""}
          ${this.exRevealed ? cardBack(w, m, id) : ""}
          ${this.exRevealed ? (soMC ? linhaEscolha(this.exChute || "", this.exMcOk) : linhaChute(this.exChute || "", m.pede === "en" ? w[2] : w[0])) : ""}
          <div class="acts" id="acts"></div>
        </div>
      </div>`;
    const a = $("#acts");
    if(!this.exRevealed){
      a.innerHTML = soMC ? "" : `<button class="btn pri lg" id="rev">Ver resposta</button>`;
      const revelar = () => { this.exChute = valorChute(); this.exRevealed = true; this.render($("#view")); };
      if($("#rev")) $("#rev").onclick = revelar;
      ligaChute(revelar);
      if(soMC) v.querySelectorAll(".mc-op").forEach(b => b.onclick = () => {
        this.exChute = b.dataset.txt; this.exMcOk = Number(b.dataset.id) === id; this.exRevealed = true; this.render($("#view"));
      });
    } else {
      a.innerHTML = `<button class="btn bad" id="err">Errei</button><button class="btn ok" id="ok">Acertei</button>`;
      $("#err").onclick = () => { applyReview(id,false); markClean(); this.fase="end"; this.render($("#view")); };
      $("#ok").onclick  = () => { applyReview(id,true);  markClean(); this.fase="end"; this.render($("#view")); };
      if(soMC) $(this.exMcOk ? "#ok" : "#err").classList.add("sug");
      else sugereBotao(this.exChute || "", m.pede === "en" ? w[2] : w[0]);
    }
  }
  renderEnd(v){
    const d = today();
    const full = d.novas >= GOAL_NEW;
    v.innerHTML = `
      <div class="sess">
        <div class="stage">
          <div class="celebrate">
            <div class="ic">${full ? "🔥" : "✓"}</div>
            <div style="font-size:22px;font-weight:650;letter-spacing:-.02em">${full ? "Vocabulário do dia completo" : "Lote concluído"}</div>
            <div class="muted" style="margin-top:6px">${d.novas} de ${GOAL_NEW} palavras novas hoje${this.extra?" · 1 revisão do lote":""}</div>
          </div>
          <div class="acts">
            ${!full && counts().nova ? `<button class="btn pri" id="mais">Próximo lote</button>` : ""}
            <button class="btn ghost" id="home">Voltar ao início</button>
          </div>
        </div>
      </div>`;
    if($("#mais")) $("#mais").onclick = () => startLearn();
    $("#home").onclick = () => go("home");
  }
  key(e){
    if(this.fase !== "learn") {
      if(e.key === " " && this.fase === "extra" && !this.exRevealed){ e.preventDefault(); this.exRevealed = true; this.render($("#view")); }
      return;
    }
    if(e.key === " "){
      e.preventDefault();
      if(this.step === 5 && !this.revealed){ this.revealed = true; this.render($("#view")); }
      else if(this.step < 5) this.next();
    }
    if(this.step === 5 && this.revealed){
      if(e.key === "1") this.answer(false);
      if(e.key === "2") this.answer(true);
    }
  }
}

/* ============================ CARTÃO DE REVISÃO ============================ */
function cardFront(w, m, revealed, id){
  if(revealed) return "";
  const pav = esc(pavOf(id)), img = blocoImagem(id);
  if(m.mostra === "pt+pav")  return `<div class="word-pt">${esc(cap(w[0]))}</div>${img}<div class="pav">${pav}</div>`;
  if(m.mostra === "en+pav")  return `<div class="word-en">${esc(w[2])}</div>${img}<div class="pav">${pav}</div>`;
  if(m.mostra === "en")      return `<div class="word-en">${esc(w[2])}</div>`;
  // revisões 7 e 8: só o português. A imagem entra borrada, como isca —
  // a lacuna de curiosidade fecha quando você revela.
  return `<div class="word-pt">${esc(cap(w[0]))}</div>
          ${img ? `<div class="pavimg sm borrada"><img src="${imgSrc(imgOf(id))}" alt=""></div>` : ""}
          <div><span class="curio">${esc(curiosidade(id))}</span></div>`;
}
function cardBack(w, m, id){
  return `<div class="word-pt" style="font-size:22px;color:var(--tx2)">${esc(cap(w[0]))}</div>
          <div class="pron">${esc(w[1])}</div>
          <div class="word-en" style="font-size:30px">${esc(w[2])}</div>
          ${blocoFamilia(id)}
          ${blocoImagem(id, "sm")}`;
}
function applyReview(id, ok){
  const w = wd(id);
  w.a++;
  today().revs++;
  if(ok){
    w.s = Math.min(8, w.s + 1);
    w.r = false;
    if(w.s >= 8) w.m = true;
    scheduleNext(w);
  } else {
    w.e++; w.r = true;
    if(w.m) w.m = false;
    w.n = atHour(addDays(new Date(),1), 9);
  }
  S.ultimo = Date.now();
  save();
}

/* ============================ SESSÃO: REVISÃO ============================ */
function startReview(ids){
  if(!ids || !ids.length){ toast("Nenhuma revisão pendente."); return; }
  SESSION = new ReviewSession(ids.slice());
  render();
}
class ReviewSession{
  constructor(q){
    this.q = q.map(id => ({id, redo:false}));
    this.total = q.length; this.feitas = 0; this.acertos = 0;
    this.revealed = false; this.hinted = false; this.chute = ""; this.mcOk = false;
    this.seq = 0; this.melhor = 0; this.ultimoErrado = false;
    this.fecho = null; this.fechoFeito = false; this.fechoVisto = false;
  }
  render(v){
    if(!this.q.length) return this.renderFim(v);
    const {id, redo} = this.q[0];
    const w = W[id], st = S.w[id], target = Math.min(8, st.s + 1), m = modeFor(target);
    const hintable = target >= 7;
    const soMC = m.pede === "pt_mc";
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="bar"><i style="width:${pct(this.feitas, this.total)}%"></i></div>
          <div class="mini">${this.feitas} / ${this.total}</div>
        </div>
        <div class="stage">
          <div class="row" style="justify-content:center;gap:8px">
            <div class="step">Revisão ${target} de 8 · ${SCHED[target-1].nome}</div>
            ${redo ? `<span class="redo">reteste</span>` : ""}
          </div>
          ${cardFront(w, m, this.revealed, id)}
          ${this.hinted && !this.revealed ? `<div class="hintbox">${esc(pavOf(id))}</div>${blocoImagem(id, "sm")}` : ""}
          ${!this.revealed ? (soMC ? campoEscolha(id) : campoChute(m.pede === "en" ? "escreva em inglês" : "escreva em português")) : ""}
          ${this.revealed ? cardBack(w, m, id) : ""}
          ${this.revealed ? (soMC ? linhaEscolha(this.chute, this.mcOk) : linhaChute(this.chute, m.pede === "en" ? w[2] : w[0])) : ""}
          ${this.revealed && this.lastWrong ? `<div class="hintbox" style="border-color:#6B2C28">${esc(pavOf(id))}<div class="mini" style="margin-top:8px;color:var(--ref)">Fale a palavra em voz alta 3 vezes. Ela volta daqui a pouco.</div></div>` : ""}
          <div class="acts" id="acts"></div>
          ${this.revealed ? `<div class="row" style="justify-content:center;gap:8px"><button class="edt" id="edPav">editar PAV</button>${botaoImagem(id)}</div>` : ""}
        </div>
        <div class="kbd">${this.revealed ? `<span>1</span> errei &nbsp; <span>2</span> acertei` : soMC ? "toque na opção certa" : `<span>espaço</span> ver resposta`}</div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair da revisão? O que já foi feito está salvo.")) go("home"); };
    const a = $("#acts");
    if(!this.revealed){
      a.innerHTML = soMC ? "" : `${hintable && !this.hinted ? `<button class="btn ghost" id="dica">Dica</button>` : ""}<button class="btn pri lg" id="rev">Ver resposta</button>`;
      if($("#dica")) $("#dica").onclick = () => { this.chute = valorChute(); this.hinted = true; this.render($("#view")); };
      if($("#rev")) $("#rev").onclick = () => this.reveal();
      ligaChute(() => this.reveal());
      if(soMC) v.querySelectorAll(".mc-op").forEach(b => b.onclick = () => {
        this.chute = b.dataset.txt; this.mcOk = Number(b.dataset.id) === id; this.reveal();
      });
    } else {
      a.innerHTML = `<button class="btn bad" id="err">Errei</button><button class="btn ok" id="ok">Acertei</button>`;
      $("#err").onclick = () => this.answer(false);
      $("#ok").onclick = () => this.answer(true);
      $("#edPav").onclick = () => editarPav(id, () => this.render($("#view")));
      if(soMC) $(this.mcOk ? "#ok" : "#err").classList.add("sug");
      else sugereBotao(this.chute, m.pede === "en" ? w[2] : w[0]);
    }
  }
  reveal(){ this.chute = valorChute() || this.chute; this.revealed = true; this.lastWrong = false; this.render($("#view")); }
  answer(ok){
    const item = this.q.shift();
    const realOk = ok && !this.hinted;
    vibrar(realOk);
    this.seq = realOk ? (this.seq || 0) + 1 : 0;
    this.melhor = Math.max(this.melhor || 0, this.seq);
    this.ultimoErrado = !realOk;
    if(!item.redo){
      applyReview(item.id, realOk);
      this.feitas++;
      if(realOk) this.acertos++;
    } else if(realOk){
      const w = wd(item.id); w.r = false; save();
    }
    if(!realOk){
      if(this.hinted && ok) toast("Usou a dica: conta como erro.");
      const vezes = (item.vezes || 0) + 1;
      if(vezes <= 2){
        const pos = Math.min(this.q.length, 3);
        this.q.splice(pos, 0, {id:item.id, redo:true, vezes});
      }
    }
    this.revealed = false; this.hinted = false; this.lastWrong = false; this.chute = ""; this.mcOk = false;
    markClean();
    this.render($("#view"));
  }
  /* A gente julga a sessão pelo pico e pelo fim. Terminar num erro deixa
     lembrança ruim, então entra uma carta fácil para fechar em alta. */
  renderFim(v){
    // sessão com tropeço termina numa carta fácil: o que fica na lembrança
    // é o pico e o fim, não a média
    if(this.acertos < this.feitas && !this.fechoFeito && this.feitas >= 3){
      const pool = [];
      for(let i = 0; i < W.length && pool.length < 40; i++){
        const x = S.w[i];
        if(x && x.l && !x.r && (x.m || x.s >= 5)) pool.push(i);
      }
      if(pool.length){
        this.fechoFeito = true;
        this.fecho = pool[Math.floor(Math.random() * pool.length)];
      }
    }
    if(this.fecho !== null && this.fecho !== undefined) return this.renderFecho(v);
    return this.renderEnd(v);
  }
  renderFecho(v){
    const id = this.fecho, w = W[id];
    v.innerHTML = `
      <div class="sess">
        <div class="stage">
          <div class="step" style="color:var(--solida)">Fechando em alta · não vale nota</div>
          <div class="word-pt">${esc(cap(w[0]))}</div>
          ${this.fechoVisto ? `<div class="word-en" style="font-size:30px;color:var(--solida)">${esc(w[2])}</div>` : `<div class="mini">Uma que você já domina. Diga em inglês.</div>`}
          <div class="acts" id="acts"></div>
        </div>
      </div>`;
    const a = $("#acts");
    if(!this.fechoVisto){
      a.innerHTML = `<button class="btn pri lg" id="rev">Ver</button>`;
      $("#rev").onclick = () => { this.fechoVisto = true; vibrar(true); this.render($("#view")); };
    } else {
      a.innerHTML = `<button class="btn ok" id="fim">Encerrar</button>`;
      $("#fim").onclick = () => { this.fecho = null; this.render($("#view")); };
    }
  }
  renderEnd(v){
    const rest = dueList().length;
    v.innerHTML = `
      <div class="sess">
        <div class="stage">
          <div class="celebrate">
            <div class="ic">✓</div>
            <div style="font-size:22px;font-weight:650;letter-spacing:-.02em">Revisões em dia</div>
            <div class="muted" style="margin-top:6px">${this.feitas} ${plural(this.feitas,"revisão","revisões")} · ${pct(this.acertos,this.total)}% de acerto</div>
            ${(this.melhor||0) >= 3 ? `<div class="mini" style="margin-top:8px;color:var(--solida)">melhor sequência da sessão: ${this.melhor} seguidas</div>` : ""}
          </div>
          <div class="acts">
            ${rest ? `<button class="btn pri" id="mais">Revisar mais ${rest}</button>` : ""}
            <button class="btn ghost" id="home">Voltar ao início</button>
          </div>
        </div>
      </div>`;
    if($("#mais")) $("#mais").onclick = () => startReview(dueList());
    $("#home").onclick = () => go("home");
  }
  key(e){
    if(!this.q.length) return;
    if(e.key === " " && !this.revealed){ e.preventDefault(); this.reveal(); }
    if(this.revealed){
      if(e.key === "1") this.answer(false);
      if(e.key === "2") this.answer(true);
    }
  }
}

/* ============================ SESSÃO: TREINO DE DOMÍNIO ============================ */
function startDominio(){
  const p = dominioPool();
  let pool = p.sol.slice();
  if(pool.length < 10) pool = pool.concat(p.dm.sort(()=>Math.random()-.5).slice(0, 10 - pool.length));
  if(!pool.length){ toast("Nenhuma palavra sólida ainda. Elas aparecem depois da revisão de 1 mês."); return; }
  pool = pool.sort(()=>Math.random()-.5).slice(0, 10);
  SESSION = new DominioSession(pool);
  render();
}
class DominioSession{
  constructor(q){ this.q = q; this.i = 0; this.revealed = false; this.novas = 0; this.perdidas = 0; this.chute = ""; }
  render(v){
    if(this.i >= this.q.length) return this.renderEnd(v);
    const id = this.q[this.i], w = W[id], era = S.w[id].m;
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="bar"><i style="width:${pct(this.i,this.q.length)}%;background:var(--dom)"></i></div>
          <div class="mini">${this.i+1} / ${this.q.length}</div>
        </div>
        <div class="stage">
          <div class="step" style="color:var(--dom)">Treino de domínio · sem PAV, sem dica</div>
          ${era ? `<div><span class="pill s-dom"><span class="dotc"></span>Dominada</span></div>` : `<div><span class="pill s-solida"><span class="dotc"></span>Sólida</span></div>`}
          <div class="word-en">${esc(w[2])}</div>
          ${this.revealed
            ? `<div class="word-pt" style="font-size:28px;color:var(--solida)">${esc(cap(w[0]))}</div>${linhaChute(this.chute, w[0])}`
            : `<div class="mini">O que significa em português?</div>${campoChute("escreva em português")}`}
          <div class="acts" id="acts"></div>
        </div>
        <div class="kbd">${this.revealed ? `<span>1</span> errei &nbsp; <span>2</span> acertei` : `<span>espaço</span> ver resposta`}</div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair do treino?")) go("home"); };
    const a = $("#acts");
    if(!this.revealed){
      a.innerHTML = `<button class="btn pri lg" id="rev">Ver resposta</button>`;
      const revelar = () => { this.chute = valorChute(); this.revealed = true; this.render($("#view")); };
      $("#rev").onclick = revelar;
      ligaChute(revelar);
    } else {
      a.innerHTML = `<button class="btn bad" id="err">Errei</button><button class="btn ok" id="ok">Acertei</button>`;
      $("#err").onclick = () => this.answer(false);
      $("#ok").onclick = () => this.answer(true);
      sugereBotao(this.chute, w[0]);
    }
  }
  answer(ok){
    vibrar(ok);
    const id = this.q[this.i], w = wd(id);
    w.a++;
    if(ok){ if(!w.m){ w.m = true; this.novas++; } }
    else { if(w.m){ w.m = false; this.perdidas++; } w.e++; }
    today().dom++;
    save();
    this.i++; this.revealed = false; this.chute = "";
    this.render($("#view"));
  }
  renderEnd(v){
    v.innerHTML = `
      <div class="sess">
        <div class="stage">
          <div class="celebrate">
            <div class="ic">🏆</div>
            <div style="font-size:22px;font-weight:650;letter-spacing:-.02em">Treino concluído</div>
            <div class="muted" style="margin-top:6px">
              ${this.novas} ${plural(this.novas,"nova palavra dominada","novas palavras dominadas")}
              ${this.perdidas ? ` · ${this.perdidas} ${plural(this.perdidas,"perdeu o título","perderam o título")}` : ""}
            </div>
            <div class="mini" style="margin-top:8px">Total: ${counts().dom} / ${LEVEL_TOTAL}</div>
          </div>
          <div class="acts"><button class="btn ghost" id="home">Voltar ao início</button></div>
        </div>
      </div>`;
    $("#home").onclick = () => go("home");
  }
  key(e){
    if(this.i >= this.q.length) return;
    if(e.key === " " && !this.revealed){ e.preventDefault(); this.revealed = true; this.render($("#view")); }
    if(this.revealed){
      if(e.key === "1") this.answer(false);
      if(e.key === "2") this.answer(true);
    }
  }
}

/* ============================ RELÂMPAGO ============================ */
/* 30 segundos, uma palavra por vez, duas opções. O que este treino mede é
   TEMPO DE REAÇÃO, não memória — por isso ele não avança estágio nenhum e
   não mexe na agenda de revisão. Fala real chega a 150 palavras por minuto:
   saber a palavra em 2 segundos é o mesmo que não saber. */
const REL_SEG = 30;          // duração da rodada
const REL_RECENTES = 80;     // palavras que não repetem na rodada seguinte
const REL_HIST = 60;         // rodadas guardadas para a linha do tempo
const REL_MIN_TEMPO = 8;     // acertos mínimos para o tempo médio valer recorde

function relEstado(){
  if(!S.rel) S.rel = {seq:0, acertos:0, tempo:null, rodadas:[], recentes:[]};
  const r = S.rel;
  if(!Array.isArray(r.rodadas)) r.rodadas = [];
  if(!Array.isArray(r.recentes)) r.recentes = [];
  return r;
}

/* ---- sorteio ---- */
/* Aleatório de verdade no banco inteiro (pedido dele em 25/09: com 3000
   palavras, não faz sentido travar sempre nas mesmas ~240 primeiras).
   Não toca na agenda de revisão nem exige palavra já estudada — zero risco,
   já que o relâmpago não mexe em SRS; errar uma que ele nunca viu não custa
   nada e ainda é exposição a mais. */
function relPool(){
  const evita = new Set(relEstado().recentes);
  const mistura = a => a.slice().sort(() => Math.random() - .5);
  const todas = []; for(let i = 0; i < W.length; i++) todas.push(i);
  let pool = mistura(todas.filter(i => !evita.has(i)));
  if(pool.length < 30) pool = pool.concat(mistura(todas.filter(i => evita.has(i))));
  return pool;
}

/* ---- distrator ---- */
/* Mesma classe gramatical e frequência parecida: obriga a reconhecer a
   palavra em vez de eliminar a opção absurda. */
const relTok = t => String(t || "").toLowerCase().split(/[\/,;()\s]+/).filter(x => x.length > 2);
function relColide(a, b){
  if(W[a][2].toLowerCase() === W[b][2].toLowerCase()) return true;
  const x = relTok(W[a][0]), y = relTok(W[b][0]);
  return x.some(t => y.indexOf(t) >= 0);
}
function relDistrator(id, usados){
  const classe = W[id][4], bloco = W[id][5];
  const acha = f => {
    const c = [];
    for(let i = 0; i < W.length; i++){
      if(i === id || usados.has(i)) continue;
      if(!f(i) || relColide(id, i)) continue;
      c.push(i);
    }
    return c.length ? c[Math.floor(Math.random() * c.length)] : null;
  };
  return acha(i => W[i][4] === classe && Math.abs(W[i][5] - bloco) <= 8)
      || acha(i => W[i][4] === classe)
      || acha(() => true);
}

function relMedia(itens){
  const bons = itens.filter(x => x.ok);
  if(!bons.length) return null;
  return Math.round(bons.reduce((s, x) => s + x.ms, 0) / bons.length);
}
const relSeg = ms => ms == null ? "—" : (ms / 1000).toFixed(2) + "s";

function startRelampago(){
  const pool = relPool();
  if(pool.length < 4){ toast("Sem palavras suficientes para o relâmpago."); return; }
  SESSION = new RelampagoSession(pool);
  render();
}

class RelampagoSession{
  constructor(pool){
    this.pool = pool; this.p = 0;
    this.fase = "pronto";          // pronto | contando | jogando | fim
    this.conta = 3;
    this.itens = []; this.atual = null;
    this.acertos = 0; this.erros = 0;
    this.seq = 0; this.melhorSeq = 0;
    this.usados = new Set();
    this.ultimo = null;
    this.fimEm = 0; this.timer = null; this.t0 = 0;
    this.recordes = null;
  }

  /* ---- ciclo ---- */
  comecar(){
    this.fase = "contando"; this.conta = 3;
    this.render($("#view"));
    const passo = () => {
      if(SESSION !== this) return;
      this.conta--;
      if(this.conta > 0){ this.render($("#view")); setTimeout(passo, 620); return; }
      this.jogar();
    };
    setTimeout(passo, 620);
  }
  jogar(){
    this.fase = "jogando";
    this.fimEm = performance.now() + REL_SEG * 1000;
    this.proxima();
    this.timer = setInterval(() => {
      if(SESSION !== this){ clearInterval(this.timer); return; }
      const resta = this.fimEm - performance.now();
      if(resta <= 0){ this.encerrar(); return; }
      const b = $("#relBar"), s = $("#relSeg");
      if(b) b.style.width = (resta / (REL_SEG * 1000) * 100).toFixed(1) + "%";
      if(s) s.textContent = (resta / 1000).toFixed(1);
    }, 80);
    this.render($("#view"));
  }
  proxima(){
    if(this.p >= this.pool.length) this.p = 0;
    const id = this.pool[this.p++];
    this.usados.add(id);
    const dist = relDistrator(id, this.usados);
    if(dist == null){ this.encerrar(); return; }
    this.usados.add(dist);
    const dir = Math.random() < .5 ? "en" : "pt";       // en: mostra inglês · pt: mostra português
    this.atual = {id, dist, dir, esq: Math.random() < .5};
    this.t0 = performance.now();
  }
  responder(certo){
    if(this.fase !== "jogando" || !this.atual) return;
    const a = this.atual, ms = Math.round(performance.now() - this.t0);
    vibrar(certo);
    if(certo){
      this.acertos++; this.seq++;
      if(this.seq > this.melhorSeq) this.melhorSeq = this.seq;
    } else { this.erros++; this.seq = 0; }
    this.itens.push({id:a.id, dist:a.dist, dir:a.dir, ok:certo, ms});
    this.ultimo = certo;          // pinta a arena da próxima carta por um instante
    this.proxima();
    if(this.fase === "jogando") this.render($("#view"));
  }
  encerrar(){
    clearInterval(this.timer); this.timer = null;
    this.fase = "fim";
    const rel = relEstado(), media = relMedia(this.itens);
    this.recordes = {
      seq: this.melhorSeq > (rel.seq || 0),
      acertos: this.acertos > (rel.acertos || 0),
      tempo: media != null && this.acertos >= REL_MIN_TEMPO && (rel.tempo == null || media < rel.tempo),
      antes: {seq: rel.seq || 0, acertos: rel.acertos || 0, tempo: rel.tempo}
    };
    if(this.recordes.seq) rel.seq = this.melhorSeq;
    if(this.recordes.acertos) rel.acertos = this.acertos;
    if(this.recordes.tempo) rel.tempo = media;
    if(this.itens.length){
      rel.rodadas.push([Date.now(), this.acertos, this.erros, this.melhorSeq, media || 0]);
      if(rel.rodadas.length > REL_HIST) rel.rodadas = rel.rodadas.slice(-REL_HIST);
      const novas = this.itens.map(x => x.id);
      rel.recentes = novas.concat(rel.recentes.filter(i => novas.indexOf(i) < 0)).slice(0, REL_RECENTES);
      today().rel = (today().rel || 0) + 1;
      save();
    }
    this.render($("#view"));
  }

  /* ---- telas ---- */
  render(v){
    if(this.fase === "fim") return this.renderFim(v);
    if(this.fase === "pronto") return this.renderPronto(v);
    if(this.fase === "contando") return this.renderConta(v);
    return this.renderJogo(v);
  }
  renderPronto(v){
    const rel = relEstado();
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="mini">Relâmpago · ${REL_SEG} segundos</div>
        </div>
        <div class="stage">
          <div class="rel-ic">⚡</div>
          <div style="font-size:26px;font-weight:700;letter-spacing:-.03em">Quantas você faz em ${REL_SEG} segundos?</div>
          <div class="muted" style="max-width:46ch;font-size:14.5px;line-height:1.55">
            Aparece uma palavra e duas opções. Toque na certa. Erro não para nada —
            no fim você vê tudo o que passou.
          </div>
          ${(rel.seq || rel.acertos) ? `<div class="rel-recs">
            <div><span>Recorde de sequência</span><b>${rel.seq || 0}</b></div>
            <div><span>Recorde de acertos</span><b>${rel.acertos || 0}</b></div>
            <div><span>Melhor tempo médio</span><b>${relSeg(rel.tempo)}</b></div>
          </div>` : ""}
          <div class="acts"><button class="btn pri lg" id="vai">Começar</button></div>
        </div>
        <div class="kbd"><span>1</span> opção da esquerda &nbsp; <span>2</span> opção da direita</div>
      </div>`;
    $("#sair").onclick = () => go("home");
    $("#vai").onclick = () => this.comecar();
  }
  renderConta(v){
    v.innerHTML = `<div class="sess"><div class="stage"><div class="rel-conta">${this.conta}</div></div></div>`;
  }
  renderJogo(v){
    const a = this.atual, w = W[a.id], d = W[a.dist];
    /* a carta é redesenhada a cada toque: o relógio tem que ser lido do tempo
       real, senão a barra volta para o começo toda vez que ele responde */
    const resta = Math.max(0, this.fimEm - performance.now());
    const pergunta = a.dir === "en" ? w[2] : cap(w[0]);
    const certa = a.dir === "en" ? cap(w[0]) : w[2];
    const errada = a.dir === "en" ? cap(d[0]) : d[2];
    const ops = a.esq ? [[certa, true], [errada, false]] : [[errada, false], [certa, true]];
    v.innerHTML = `
      <div class="sess rel-sess">
        <div class="rel-topo">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="rel-placar">
            <b class="ok">${this.acertos}</b><i>·</i><b class="bad">${this.erros}</b>
            ${this.seq >= 3 ? `<span class="rel-fogo">${this.seq} seguidas</span>` : ""}
          </div>
          <div class="rel-seg"><b id="relSeg">${(resta / 1000).toFixed(1)}</b>s</div>
        </div>
        <div class="rel-trilho"><i id="relBar" style="width:${(resta / (REL_SEG * 1000) * 100).toFixed(1)}%"></i></div>
        <div class="rel-arena ${this.ultimo === true ? "pulso-ok" : this.ultimo === false ? "pulso-bad" : ""}">
          <div class="rel-q">
            <div class="rel-dir">escolha ${a.dir === "en" ? "em português" : "em inglês"}</div>
            <div class="rel-alvo ${a.dir === "en" ? "en" : ""}">${esc(pergunta)}</div>
          </div>
          <div class="rel-ops">
            ${ops.map(([t, ok], i) => `<button class="rel-op" data-ok="${ok ? 1 : 0}"><span class="rel-n">${i + 1}</span>${esc(t)}</button>`).join("")}
          </div>
        </div>
      </div>`;
    $("#sair").onclick = () => { clearInterval(this.timer); go("home"); };
    v.querySelectorAll(".rel-op").forEach(b => b.onclick = () => this.responder(b.dataset.ok === "1"));
  }
  renderFim(v){
    const total = this.itens.length, media = relMedia(this.itens), rec = this.recordes || {};
    const errados = this.itens.filter(x => !x.ok), certos = this.itens.filter(x => x.ok);
    const linha = x => {
      const w = W[x.id], d = W[x.dist];
      const marcou = x.dir === "en" ? cap(d[0]) : d[2];
      return `<div class="rel-l ${x.ok ? "ok" : "bad"}">
        <div class="rel-par"><b>${esc(w[2])}</b><i>${esc(w[1])}</i><span>${esc(cap(w[0]))}</span></div>
        <div class="rel-meta">${x.ok ? relSeg(x.ms) : `marcou <em>${esc(marcou)}</em>`}</div>
      </div>`;
    };
    const medalha = (cond, txt) => cond ? `<div class="rel-med">🏅 ${txt}</div>` : "";
    v.innerHTML = `
      <div class="sess">
        <div class="stage" style="align-items:stretch;text-align:left">
          <div class="rel-fim">
            <div class="rel-ic">⚡</div>
            <div class="rel-placarF">
              <div><b class="ok">${this.acertos}</b><span>acertos</span></div>
              <div><b class="bad">${this.erros}</b><span>erros</span></div>
              <div><b>${this.melhorSeq}</b><span>maior sequência</span></div>
              <div><b>${relSeg(media)}</b><span>tempo médio</span></div>
            </div>
            ${medalha(rec.seq, `Novo recorde de sequência: ${this.melhorSeq} (antes ${rec.antes ? rec.antes.seq : 0})`)}
            ${medalha(rec.acertos, `Novo recorde de acertos: ${this.acertos} (antes ${rec.antes ? rec.antes.acertos : 0})`)}
            ${medalha(rec.tempo, `Novo melhor tempo médio: ${relSeg(media)} (antes ${relSeg(rec.antes ? rec.antes.tempo : null)})`)}
            ${total ? `<div class="mini" style="margin-top:2px">${total} ${plural(total, "palavra passou", "palavras passaram")} em ${REL_SEG} segundos · ${pct(this.acertos, total)}% de acerto</div>` : ""}
          </div>

          ${errados.length ? `<div class="rel-bloco">
            <div class="lbl" style="color:var(--ref)">Errou · ${errados.length}</div>
            ${errados.map(linha).join("")}
            <button class="btn sm" id="relRef">Mandar as que errei para reforço</button>
          </div>` : (total ? `<div class="rel-bloco"><div class="lbl" style="color:var(--solida)">Nenhum erro.</div></div>` : "")}

          ${certos.length ? `<div class="rel-bloco">
            <div class="lbl" style="color:var(--solida)">Acertou · ${certos.length}</div>
            ${certos.map(linha).join("")}
          </div>` : ""}

          <div class="acts">
            <button class="btn ghost" id="home">Voltar ao início</button>
            <button class="btn pri" id="dnv">Jogar de novo</button>
          </div>
        </div>
      </div>`;
    $("#home").onclick = () => go("home");
    $("#dnv").onclick = () => startRelampago();
    if($("#relRef")) $("#relRef").onclick = () => {
      let n = 0;
      errados.forEach(x => { if(isLearned(x.id) && !S.w[x.id].r){ S.w[x.id].r = true; n++; } });
      save();
      toast(n ? `${n} ${plural(n, "palavra marcada", "palavras marcadas")} para reforço.`
              : "Essas ainda não entraram no estudo — elas vêm na ordem normal.");
      $("#relRef").disabled = true;
    };
  }
  key(e){
    if(this.fase === "pronto" && (e.key === " " || e.key === "Enter")){ e.preventDefault(); this.comecar(); return; }
    if(this.fase !== "jogando") return;
    const b = document.querySelectorAll(".rel-op");
    if(e.key === "1" && b[0]) b[0].click();
    if(e.key === "2" && b[1]) b[1].click();
  }
}

/* ============================ RECALL RUSH ============================ */
/* Sessão cronometrada (2/3/5 min) só com palavras que ele já começou a
   estudar (isLearned — estágio 1+, pedido dele em 16/10) — nunca com
   palavra nova/não vista. Mede recall de SIGNIFICADO, não tempo de
   reação como o Relâmpago; por isso ficam separados. Não avança estágio
   nenhum do SRS, não marca "aprendida"/"dominada" por acerto aqui, não
   toca na agenda de revisão nem no histórico original — só grava placar
   e um registro de erro isolado (S.rush.misses), próprio deste treino,
   pra priorizar o que ele mais erra DENTRO do Recall Rush. */
const RUSH_DURACOES = [120, 180, 300];      // 2, 3, 5 minutos
const RUSH_COOLDOWN = 3;                     // perguntas até uma errada poder voltar
const RUSH_MISS_DIAS = 14;                   // por quanto tempo um erro aqui pesa no sorteio
const rushMin = seg => Math.round(seg / 60);

/* todas as já aprendidas — cresce sozinho conforme o banco cresce,
   nunca cai pra palavra não vista mesmo com poucas elegíveis */
function rushElegiveis(){
  const out = [];
  for(let i = 0; i < W.length; i++) if(isLearned(i)) out.push(i);
  return out;
}
/* peso maior = aparece com mais frequência — sempre por sorteio, nunca
   ordem fixa. Prioriza quem está em reforço, quem mais errou no estudo
   normal e quem errou recentemente aqui dentro do próprio Recall Rush. */
function rushPeso(id){
  const w = S.w[id];
  let p = 1;
  if(w.r) p += 3;
  p += Math.min(3, w.e || 0);
  const falhou = S.rush.misses[id];
  if(falhou && Date.now() - falhou < RUSH_MISS_DIAS * 86400000) p += 2;
  return p;
}
function rushRecordes(dur){ return (S.rush.recs && S.rush.recs[dur]) || {acertos:0, seq:0}; }

function startRush(dur){
  const elig = rushElegiveis();
  if(elig.length < 4){ toast("Ainda não há palavras estudadas o bastante para o Recall Rush — continue aprendendo palavras novas primeiro."); return; }
  SESSION = new RushSession(dur, elig);
  render();
}

class RushSession{
  constructor(dur, elig){
    this.dur = dur;
    this.elig = elig;
    this.fase = "pronto";          // pronto | contando | jogando | fim
    this.conta = 3;
    this.usados = new Set();
    this.recentes = [];             // últimos ids mostrados — não repete em sequência
    this.pendentes = [];            // [{id, desde}] erradas aguardando voltar
    this.atual = null;
    this.acertos = 0; this.erros = 0; this.total = 0;
    this.seq = 0; this.melhorSeq = 0;
    this.itens = [];
    this.ultimo = null;
    this.fimEm = 0; this.timer = null;
    this.recordes = null;
  }

  trocarDuracao(dur){
    if(this.fase !== "pronto" || dur === this.dur) return;
    this.dur = dur;
    this.render($("#view"));
  }

  /* ---- ciclo ---- */
  comecar(){
    this.fase = "contando"; this.conta = 3;
    this.render($("#view"));
    const passo = () => {
      if(SESSION !== this) return;
      this.conta--;
      if(this.conta > 0){ this.render($("#view")); setTimeout(passo, 620); return; }
      this.jogar();
    };
    setTimeout(passo, 620);
  }
  jogar(){
    this.fase = "jogando";
    this.fimEm = performance.now() + this.dur * 1000;
    this.proxima();
    this.timer = setInterval(() => {
      if(SESSION !== this){ clearInterval(this.timer); return; }
      const resta = this.fimEm - performance.now();
      if(resta <= 0){ this.encerrar(); return; }
      const b = $("#rushBar"), s = $("#rushSeg");
      if(b) b.style.width = (resta / (this.dur * 1000) * 100).toFixed(1) + "%";
      if(s) s.textContent = Math.ceil(resta / 1000);
    }, 100);
    this.render($("#view"));
  }
  /* erro não desaparece: volta depois de RUSH_COOLDOWN outras perguntas,
     nunca na pergunta seguinte — e sem tirar tempo do cronômetro */
  escolheId(){
    const pronto = this.pendentes.find(p => this.total - p.desde >= RUSH_COOLDOWN);
    if(pronto){
      this.pendentes = this.pendentes.filter(p => p !== pronto);
      return pronto.id;
    }
    const evitar = new Set(this.recentes);
    let cand = this.elig.filter(id => !evitar.has(id));
    if(cand.length < 4) cand = this.elig;              // banco elegível pequeno: relaxa
    let soma = 0;
    const pesos = cand.map(id => { const p = rushPeso(id); soma += p; return p; });
    let r = Math.random() * soma;
    for(let i = 0; i < cand.length; i++){ r -= pesos[i]; if(r <= 0) return cand[i]; }
    return cand[cand.length - 1];
  }
  proxima(){
    const id = this.escolheId();
    if(id == null){ this.encerrar(); return; }
    this.usados.add(id);
    const dist = relDistrator(id, this.usados);
    if(dist == null){ this.encerrar(); return; }
    this.usados.add(dist);
    this.recentes.push(id);
    if(this.recentes.length > Math.min(6, this.elig.length - 1)) this.recentes.shift();
    this.atual = {id, dist, esq: Math.random() < .5};
  }
  responder(certo){
    if(this.fase !== "jogando" || !this.atual) return;
    const a = this.atual;
    vibrar(certo);
    this.total++;
    if(certo){
      this.acertos++; this.seq++;
      if(this.seq > this.melhorSeq) this.melhorSeq = this.seq;
    } else {
      this.erros++; this.seq = 0;
      this.pendentes.push({id:a.id, desde:this.total});
      S.rush.misses[a.id] = Date.now();
    }
    this.itens.push({id:a.id, dist:a.dist, ok:certo});
    this.ultimo = certo;
    this.proxima();
    if(this.fase === "jogando") this.render($("#view"));
  }
  encerrar(){
    clearInterval(this.timer); this.timer = null;
    this.fase = "fim";
    const rec = rushRecordes(this.dur);
    this.recordes = {
      acertos: this.acertos > (rec.acertos || 0),
      seq: this.melhorSeq > (rec.seq || 0),
      antes: {acertos: rec.acertos || 0, seq: rec.seq || 0}
    };
    if(this.total){
      if(!S.rush.recs) S.rush.recs = {};
      S.rush.recs[this.dur] = {
        acertos: Math.max(this.acertos, rec.acertos || 0),
        seq: Math.max(this.melhorSeq, rec.seq || 0)
      };
      S.rush.hist.push({t:Date.now(), dur:this.dur, acertos:this.acertos, erros:this.erros, seq:this.melhorSeq});
      if(S.rush.hist.length > RUSH_HIST) S.rush.hist = S.rush.hist.slice(-RUSH_HIST);
      today().rush = (today().rush || 0) + 1;      // conta pra meta diária do Recall Rush (GOAL_RUSH) desde 16/10 — mas nunca mexe em S.w/estágio
      save();
    }
    this.render($("#view"));
  }

  /* ---- telas ---- */
  render(v){
    if(this.fase === "fim") return this.renderFim(v);
    if(this.fase === "pronto") return this.renderPronto(v);
    if(this.fase === "contando") return this.renderConta(v);
    return this.renderJogo(v);
  }
  renderPronto(v){
    const rec = rushRecordes(this.dur), m = rushMin(this.dur);
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="mini">Recall Rush</div>
        </div>
        <div class="stage">
          <div class="rel-ic">🧠</div>
          <div style="font-size:26px;font-weight:700;letter-spacing:-.03em">Quantas você lembra em ${m} ${plural(m, "minuto", "minutos")}?</div>
          <div class="muted" style="max-width:46ch;font-size:14.5px;line-height:1.55">
            Só palavras que você já está estudando. Aparece a palavra em inglês e duas opções
            em português — toque na certa. Errou? Ela volta mais adiante, sem pressa.
          </div>
          <div class="row" style="gap:8px;justify-content:center">
            ${RUSH_DURACOES.map(d => `<button class="btn sm ${d === this.dur ? "pri" : "ghost"}" data-dur="${d}">${rushMin(d)} min</button>`).join("")}
          </div>
          ${(rec.acertos || rec.seq) ? `<div class="rel-recs">
            <div><span>Recorde de acertos</span><b>${rec.acertos || 0}</b></div>
            <div><span>Recorde de sequência</span><b>${rec.seq || 0}</b></div>
          </div>` : ""}
          <div class="acts"><button class="btn pri lg" id="vai">Começar</button></div>
        </div>
        <div class="kbd"><span>1</span> opção da esquerda &nbsp; <span>2</span> opção da direita</div>
      </div>`;
    $("#sair").onclick = () => go("home");
    $("#vai").onclick = () => this.comecar();
    v.querySelectorAll("[data-dur]").forEach(b => b.onclick = () => this.trocarDuracao(+b.dataset.dur));
  }
  renderConta(v){
    v.innerHTML = `<div class="sess"><div class="stage"><div class="rel-conta">${this.conta}</div></div></div>`;
  }
  renderJogo(v){
    const a = this.atual, w = W[a.id], d = W[a.dist];
    const resta = Math.max(0, this.fimEm - performance.now());
    const ops = a.esq ? [[cap(w[0]), true], [cap(d[0]), false]] : [[cap(d[0]), false], [cap(w[0]), true]];
    v.innerHTML = `
      <div class="sess rel-sess">
        <div class="rel-topo">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="rel-placar">
            <b class="ok">${this.acertos}</b><i>·</i><b class="bad">${this.erros}</b>
            ${this.seq >= 3 ? `<span class="rel-fogo">${this.seq} seguidas</span>` : ""}
          </div>
          <div class="rel-seg"><b id="rushSeg">${Math.ceil(resta / 1000)}</b>s</div>
        </div>
        <div class="rel-trilho"><i id="rushBar" style="width:${(resta / (this.dur * 1000) * 100).toFixed(1)}%"></i></div>
        <div class="rel-arena ${this.ultimo === true ? "pulso-ok" : this.ultimo === false ? "pulso-bad" : ""}">
          <div class="rel-q">
            <div class="rel-dir">o que significa</div>
            <div class="rel-alvo en">${esc(w[2])}</div>
          </div>
          <div class="rel-ops">
            ${ops.map(([t, ok], i) => `<button class="rel-op" data-ok="${ok ? 1 : 0}"><span class="rel-n">${i + 1}</span>${esc(t)}</button>`).join("")}
          </div>
        </div>
      </div>`;
    $("#sair").onclick = () => { clearInterval(this.timer); go("home"); };
    v.querySelectorAll(".rel-op").forEach(b => b.onclick = () => this.responder(b.dataset.ok === "1"));
  }
  renderFim(v){
    const total = this.total, rec = this.recordes || {}, m = rushMin(this.dur);
    const vistos = new Set(), unicos = [];
    this.itens.forEach(x => { if(!vistos.has(x.id)){ vistos.add(x.id); unicos.push(x.id); } });
    const errouAlgumaVez = id => this.itens.some(x => x.id === id && !x.ok);
    const errados = unicos.filter(errouAlgumaVez);
    const linha = id => {
      const w = W[id];
      return `<div class="rel-l bad">
        <div class="rel-par"><b>${esc(w[2])}</b><i>${esc(w[1])}</i><span>${esc(cap(w[0]))}</span></div>
      </div>`;
    };
    const medalha = (cond, txt) => cond ? `<div class="rel-med">🏅 ${txt}</div>` : "";
    v.innerHTML = `
      <div class="sess">
        <div class="stage" style="align-items:stretch;text-align:left">
          <div class="rel-fim">
            <div class="rel-ic">🧠</div>
            <div class="rel-placarF">
              <div><b class="ok">${this.acertos}</b><span>acertos</span></div>
              <div><b class="bad">${this.erros}</b><span>erros</span></div>
              <div><b>${this.melhorSeq}</b><span>maior sequência</span></div>
              <div><b>${pct(this.acertos, total)}%</b><span>de acerto</span></div>
            </div>
            ${medalha(rec.acertos, `Novo recorde de acertos em ${m} min: ${this.acertos} (antes ${rec.antes ? rec.antes.acertos : 0})`)}
            ${medalha(rec.seq, `Novo recorde de sequência: ${this.melhorSeq} (antes ${rec.antes ? rec.antes.seq : 0})`)}
            ${total ? `<div class="mini" style="margin-top:2px">${total} ${plural(total, "pergunta", "perguntas")} em ${m} ${plural(m, "minuto", "minutos")}.</div>` : ""}
          </div>

          ${errados.length ? `<div class="rel-bloco">
            <div class="lbl" style="color:var(--ref)">Errou · ${errados.length}</div>
            ${errados.map(linha).join("")}
          </div>` : (total ? `<div class="rel-bloco"><div class="lbl" style="color:var(--solida)">Nenhum erro.</div></div>` : "")}

          <div class="acts">
            <button class="btn ghost" id="home">Voltar ao início</button>
            <button class="btn pri" id="dnv">Jogar de novo</button>
          </div>
        </div>
      </div>`;
    $("#home").onclick = () => go("home");
    $("#dnv").onclick = () => startRush(this.dur);
  }
  key(e){
    if(this.fase === "pronto" && (e.key === " " || e.key === "Enter")){ e.preventDefault(); this.comecar(); return; }
    if(this.fase !== "jogando") return;
    const b = document.querySelectorAll(".rel-op");
    if(e.key === "1" && b[0]) b[0].click();
    if(e.key === "2" && b[1]) b[1].click();
  }
}

/* ============================ MISSÃO DO DIA ============================ */
/* Cenários curtos de comunicação prática com o vocabulário que ele já
   estuda — pedir café, avisar atraso, contar o dia, etc. Pedido dele em
   16/10, junto com o Recall Rush. Conteúdo 100% pré-autorado (banco
   MISSOES, mesmo padrão de TXT_BANCO/ANT_BANCO/VERBOS — ver build.py):
   ZERO chamada de IA em tempo de uso. Cada missão tem um `id` de texto
   fixo (escolhido na autoria, nunca índice de array) e declara quais
   palavras do banco ela pratica (`palavras`, por texto — resolvido na hora
   por `ixW`, igual a tudo que já usa esse padrão no sistema).

   Nunca compete com a agenda formal: não entra em nextAction(), não altera
   meta diária nenhuma. `dias[].missao` é só um flag informativo (missão do
   dia feita ou não), igual ao padrão de `wr` (escrita). */
const MISSAO_FOLGA = 2;   // quantas palavras não estudadas uma missão pode exigir, se faltar opção melhor (decisão dele, 16/10: "afrouxar no início")

/* quais palavras da missão ele ainda não estuda */
function missaoCobertura(m){
  return (m.palavras || []).filter(t => {
    const i = ixW[String(t).toLowerCase()];
    return i === undefined || !isLearned(i);
  });
}
/* 1) tenta achar missão 100% com vocabulário já estudado; 2) se não achar,
   afrouxa até MISSAO_FOLGA palavras fora; 3) se ainda assim não achar (base
   muito nova), pega a(s) com menos lacuna — nunca bloqueia a feature nem
   gera palavra nova. Evita repetir a de ontem quando há alternativa. */
function missaoEscolher(evitarId){
  if(!MISSOES.length) return null;
  let pool = MISSOES.filter(m => missaoCobertura(m).length === 0);
  if(!pool.length) pool = MISSOES.filter(m => missaoCobertura(m).length <= MISSAO_FOLGA);
  if(!pool.length){
    let min = Infinity;
    MISSOES.forEach(m => { const n = missaoCobertura(m).length; if(n < min) min = n; });
    pool = MISSOES.filter(m => missaoCobertura(m).length === min);
  }
  let finalPool = pool.filter(m => m.id !== evitarId);
  if(!finalPool.length) finalPool = pool;     // só repete se não houver alternativa mesmo
  return finalPool[Math.floor(Math.random() * finalPool.length)];
}
/* a missão do dia é sorteada UMA VEZ por dia e fica estável — recarregar a
   página não troca nem perde o progresso em aberto.
   Importante: isso é chamado dentro do render() da Home, que roda ANTES do
   initSync() (ver boot()). Só persiste (save()) depois que o sync já tentou
   resolver contra o remoto (SYNC_PRONTO) — senão o S.ultimo = Date.now() do
   save() carimba um estado ainda não sincronizado como "mais novo" que o
   remoto de verdade, e o sync empurra esse estado por cima do progresso
   real (foi assim que o histórico de palavras foi apagado em 16/10). Sem
   SYNC_PRONTO, a missão escolhida fica só em memória até o próximo render
   (que já roda depois do initSync(), com o estado certo). */
function missaoHoje(){
  const k = dayKey();
  if(!S.missao.selecionado || S.missao.selecionado.dataChave !== k){
    const anteriorId = S.missao.selecionado ? S.missao.selecionado.id : null;
    const m = missaoEscolher(anteriorId);
    S.missao.selecionado = {id: m ? m.id : null, dataChave: k};
    S.missao.progresso = {passo:0, respostas:[], concluida:false};
    if(SYNC_PRONTO) save();
  }
  if(!S.missao.selecionado.id) return null;
  return MISSOES.find(m => m.id === S.missao.selecionado.id) || null;
}

function startMissao(){
  const m = missaoHoje();
  if(!m){ toast("Nenhuma missão disponível ainda."); return; }
  SESSION = new MissaoSession(m);
  render();
}

class MissaoSession{
  constructor(missao){
    this.missao = missao;
    const prog = S.missao.progresso;
    /* retoma a partir do primeiro passo ainda sem resposta — nunca sorteia
       missão nova, nunca perde o que já foi respondido */
    const temProgresso = prog && !prog.concluida && Array.isArray(prog.respostas) && prog.respostas.length > 0;
    this.respostas = temProgresso ? prog.respostas.slice() : [];
    this.i = Math.min(this.respostas.length, missao.passos.length - 1);
    this.fase = "intro";           // intro | passo | fim
    this.escolha = null;
    this.revelado = false;
    this.blocos = null; this.montada = []; this.confirmado = false;
  }
  get passo(){ return this.missao.passos[this.i]; }
  get total(){ return this.missao.passos.length; }

  iniciarPasso(){
    this.escolha = null; this.revelado = false; this.confirmado = false;
    const p = this.passo;
    if(p && p.tipo === "producaoB"){
      this.blocos = p.resposta.map((t, i) => ({t, i})).sort(() => Math.random() - .5);
      this.montada = [];
    }
  }
  comecar(){
    this.fase = "passo";
    this.iniciarPasso();
    this.render($("#view"));
  }
  salvarProgresso(){
    S.missao.progresso = {passo:this.i, respostas:this.respostas, concluida:false};
    save();
  }
  responderEscolha(idx){
    if(this.fase !== "passo" || this.revelado) return;
    const p = this.passo;
    const ok = !!p.opcoes[idx].ok;
    this.escolha = idx; this.revelado = true;
    vibrar(ok);
    this.respostas[this.i] = {ok};
    this.salvarProgresso();
    this.render($("#view"));
  }
  clicarBloco(i){
    if(this.fase !== "passo" || this.confirmado) return;
    if(this.montada.indexOf(i) < 0) this.montada.push(i);
    this.render($("#view"));
  }
  removerBloco(i){
    if(this.confirmado) return;
    const pos = this.montada.indexOf(i);
    if(pos >= 0) this.montada = this.montada.slice(0, pos);
    this.render($("#view"));
  }
  confirmarMontagem(){
    const p = this.passo;
    const ok = this.montada.length === p.resposta.length && this.montada.every((v, idx) => v === idx);
    this.confirmado = true;
    vibrar(ok);
    this.respostas[this.i] = {ok};
    this.salvarProgresso();
    this.render($("#view"));
  }
  proximo(){
    if(this.i < this.total - 1){
      this.i++;
      this.iniciarPasso();
      this.salvarProgresso();
      this.render($("#view"));
    } else {
      this.encerrar();
    }
  }
  encerrar(){
    this.fase = "fim";
    const acertos = this.respostas.filter(r => r && r.ok).length;
    S.missao.progresso = {passo:this.i, respostas:this.respostas, concluida:true};
    S.missao.historico.push({dataChave:dayKey(), id:this.missao.id, acertos, total:this.total});
    if(S.missao.historico.length > MISSAO_HIST) S.missao.historico = S.missao.historico.slice(-MISSAO_HIST);
    today().missao = true;
    save();
    this.render($("#view"));
  }

  /* ---- telas ---- */
  render(v){
    if(this.fase === "intro") return this.renderIntro(v);
    if(this.fase === "fim") return this.renderFim(v);
    return this.renderPasso(v);
  }
  renderIntro(v){
    const m = this.missao, falt = missaoCobertura(m);
    const retomar = this.respostas.length > 0;
    v.innerHTML = `
      <div class="sess">
        <div class="sbar"><button class="btn sm ghost" id="sair">Sair</button><div class="mini">Missão do Dia</div></div>
        <div class="stage">
          <div class="rel-ic">🎯</div>
          <div style="font-size:22px;font-weight:700;letter-spacing:-.03em;text-align:center">${esc(m.titulo)}</div>
          <div class="muted" style="max-width:48ch;font-size:14.5px;line-height:1.55;text-align:center">${esc(m.cenario)}</div>
          <div class="mini" style="max-width:48ch;text-align:center"><b>Objetivo:</b> ${esc(m.objetivo)}</div>
          ${falt.length ? `<div class="mini" style="max-width:48ch;text-align:center">Tem ${falt.length} ${plural(falt.length,"palavra","palavras")} aqui que você ainda não estudou — sem problema, vai ter ajuda na hora.</div>` : ""}
          <div class="acts"><button class="btn pri lg" id="vai">${retomar ? "Continuar de onde parou" : "Começar"}</button></div>
        </div>
      </div>`;
    $("#sair").onclick = () => go("home");
    $("#vai").onclick = () => this.comecar();
  }
  renderPasso(v){
    const p = this.passo;
    const corpo = p.tipo === "producaoB" ? this.corpoProducaoB(p) : this.corpoEscolha(p);
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="bar"><i style="width:${pct(this.i, this.total)}%"></i></div>
          <div class="mini">${this.i + 1} / ${this.total}</div>
        </div>
        <div class="stage" style="align-items:stretch;text-align:left">
          ${corpo}
        </div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair da missão? O que já foi feito está salvo.")) go("home"); };
    this.ligarEventosPasso(v, p);
  }
  corpoEscolha(p){
    const compreensao = p.tipo === "compreensao";
    return `
      <div class="step">${compreensao ? "Compreensão" : "Sua resposta"}</div>
      ${compreensao ? `
        ${p.falante ? `<div class="mini">${esc(p.falante)}</div>` : ""}
        <div style="font-size:19px;font-weight:600;line-height:1.4;margin:4px 0">${esc(p.en)}</div>
        <div class="muted" style="font-size:14.5px">${esc(p.pergunta)}</div>
      ` : `<div class="muted" style="font-size:14.5px">${esc(p.contexto)}</div>`}
      <div class="rel-ops" style="max-width:none;margin-top:10px">
        ${p.opcoes.map((o, i) => {
          let estilo = "";
          if(this.revelado){
            if(o.ok) estilo = "border-color:var(--solida);color:var(--solida)";
            else if(i === this.escolha) estilo = "border-color:var(--ref);color:var(--ref)";
          }
          return `<button class="rel-op" data-i="${i}" style="${estilo}" ${this.revelado ? "disabled" : ""}>${esc(o.t)}</button>`;
        }).join("")}
      </div>
      ${this.revelado ? (() => {
        const o = p.opcoes[this.escolha];
        const explic = compreensao ? p.explicacao : (o.ok ? null : o.explicacao);
        return `
          <div class="pron" style="margin-top:10px;font-size:19px">${esc(p.significado)}</div>
          ${explic ? `<div class="mini" style="margin-top:4px">${esc(explic)}</div>` : ""}
          <div class="acts"><button class="btn pri lg" id="continuar">${this.i < this.total - 1 ? "Continuar" : "Ver resultado"}</button></div>
        `;
      })() : ""}
    `;
  }
  corpoProducaoB(p){
    const feito = this.confirmado;
    const certo = feito && this.montada.length === p.resposta.length && this.montada.every((v, i) => v === i);
    return `
      <div class="step">Monte a frase</div>
      <div class="muted" style="font-size:14.5px">${esc(p.contexto)}</div>
      <div class="row" style="flex-wrap:wrap;gap:6px;min-height:42px;border-bottom:1px dashed var(--line);padding:10px 0;margin-top:8px">
        ${this.montada.length
          ? this.montada.map(i => `<button class="btn sm pri" data-montado="${i}" ${feito ? "disabled" : ""}>${esc(p.resposta[i])}</button>`).join("")
          : `<span class="mini">toque nos blocos abaixo, na ordem certa</span>`}
      </div>
      <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">
        ${this.blocos.filter(b => this.montada.indexOf(b.i) < 0).map(b => `<button class="btn sm ghost" data-bloco="${b.i}" ${feito ? "disabled" : ""}>${esc(b.t)}</button>`).join("")}
      </div>
      ${!feito ? `
        <div class="acts">
          <button class="btn ghost" id="limpar" ${this.montada.length ? "" : "disabled"}>Limpar</button>
          <button class="btn pri" id="confirmar" ${this.montada.length === p.resposta.length ? "" : "disabled"}>Confirmar</button>
        </div>
      ` : `
        ${!certo ? `<div class="mini" style="margin-top:8px">Ordem certa: <b>${esc(p.resposta.join(" "))}</b></div>` : ""}
        <div class="pron" style="margin-top:8px;font-size:19px">${esc(p.significado)}</div>
        <div class="acts"><button class="btn pri lg" id="continuar">${this.i < this.total - 1 ? "Continuar" : "Ver resultado"}</button></div>
      `}
    `;
  }
  ligarEventosPasso(v, p){
    if(p.tipo === "producaoB"){
      v.querySelectorAll("[data-bloco]").forEach(b => b.onclick = () => this.clicarBloco(+b.dataset.bloco));
      v.querySelectorAll("[data-montado]").forEach(b => b.onclick = () => this.removerBloco(+b.dataset.montado));
      if($("#limpar")) $("#limpar").onclick = () => { this.montada = []; this.render($("#view")); };
      if($("#confirmar")) $("#confirmar").onclick = () => this.confirmarMontagem();
      if($("#continuar")) $("#continuar").onclick = () => this.proximo();
    } else {
      v.querySelectorAll(".rel-op").forEach(b => b.onclick = () => this.responderEscolha(+b.dataset.i));
      if($("#continuar")) $("#continuar").onclick = () => this.proximo();
    }
  }
  renderFim(v){
    const acertos = this.respostas.filter(r => r && r.ok).length, total = this.total;
    const rec = this.missao.recompensa || {pontos:10, texto:"Missão concluída!"};
    const palavras = this.missao.palavras || [];
    v.innerHTML = `
      <div class="sess">
        <div class="stage">
          <div class="rel-ic">🏁</div>
          <div style="font-size:24px;font-weight:700;letter-spacing:-.03em;text-align:center">${esc(rec.texto || "Missão concluída!")}</div>
          <div class="rel-placarF">
            <div><b class="ok">${acertos}</b><span>certas</span></div>
            <div><b>${total}</b><span>passos</span></div>

          <div class="acts"><button class="btn ghost" id="home">Voltar ao início</button></div>
        </div>
      </div>`;
    $("#home").onclick = () => go("home");
  }
  key(e){
    if(this.fase === "intro" && (e.key === " " || e.key === "Enter")){ e.preventDefault(); this.comecar(); return; }
    if(this.fase === "passo" && this.revelado && e.key === "Enter"){ const c = $("#continuar"); if(c) c.click(); }
