/* ============================ ACADEMIA DE INGLÊS ============================ */
/* Área nova (17/10) com 5 modos de prática complementares ao que já existe
   (Missão do Dia, Blocos, Leitura) — o que falta de verdade não é
   reconhecer, é produzir. Mesmas regras de sempre: zero IA em tempo de
   uso (bancos prontos, ver build.py/LAB/DETECTIVE/MEANING/STORIES/
   SURVIVAL), zero áudio, progresso isolado (S.lab/S.det/S.msw/S.story/
   S.surv — nunca leem/escrevem S.w/S.c/S.r/S.missao), fora de
   nextAction()/dayFull()/dayMin() — como a Missão do Dia, são treino
   complementar, nunca competem com a agenda formal. */

/* ---- toque-pra-montar: mesma mecânica da Missão do Dia (produção B),
   reaproveitada em vez de reescrita em Frase Lab, Story Rebuild e Survival
   Choices. `pool` é a lista de blocos já embaralhada pelo chamador;
   `estado` é {montada:[], confirmado:bool} guardado pela sessão. Valida
   por TEXTO (não por índice) porque aqui, diferente da Missão do Dia, o
   pool pode ter palavras-isca fora da ordem/índice da resposta certa. */
function tapHtml(pool, estado, feito, opc){
  opc = opc || {};
  return `
    <div class="row" style="flex-wrap:wrap;gap:6px;min-height:42px;border-bottom:1px dashed var(--line);padding:10px 0;margin-top:8px">
      ${estado.montada.length
        ? estado.montada.map((i,k) => `<button class="btn sm pri" data-montado="${i}" ${feito ? "disabled" : ""}>${opc.numerar ? `<span class="tap-n">${k+1}</span>` : ""}${esc(pool[i])}</button>`).join("")
        : `<span class="mini">${esc(opc.dica || "toque nos blocos abaixo, na ordem certa")}</span>`}
    </div>
    <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">
      ${pool.map((t,i) => estado.montada.indexOf(i) < 0 ? `<button class="btn sm ghost" data-bloco="${i}" ${feito ? "disabled" : ""}>${esc(t)}</button>` : "").join("")}
    </div>`;
}
function tapEventos(v, estado, onChange){
  v.querySelectorAll("[data-bloco]").forEach(b => b.onclick = () => { estado.montada.push(+b.dataset.bloco); onChange(); });
  v.querySelectorAll("[data-montado]").forEach(b => b.onclick = () => {
    const pos = estado.montada.indexOf(+b.dataset.montado);
    if(pos >= 0) estado.montada = estado.montada.slice(0, pos);
    onChange();
  });
}
function embaralha(arr){ return arr.map(v => [v, Math.random()]).sort((a,b) => a[1]-b[1]).map(x => x[0]); }
function semRepetirRecentes(lista, idsRecentes, n){
  let pool = lista.filter(x => (idsRecentes||[]).indexOf(x.id) < 0);
  if(pool.length < n) pool = lista.slice();
  return embaralha(pool).slice(0, n);
}
function academiaItem(campo, id){
  const st = S[campo];
  if(!st.itens[id]) st.itens[id] = {};
  return st.itens[id];
}

/* ---------------------------- FRASE LAB ---------------------------- */
/* Monta frase em inglês a partir de peças — banco 100% vindo de Blocos/
   Reduções já existentes (frase fixa, uma ordem certa só, nenhuma frase
   nova inventada). 3 níveis por frase, guardados por item em S.lab:
   1 reconhecer (múltipla escolha) → 2 completar com pista (monta com
   tradução visível, sem isca) → 3 montar sem pista (com palavras-isca,
   tradução só aparece se pedir "Ver tradução" — contaria como ajuda). */
const LAB_RODADA = 8;
function labNivel(id){ const it = S.lab.itens[id]; return (it && it.nivel) || 1; }
function labDistratoras(item, n){
  const outras = LAB.filter(x => x.id !== item.id).map(x => x.frase);
  return embaralha(outras).slice(0, n);
}
class LabSession{
  constructor(){
    this.itens = semRepetirRecentes(LAB, (S.lab.hist[S.lab.hist.length-1]||{}).ids, LAB_RODADA);
    this.i = 0; this.acertos = 0; this.fim = false;
    this.iniciarItem();
  }
  get item(){ return this.itens[this.i]; }
  get total(){ return this.itens.length; }
  iniciarItem(){
    this.nivel = labNivel(this.item.id);
    this.revelado = false; this.certo = null; this.escolhaIdx = null; this.usouDica = false;
    if(this.nivel === 1){
      this.opcoes = embaralha([this.item.frase, ...labDistratoras(this.item, 3)]);   // 4 alternativas (pedido dele, 17/10)
    } else {
      this.pool = this.nivel === 3 ? embaralha(this.item.blocos.concat(this.item.decoys||[])) : embaralha(this.item.blocos.slice());
      this.estado = {montada:[], confirmado:false};
    }
  }
  responderNivel1(idx){
    if(this.revelado) return;
    this.escolhaIdx = idx; this.revelado = true;
    this.certo = (this.opcoes[idx] === this.item.frase);
    this.registrar(this.certo, false);
    vibrar(this.certo);
    this.render($("#view"));
  }
  verDica(){ this.usouDica = true; this.render($("#view")); }
  confirmarMontagem(){
    const resp = this.item.blocos;
    const certo = this.estado.montada.length === resp.length &&
      this.estado.montada.every((v,i) => this.pool[v] === resp[i]);
    this.estado.confirmado = true; this.certo = certo; this.revelado = true;
    this.registrar(certo, this.usouDica);
    vibrar(certo);
    this.render($("#view"));
  }
  registrar(certo, comDica){
    if(certo) this.acertos++;
    const it = academiaItem("lab", this.item.id);
    if(certo && !comDica) it.nivel = Math.min(3, (it.nivel||1) + 1);
    it.ultimaVez = Date.now();
    save();
  }
  proximo(){
    if(this.i < this.total-1){ this.i++; this.iniciarItem(); this.render($("#view")); }
    else this.encerrar();
  }
  encerrar(){
    this.fim = true;
    S.lab.hist.push({t:Date.now(), ids:this.itens.map(x=>x.id), acertos:this.acertos, total:this.total});
    save();
    this.render($("#view"));
  }
  render(v){
    if(this.fim) return this.renderFim(v);
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="bar"><i style="width:${pct(this.i,this.total)}%"></i></div>
          <div class="mini">${this.i+1} / ${this.total} · nível ${this.nivel}</div>
        </div>
        <div class="stage" style="align-items:stretch;text-align:left">${this.nivel===1 ? this.corpoNivel1() : this.corpoMontagem()}</div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair do Frase Lab? O nível de cada frase já fica salvo.")) go("academia"); };
    this.ligarEventos(v);
  }
  corpoNivel1(){
    return `
      <div class="step">🧩 Nível 1 · Reconhecer</div>
      <div class="muted" style="font-size:14.5px">Qual destas frases significa:</div>
      <div style="font-size:19px;font-weight:600;margin:4px 0">${esc(this.item.pt)}</div>
      <div class="rel-ops" style="max-width:none;margin-top:10px">
        ${this.opcoes.map((t,i) => {
          let estilo = "";
          if(this.revelado){
            if(t === this.item.frase) estilo = "border-color:var(--solida);color:var(--solida)";
            else if(i === this.escolhaIdx) estilo = "border-color:var(--ref);color:var(--ref)";
          }
          return `<button class="rel-op" data-i="${i}" style="${estilo}" ${this.revelado?"disabled":""}>${esc(t)}</button>`;
        }).join("")}
      </div>
      ${this.revelado ? `<div class="acts"><button class="btn pri lg" id="continuar">${this.i<this.total-1?"Continuar":"Ver resultado"}</button></div>` : ""}
    `;
  }
  corpoMontagem(){
    const feito = this.estado.confirmado;
    return `
      <div class="step">🧩 Nível ${this.nivel} · ${this.nivel===2?"Completar com pista":"Montar sem pista"}</div>
      ${this.nivel===2 || this.usouDica ? `<div class="muted" style="font-size:14.5px">${esc(this.item.pt)}</div>` : `<div class="muted" style="font-size:14.5px">Monte a frase.</div>`}
      ${tapHtml(this.pool, this.estado, feito)}
      ${!feito ? `
        <div class="acts">
          <button class="btn ghost" id="limpar" ${this.estado.montada.length?"":"disabled"}>Limpar</button>
          ${this.nivel===3 && !this.usouDica ? `<button class="btn ghost" id="dica">Ver tradução</button>` : ""}
          <button class="btn pri" id="confirmar" ${this.estado.montada.length===this.item.blocos.length?"":"disabled"}>Confirmar</button>
        </div>
      ` : `
        ${!this.certo ? `<div class="mini" style="margin-top:8px">Frase certa: <b>${esc(this.item.frase)}</b></div>` : ""}
        <div class="pron" style="margin-top:8px;font-size:19px">${esc(this.item.pt)}</div>
        <div class="acts"><button class="btn pri lg" id="continuar">${this.i<this.total-1?"Continuar":"Ver resultado"}</button></div>
      `}
    `;
  }
  ligarEventos(v){
    if(this.nivel===1){
      v.querySelectorAll("[data-i]").forEach(b => b.onclick = () => this.responderNivel1(+b.dataset.i));
    } else {
      tapEventos(v, this.estado, () => this.render($("#view")));
      if($("#limpar")) $("#limpar").onclick = () => { this.estado.montada=[]; this.render($("#view")); };
      if($("#dica")) $("#dica").onclick = () => this.verDica();
      if($("#confirmar")) $("#confirmar").onclick = () => this.confirmarMontagem();
    }
    if($("#continuar")) $("#continuar").onclick = () => this.proximo();
  }
  renderFim(v){
    v.innerHTML = `
      <div class="sess"><div class="stage">
        <div class="rel-ic">🧩</div>
        <div style="font-size:24px;font-weight:700;text-align:center">Rodada concluída!</div>
        <div class="rel-placarF">
          <div><b class="ok">${this.acertos}</b><span>certas</span></div>
          <div><b>${this.total}</b><span>frases</span></div>
          <div><b>${pct(this.acertos,this.total)}%</b><span>acerto</span></div>
        </div>
        <div class="acts"><button class="btn ghost" id="home">Voltar à Academia</button></div>
      </div></div>`;
    $("#home").onclick = () => go("academia");
  }
  key(e){ if(e.key==="Enter" && this.revelado){ const c=$("#continuar"); if(c) c.click(); } }
}

/* ---------------------------- ENGLISH DETECTIVE ---------------------------- */
/* Frase com erro comum → investigar, corrigir, entender o padrão. 3
   formatos de tarefa alternados (ver data/detective.json): escolher a
   frase certa, apontar a parte errada, ou montar a correção com blocos. */
const DET_RODADA = 8;
class DetectiveSession{
  constructor(){
    this.itens = semRepetirRecentes(DETECTIVE, (S.det.hist[S.det.hist.length-1]||{}).ids, DET_RODADA);
    this.i = 0; this.acertos = 0; this.fim = false;
    this.iniciarCaso();
  }
  get caso(){ return this.itens[this.i]; }
  get total(){ return this.itens.length; }
  iniciarCaso(){
    this.revelado = false; this.certo = null; this.escolhaIdx = null; this.tokenEscolhido = null;
    if(this.caso.tarefa === "montar_corrigida"){
      this.pool = embaralha(this.caso.resposta.slice());
      this.estado = {montada:[], confirmado:false};
    }
  }
  responderEscolher(idx){
    if(this.revelado) return;
    this.escolhaIdx = idx; this.revelado = true;
    this.certo = !!this.caso.opcoes[idx].ok;
    this.registrar(this.certo);
    vibrar(this.certo);
    this.render($("#view"));
  }
  responderToken(idx){
    if(this.revelado) return;
    this.tokenEscolhido = idx; this.revelado = true;
    this.certo = (idx === this.caso.indice_erro);
    this.registrar(this.certo);
    vibrar(this.certo);
    this.render($("#view"));
  }
  confirmarMontagem(){
    const resp = this.caso.resposta;
    const certo = this.estado.montada.length === resp.length &&
      this.estado.montada.every((v,i) => this.pool[v] === resp[i]);
    this.estado.confirmado = true; this.certo = certo; this.revelado = true;
    this.registrar(certo);
    vibrar(certo);
    this.render($("#view"));
  }
  registrar(certo){
    if(certo) this.acertos++;
    const it = academiaItem("det", this.caso.id);
    it.acertos = (it.acertos||0) + (certo?1:0);
    it.erros = (it.erros||0) + (certo?0:1);
    it.ultimaVez = Date.now();
    save();
  }
  proximo(){
    if(this.i < this.total-1){ this.i++; this.iniciarCaso(); this.render($("#view")); }
    else this.encerrar();
  }
  encerrar(){
    this.fim = true;
    S.det.hist.push({t:Date.now(), ids:this.itens.map(x=>x.id), acertos:this.acertos, total:this.total});

  feedback(){

    const extra = (!this.certo && c.tarefa==="escolher_certa" && this.escolhaIdx!=null && c.opcoes[this.escolhaIdx].explicacao_erro)
      ? `<div class="mini" style="margin-top:4px;color:var(--ref)">${esc(c.opcoes[this.escolhaIdx].explicacao_erro)}</div>` : "";
    return `
      <div class="pron" style="margin-top:8px;font-size:17px">${this.certo?"✅":"❌"} ${esc(c.frase_certa)}</div>
      ${extra}
      <div class="mini" style="margin-top:4px">${esc(c.explicacao)}</div>
      <div class="acts"><button class="btn pri lg" id="continuar">${this.i<this.total-1?"Continuar":"Ver resultado"}</button></div>
    `;
  }
  corpo(){
    const c = this.caso;
    const titulo = `<div class="step">🔍 ${esc(c.titulo)}</div>`;
    if(c.tarefa === "escolher_certa"){
      return `${titulo}
        <div class="muted" style="font-size:14.5px">Qual destas frases está certa?</div>
        <div class="rel-ops" style="max-width:none;margin-top:10px">
          ${c.opcoes.map((o,i) => {
            let estilo = "";
            if(this.revelado){
              if(o.ok) estilo = "border-color:var(--solida);color:var(--solida)";
              else if(i===this.escolhaIdx) estilo = "border-color:var(--ref);color:var(--ref)";
            }
            return `<button class="rel-op" data-i="${i}" style="${estilo}" ${this.revelado?"disabled":""}>${esc(o.t)}</button>`;
          }).join("")}
        </div>
        ${this.revelado ? this.feedback() : ""}`;
    }
    if(c.tarefa === "selecionar_parte"){
      return `${titulo}
        <div class="muted" style="font-size:14.5px">Frase com erro — toque na palavra errada:</div>
        <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">
          ${c.tokens.map((t,i) => {
            let estilo = "";
            if(this.revelado){
              if(i===c.indice_erro) estilo = "border-color:var(--solida);color:var(--solida)";
              else if(i===this.tokenEscolhido) estilo = "border-color:var(--ref);color:var(--ref)";
            }
            return `<button class="btn sm ghost" data-tok="${i}" style="${estilo}" ${this.revelado?"disabled":""}>${esc(t)}</button>`;
          }).join("")}
        </div>
        ${this.revelado ? this.feedback() : ""}`;
    }

      ${tapHtml(this.pool, this.estado, feito)}
      ${!feito ? `
        <div class="acts">
          <button class="btn ghost" id="limpar" ${this.estado.montada.length?"":"disabled"}>Limpar</button>
          <button class="btn pri" id="confirmar" ${this.estado.montada.length===c.resposta.length?"":"disabled"}>Confirmar</button>

  ligarEventos(v){

      tapEventos(v, this.estado, () => this.render($("#view")));
      if($("#limpar")) $("#limpar").onclick = () => { this.estado.montada=[]; this.render($("#view")); };
      if($("#confirmar")) $("#confirmar").onclick = () => this.confirmarMontagem();
    }
    if($("#continuar")) $("#continuar").onclick = () => this.proximo();
  }
  renderFim(v){
    v.innerHTML = `
      <div class="sess"><div class="stage">
        <div class="rel-ic">🕵️</div>
        <div style="font-size:24px;font-weight:700;text-align:center">Casos resolvidos!</div>
        <div class="rel-placarF">
          <div><b class="ok">${this.acertos}</b><span>certos</span></div>
          <div><b>${this.total}</b><span>casos</span></div>
          <div><b>${pct(this.acertos,this.total)}%</b><span>acerto</span></div>
        </div>
        <div class="acts"><button class="btn ghost" id="home">Voltar à Academia</button></div>
      </div></div>`;
    $("#home").onclick = () => go("academia");
  }
  key(e){ if(e.key==="Enter" && this.revelado){ const c=$("#continuar"); if(c) c.click(); } }
}

            }).join("")}
          </div>

        </div>
        <div class="acts"><button class="btn ghost" id="home">Voltar à Academia</button></div>
      </div></div>`;

/* ---------------------------- STORY REBUILD ---------------------------- */
/* Reconstruir ativamente uma história curta (reordenar cenas por toque),
   diferente da Leitura (onde ele só lê um texto pronto). Só texto nesta
   primeira versão — sem ilustração. Histórias com `img` em todas as cenas usam
   o carrossel de imagens (fixo, na ordem certa) e só as frases são reordenadas. */
const STORY_LOOKBACK = 2;
function storyEscolher(){
  const idsRecentes = S.story.hist.slice(-STORY_LOOKBACK).map(h => h.id);
  let pool = STORIES.filter(s => idsRecentes.indexOf(s.id) < 0);
  if(!pool.length) pool = STORIES;
  // histórias ilustradas (cada cena com `img`) aparecem com prioridade: é a versão nova
  const ilust = pool.filter(storyTemImagens);
  if(ilust.length && Math.random() < 0.8) pool = ilust;
  return pool[Math.floor(Math.random()*pool.length)];
}
function storyTemImagens(st){ return !!(st && st.cenas && st.cenas.length && st.cenas.every(c => c.img)); }
class StoryRebuildSession{
  constructor(){
    this.story = storyEscolher();
    this.pool = embaralha(this.story.cenas.map(c => c.en));
    this.estado = {montada:[], confirmado:false};
    this.fase = "jogo";
  }
  confirmar(){
    const resp = this.story.cenas.map(c => c.en);
    const certo = this.estado.montada.length === resp.length &&
      this.estado.montada.every((v,i) => this.pool[v] === resp[i]);
    this.estado.confirmado = true; this.certo = certo;
    this._aposConfirmar = true;
    this.acertosPorCena = resp.map((t,i) => this.pool[this.estado.montada[i]] === t);
    const it = academiaItem("story", this.story.id);
    it.concluida = true;
    it.acertouDePrimeira = it.acertouDePrimeira || certo;
    it.ultimaVez = Date.now();
    S.story.hist.push({t:Date.now(), id:this.story.id, certo});
    save();
    vibrar(certo);
    this.render($("#view"));
  }
  get ilustrada(){ return storyTemImagens(this.story); }
  /* Com imagens: o carrossel (fixo, na ordem certa) é montado uma vez e só o
     corpo de baixo é redesenhado — assim o carrossel não volta pro início a
     cada toque, e consegue deslizar sozinho para a próxima cena. */
  render(v){
    if(this.fase === "fim") return this.renderFim(v);
    if(!this.ilustrada) return this.renderTexto(v);
    const feito = this.estado.confirmado, n = this.story.cenas.length;
    if(!this._montado || !v.querySelector("#srCar")){
      this._montado = true;
      this.slide = 0;
      v.innerHTML = `
        <div class="sess" style="max-width:720px">
          <div class="sbar"><button class="btn sm ghost" id="sair">Sair</button><div class="mini">Story Rebuild</div></div>
          <div class="card" style="padding:22px 22px 24px">
            <div class="step">📖 ${esc(this.story.titulo)}</div>
            <div class="mini" style="margin:6px 0 12px">As imagens já estão na ordem. Toque nas frases na mesma ordem das cenas.</div>
            <div class="sr-car" id="srCar">
              <div class="sr-track" id="srTrack">
                ${this.story.cenas.map((c,i) => `<div class="sr-slide" data-cena="${i}">${c.img}<span class="sr-num">${i+1} / ${n}</span><div id="srCap${i}"></div></div>`).join("")}
              </div>
              <button class="sr-nav p" id="srPrev" aria-label="Cena anterior">‹</button>
              <button class="sr-nav n" id="srNext" aria-label="Próxima cena">›</button>
            </div>
            <div class="sr-dots" id="srDots">${this.story.cenas.map((c,i) => `<button class="sr-dot" data-dot="${i}" aria-label="Cena ${i+1}"></button>`).join("")}</div>
            <div id="srBody"></div>
          </div>
        </div>`;
      $("#sair").onclick = async () => { if(await confirmar("Sair do Story Rebuild?")) go("academia"); };
      const tr = $("#srTrack");
      let raf = 0;
      tr.addEventListener("scroll", () => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          const w = tr.firstElementChild.getBoundingClientRect().width + 10;
          const i = Math.max(0, Math.min(n-1, Math.round(tr.scrollLeft / w)));
          if(i !== this.slide){ this.slide = i; this.marcaCarrossel(); }
        });
      }, {passive:true});
      $("#srPrev").onclick = () => this.irCena(this.slide-1);
      $("#srNext").onclick = () => this.irCena(this.slide+1);
      v.querySelectorAll("[data-dot]").forEach(d => d.onclick = () => this.irCena(+d.dataset.dot));
    }
    this.corpoIlustrado(v);
    // cena-alvo: a próxima vaga a preencher (ou a primeira, ao conferir)
    if(!feito) this.irCena(Math.min(this.estado.montada.length, n-1));
    else {
      // acabou de confirmar: leva o aluno à primeira cena fora do lugar (ou à 1ª, se acertou tudo)
      if(this._aposConfirmar){
        this._aposConfirmar = false;
        const e = (this.acertosPorCena || []).indexOf(false);
        this.irCena(e >= 0 ? e : 0);
      } else this.marcaCarrossel();
    }
  }
  irCena(i){
    const n = this.story.cenas.length;
    i = Math.max(0, Math.min(n-1, i));
    this.slide = i;
    const tr = $("#srTrack"); if(!tr) return;
    const w = tr.firstElementChild.getBoundingClientRect().width + 10;
    tr.scrollTo({left: i*w, behavior: "smooth"});
    this.marcaCarrossel();
  }
  marcaCarrossel(){
    const n = this.story.cenas.length, feito = this.estado.confirmado;
    document.querySelectorAll("#srDots [data-dot]").forEach(d => {
      const i = +d.dataset.dot;
      d.className = "sr-dot" + (i === this.slide ? " on" : "")
        + (feito ? (this.acertosPorCena && this.acertosPorCena[i] ? " ok" : " erro") : (i < this.estado.montada.length ? " preenchido" : ""));
    });
    const p = $("#srPrev"), q = $("#srNext");
    if(p) p.disabled = this.slide <= 0;
    if(q) q.disabled = this.slide >= n-1;
  }
  corpoIlustrado(v){
    const feito = this.estado.confirmado, cenas = this.story.cenas;
    if(feito){
      // legenda certa sobre cada imagem; as que o aluno errou ficam avermelhadas
      cenas.forEach((c,i) => { const el = $("#srCap"+i); if(el) el.innerHTML = `<div class="sr-cap${this.acertosPorCena[i] ? "" : " ruim"}">${esc(c.en)}</div>`; });
    }
    $("#srBody").innerHTML = `
      ${tapHtml(this.pool, this.estado, feito, {numerar:true, dica:"toque nas frases abaixo, na ordem das imagens"})}
      ${!feito ? `
        <div class="acts">
          <button class="btn ghost" id="limpar" ${this.estado.montada.length?"":"disabled"}>Limpar</button>
          <button class="btn pri" id="confirmar" ${this.estado.montada.length===this.pool.length?"":"disabled"}>Confirmar</button>
        </div>` : `
        <div class="mini" style="margin-top:12px">${this.certo ? "Tudo na ordem certa. Cada legenda está sobre a sua imagem." : "Em vermelho: cenas fora do lugar. A frase certa de cada imagem está sobre ela."}</div>
        <div class="pav" style="margin-top:12px;font-size:17px;line-height:1.5">${esc(this.story.resumo_pt)}</div>
        <div class="acts" style="margin-top:14px"><button class="btn pri lg" id="continuar">Ver resultado</button></div>
      `}`;
    tapEventos(v, this.estado, () => this.render($("#view")));
    if($("#limpar")) $("#limpar").onclick = () => { this.estado.montada=[]; this.render($("#view")); };
    if($("#confirmar")) $("#confirmar").onclick = () => this.confirmar();
    if($("#continuar")) $("#continuar").onclick = () => { this.fase="fim"; this.render($("#view")); };
    this.marcaCarrossel();
  }
  renderTexto(v){
    const feito = this.estado.confirmado;
    v.innerHTML = `
      <div class="sess" style="max-width:720px">
        <div class="sbar"><button class="btn sm ghost" id="sair">Sair</button><div class="mini">Story Rebuild</div></div>
        <div class="card" style="padding:26px 24px">
          <div class="step">📖 ${esc(this.story.titulo)}</div>
          <div class="mini" style="margin:6px 0 14px">Reconstrua a história na ordem certa.</div>
          ${tapHtml(this.pool, this.estado, feito)}
          ${!feito ? `
            <div class="acts">
              <button class="btn ghost" id="limpar" ${this.estado.montada.length?"":"disabled"}>Limpar</button>
              <button class="btn pri" id="confirmar" ${this.estado.montada.length===this.pool.length?"":"disabled"}>Confirmar</button>
            </div>` : `
            ${!this.certo ? `<div class="mini" style="margin-top:10px">Ordem certa:</div>
              <div class="leitura" style="margin-top:6px">${this.story.cenas.map(c=>`<div class="lt-en">${esc(c.en)}</div>`).join("")}</div>` : ""}
            <div class="pav" style="margin-top:12px">${esc(this.story.resumo_pt)}</div>
            <div class="acts" style="margin-top:14px"><button class="btn pri lg" id="continuar">Ver resultado</button></div>
          `}
        </div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair do Story Rebuild?")) go("academia"); };
    tapEventos(v, this.estado, () => this.render($("#view")));
    if($("#limpar")) $("#limpar").onclick = () => { this.estado.montada=[]; this.render($("#view")); };
    if($("#confirmar")) $("#confirmar").onclick = () => this.confirmar();
    if($("#continuar")) $("#continuar").onclick = () => { this.fase="fim"; this.render($("#view")); };
  }
  renderFim(v){
    v.innerHTML = `
      <div class="sess"><div class="stage">
        <div class="rel-ic fim-festa">${this.certo ? "🏆" : "📖"}</div>
        <div style="font-size:24px;font-weight:700;text-align:center">${this.certo ? "História remontada!" : "Quase lá!"}</div>
        <div class="mini" style="text-align:center;max-width:48ch">${esc(this.story.resumo_pt)}</div>
        <div class="acts"><button class="btn ghost" id="home">Voltar à Academia</button></div>
      </div></div>`;
    $("#home").onclick = () => go("academia");
  }
  key(){}
}

/* ---------------------------- SURVIVAL CHOICES ---------------------------- */
/* Diferente da Missão do Dia: aqui a escolha muda o caminho de verdade —
   `passos` é um grafo (objeto, não array linear), cada passo tipo
   "intencao" pode levar a um `proximo` diferente por opção. Progresso em
   aberto sobrevive a reload (mesmo padrão de S.missao.progresso). */
function survEscolher(){
  const feitas = Object.keys(S.surv.itens).filter(id => S.surv.itens[id].concluida);
  let pool = SURVIVAL.filter(m => feitas.indexOf(m.id) < 0);
  if(!pool.length) pool = SURVIVAL;
  return pool[Math.floor(Math.random()*pool.length)];
}
function survPorId(id){ return SURVIVAL.find(m => m.id === id) || null; }
class SurvivalSession{
  constructor(missao){
    this.missao = missao;
    const it = academiaItem("surv", missao.id);
    const aberto = it.progressoAberto;
    this.passoId = (aberto && aberto.missaoId === missao.id) ? aberto.passoId : missao.passoInicial;
    this.caminho = (aberto && aberto.missaoId === missao.id) ? aberto.caminho.slice() : [];
    this.fase = "intro";
    this.revelado = false; this.escolhaIdx = null;
  }
  get passo(){ return this.missao.passos[this.passoId]; }
  comecar(){ this.fase = "passo"; this.iniciarPasso(); this.render($("#view")); }
  iniciarPasso(){
    this.revelado = false; this.escolhaIdx = null;
    const p = this.passo;
    if(p.tipo === "producaoB"){
      this.pool = embaralha(p.resposta.slice());
      this.estado = {montada:[], confirmado:false};
    }
  }
  salvarProgresso(){
    const it = academiaItem("surv", this.missao.id);
    it.progressoAberto = {missaoId:this.missao.id, passoId:this.passoId, caminho:this.caminho};
    save();
  }
  irPara(proximo){
    this.caminho.push(this.passoId);
    this.passoId = proximo;
    this.iniciarPasso();
    if(this.passo.tipo === "fim") this.encerrar();
    else { this.salvarProgresso(); this.render($("#view")); }
  }
  responderOpcao(idx){
    if(this.revelado) return;
    this.escolhaIdx = idx; this.revelado = true;
    vibrar(!!this.passo.opcoes[idx].ok);
    this.render($("#view"));
  }
  confirmarMontagem(){
    const resp = this.passo.resposta;
    const certo = this.estado.montada.length === resp.length &&
      this.estado.montada.every((v,i) => this.pool[v] === resp[i]);
    this.estado.confirmado = true; this.certoMontagem = certo;
    vibrar(certo);
    this.render($("#view"));
  }
  encerrar(){
    this.fase = "fim";
    const it = academiaItem("surv", this.missao.id);
    it.concluida = true; it.progressoAberto = null;
    it.fins = it.fins || [];
    if(it.fins.indexOf(this.passoId) < 0) it.fins.push(this.passoId);
    it.ultimaVez = Date.now();
    S.surv.hist.push({t:Date.now(), id:this.missao.id, fim:this.passoId});
    save();
    this.render($("#view"));
  }
  render(v){
    if(this.fase === "intro") return this.renderIntro(v);
    if(this.fase === "fim") return this.renderFim(v);
    return this.renderPasso(v);
  }
  renderIntro(v){
    const m = this.missao, retomar = this.caminho.length > 0;
    v.innerHTML = `
      <div class="sess"><div class="sbar"><button class="btn sm ghost" id="sair">Sair</button><div class="mini">Survival Choices</div></div>
        <div class="stage">
          <div class="rel-ic">🧭</div>
          <div style="font-size:22px;font-weight:700;text-align:center">${esc(m.titulo)}</div>
          <div class="muted" style="max-width:48ch;font-size:14.5px;text-align:center">${esc(m.cenario)}</div>
          <div class="mini" style="max-width:48ch;text-align:center"><b>Objetivo:</b> ${esc(m.objetivo)}</div>
          <div class="acts"><button class="btn pri lg" id="vai">${retomar?"Continuar de onde parou":"Começar"}</button></div>
        </div>
      </div>`;
    $("#sair").onclick = () => go("academia");
    $("#vai").onclick = () => this.comecar();
  }
  renderPasso(v){
    const p = this.passo;
    v.innerHTML = `
      <div class="sess">
        <div class="sbar"><button class="btn sm ghost" id="sair">Sair</button><div class="mini">${esc(this.missao.titulo)}</div></div>
        <div class="stage" style="align-items:stretch;text-align:left">${this.corpoPasso(p)}</div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair da missão? O que já foi feito está salvo.")) go("academia"); };
    this.ligarEventosPasso(v, p);
  }
  corpoPasso(p){
    if(p.tipo === "intencao" || p.tipo === "compreensao"){
      return `
        <div class="step">${p.tipo==="compreensao" ? "Compreensão" : "Sua resposta"}</div>
        ${p.falante ? `<div class="mini">${esc(p.falante)}</div>` : ""}
        <div style="font-size:19px;font-weight:600;margin:4px 0">${esc(p.en)}</div>
        <div class="muted" style="font-size:14.5px">${esc(p.pergunta)}</div>
        <div class="rel-ops" style="max-width:none;margin-top:10px">
          ${p.opcoes.map((o,i) => {
            let estilo = "";
            if(this.revelado){
              if(o.ok) estilo = "border-color:var(--solida);color:var(--solida)";
              else if(i===this.escolhaIdx) estilo = "border-color:var(--ref);color:var(--ref)";
            }
            return `<button class="rel-op" data-i="${i}" style="${estilo}" ${this.revelado?"disabled":""}>${esc(o.t)}</button>`;
          }).join("")}
        </div>
        ${this.revelado ? (() => {
          const o = p.opcoes[this.escolhaIdx];
          return `
            ${!o.ok && o.explicacao ? `<div class="mini" style="margin-top:8px">${esc(o.explicacao)}</div>` : ""}
            <div class="acts"><button class="btn pri lg" id="continuar">Continuar</button></div>
          `;
        })() : ""}
      `;
    }
    const feito = this.estado.confirmado;
    return `
      <div class="step">Monte a frase</div>
      <div class="muted" style="font-size:14.5px">${esc(p.contexto)}</div>
      ${tapHtml(this.pool, this.estado, feito)}
      ${!feito ? `
        <div class="acts">
          <button class="btn ghost" id="limpar" ${this.estado.montada.length?"":"disabled"}>Limpar</button>
          <button class="btn pri" id="confirmar" ${this.estado.montada.length===p.resposta.length?"":"disabled"}>Confirmar</button>
        </div>` : `
        ${!this.certoMontagem ? `<div class="mini" style="margin-top:8px">Uma forma de dizer: <b>${esc(p.resposta.join(" "))}</b></div>` : ""}
        <div class="acts"><button class="btn pri lg" id="continuar">Continuar</button></div>
      `}
    `;
  }
  ligarEventosPasso(v, p){
    if(p.tipo === "intencao"){
      v.querySelectorAll("[data-i]").forEach(b => b.onclick = () => this.responderOpcao(+b.dataset.i));
      if($("#continuar")) $("#continuar").onclick = () => this.irPara(p.opcoes[this.escolhaIdx].proximo);
    } else if(p.tipo === "compreensao"){
      v.querySelectorAll("[data-i]").forEach(b => b.onclick = () => this.responderOpcao(+b.dataset.i));
      if($("#continuar")) $("#continuar").onclick = () => this.irPara(p.proximo);
    } else {
      tapEventos(v, this.estado, () => this.render($("#view")));
      if($("#limpar")) $("#limpar").onclick = () => { this.estado.montada=[]; this.render($("#view")); };
      if($("#confirmar")) $("#confirmar").onclick = () => this.confirmarMontagem();
      if($("#continuar")) $("#continuar").onclick = () => this.irPara(p.proximo);
    }
  }
  renderFim(v){
    const p = this.passo;
    v.innerHTML = `
      <div class="sess"><div class="stage">
        <div class="rel-ic fim-festa">🏁</div>
        <div style="font-size:22px;font-weight:700;text-align:center">Missão concluída!</div>
        <div class="muted" style="max-width:48ch;text-align:center">${esc(p.texto)}</div>
        <div class="acts"><button class="btn ghost" id="home">Voltar à Academia</button></div>
      </div></div>`;
    $("#home").onclick = () => go("academia");
  }
  key(e){ if(this.fase==="intro" && (e.key===" "||e.key==="Enter")){ e.preventDefault(); this.comecar(); } }
}
function startSurvival(missaoId){
  const m = missaoId ? survPorId(missaoId) : survEscolher();
  if(!m){ toast("Nenhuma missão disponível."); return; }
  SESSION = new SurvivalSession(m);
  render();
}

function viewAcademia(v){

/* Phrase Reactor removido em 17/10 (pedido dele: "não gostei"). O campo
   S.reactor continua no formato salvo (packReactor/unpackReactor) só pra
   saves antigos abrirem sem erro — nunca remover campo persistido. */

/* ============================ SESSÃO: FRASES ============================ */
function startFrases(k){
  const due = fDue(k);
  const novas = fNovas(k, fFaltaHoje(k));
  const fila = due.map(id=>({id, novo:false})).concat(novas.map(id=>({id, novo:true})));
  if(!fila.length){
    toast(fCounts(k).nova ? `Meta de ${DECK[k].nome.toLowerCase()} já cumprida hoje.` : `Você já viu todos os ${DECK[k].nome.toLowerCase()}.`);
    return;
  }
  SESSION = new FrasesSession(k, fila);
  render();
}
class FrasesSession{
  constructor(k, fila){
    this.k = k; this.fila = fila;
    this.total = fila.length; this.feitas = 0; this.acertos = 0;
    this.step = 0; this.revealed = false; this.chute = "";
  }
  get it(){ return this.fila[0]; }
  modoAtual(){
    const it = this.it; if(!it) return "pt2en";
    const x = fd(this.k, it.id);
    const target = it.novo ? 1 : Math.min(8, x.s + 1);
    return it.novo ? (this.k === "red" ? "ouvir" : "pt2en") : fModo(this.k, target);
  }
  esperado(){
    const it = this.it; if(!it) return "";
    const m = this.modoAtual();
    if(this.k === "red") return m === "ouvir" ? R[it.id][0] : R[it.id][1];
    return m === "en2pt" ? C[it.id][2] : C[it.id][0];
  }
  dicaChute(){
    const m = this.modoAtual();
    if(this.k === "red") return m === "ouvir" ? "escreva a frase completa" : "escreva a forma natural";
    return m === "en2pt" ? "escreva em português" : "escreva em inglês";
  }
  render(v){
    if(!this.fila.length) return this.renderEnd(v);
    const it = this.it;
    const ensinando = it.novo && this.step < 2;
    const body = ensinando ? this.ensino() : this.teste();
    const passo = this.feitas + (this.fila.length ? 0 : 0);
    v.innerHTML = `
      <div class="sess">
        <div class="sbar">
          <button class="btn sm ghost" id="sair">Sair</button>
          <div class="bar"><i style="width:${pct(this.feitas,this.total)}%;background:${this.k==="red"?"var(--rev)":"var(--solida)"}"></i></div>
          <div class="mini">${Math.min(this.feitas+1,this.total)} / ${this.total}</div>
        </div>
        <div class="stage">
          ${body}
          ${!ensinando && !this.revealed ? campoChute(this.dicaChute()) : ""}
          ${!ensinando && this.revealed ? linhaChute(this.chute, this.esperado()) : ""}
          <div class="acts" id="acts"></div>
        </div>
        <div class="kbd">${(it.novo && this.step<2) || !this.revealed ? `<span>espaço</span> continuar` : `<span>1</span> errei &nbsp; <span>2</span> acertei`}</div>
      </div>`;
    $("#sair").onclick = async () => { if(await confirmar("Sair do treino? O que já foi feito está salvo.")) go("home"); };
    const a = $("#acts");
    if(it.novo && this.step < 2){
      a.innerHTML = `<button class="btn pri" id="nx">Continuar</button>`;
      $("#nx").onclick = () => { this.step++; this.render($("#view")); };
    } else if(!this.revealed){
      a.innerHTML = `<button class="btn pri lg" id="rev">Ver resposta</button>`;
      const revelar = () => { this.chute = valorChute(); this.revealed = true; this.render($("#view")); };
      $("#rev").onclick = revelar;
      ligaChute(revelar);
    } else {
      a.innerHTML = `<button class="btn bad" id="err">Errei</button><button class="btn ok" id="ok">Acertei</button>`;
      $("#err").onclick = () => this.answer(false);
      $("#ok").onclick = () => this.answer(true);
      sugereBotao(this.chute, this.esperado());
    }
  }
  /* ---- ensino de um item novo ---- */
  ensino(){
    const it = this.it;
    if(this.k === "red"){
      const r = R[it.id];
      if(this.step === 0) return `
        <div class="step">01 — Como está escrito</div>
        <div class="word-pt" style="font-size:27px">${esc(r[0])}</div>
        <div class="muted" style="font-size:15px">${esc(r[3])}</div>
                <div class="mini">Essa é a frase completa. Ninguém fala assim na velocidade normal.</div>`;
      return `
        <div class="step" style="color:var(--rev)">02 — Como sai na boca</div>
        <div class="word-en" style="font-size:31px;text-transform:none;color:var(--rev)">${esc(r[1])}</div>
        <div class="pron">${esc(r[2])}</div>
                <div class="hintbox">${esc(r[4])}</div>
        <div class="mini">Ouça as duas e repita a versão natural 3 vezes.</div>`;
    }
    const c = C[it.id];
    if(this.step === 0) return `
      <div class="step">01 — O que você quer dizer</div>
      <div class="word-pt" style="font-size:28px">${esc(c[2])}</div>
      <div class="mini">${esc(c[3])}</div>`;
    return `
      <div class="step" style="color:var(--solida)">02 — O bloco em inglês</div>
      <div class="word-en" style="font-size:29px;text-transform:none">${esc(c[0])}</div>
      <div class="pron" style="font-size:24px">${esc(c[1])}</div>
      <div class="muted" style="font-size:15px">${esc(c[2])}</div>
            <div class="mini">Repita 3 vezes em voz alta, no mesmo ritmo do áudio.</div>`;
  }
  /* ---- teste ---- */
  teste(){
    const it = this.it, k = this.k;
    const x = fd(k, it.id);
    const target = it.novo ? 1 : Math.min(8, x.s + 1);
    const modo = it.novo ? (k==="red" ? "ouvir" : "pt2en") : fModo(k, target);
    const topo = `<div class="row" style="justify-content:center;gap:8px">
        <div class="step" style="color:${k==="red"?"var(--rev)":"var(--solida)"}">${it.novo ? "03 — Recall" : `Revisão ${target} de 8 · ${SCHED[target-1].nome}`}</div>
        ${it.redo ? `<span class="redo">reteste</span>` : ""}
      </div>`;
    if(k === "red"){
      const r = R[it.id];
      if(modo === "ouvir"){
        if(!this.revealed) return `${topo}
          <div class="word-en" style="font-size:30px;text-transform:none;color:var(--rev)">${esc(r[1])}</div>
                    <div class="mini">Qual é a frase completa e o que ela significa?</div>`;
        return `${topo}
          <div class="word-en" style="font-size:24px;text-transform:none;color:var(--rev)">${esc(r[1])}</div>
          <div class="pron" style="font-size:21px">${esc(r[2])}</div>
          <div class="word-pt" style="font-size:24px">${esc(r[0])}</div>
          <div class="muted" style="font-size:15px">${esc(r[3])}</div>
                    <div class="hintbox">${esc(r[4])}</div>`;
      }
      if(!this.revealed) return `${topo}
        <div class="word-pt" style="font-size:26px">${esc(r[3])}</div>
        <div class="mini">Fale em inglês, do jeito natural, em voz alta.</div>`;
      return `${topo}
        <div class="word-en" style="font-size:29px;text-transform:none;color:var(--rev)">${esc(r[1])}</div>
        <div class="pron">${esc(r[2])}</div>
        <div class="muted" style="font-size:14px">completa: ${esc(r[0])}</div>`;
    }
    const c = C[it.id];
    if(modo === "en2pt"){
      if(!this.revealed) return `${topo}
        <div class="word-en" style="font-size:27px;text-transform:none">${esc(c[0])}</div>
        <div class="mini">O que isso quer dizer em português?</div>`;
      return `${topo}
        <div class="word-en" style="font-size:23px;text-transform:none;color:var(--tx2)">${esc(c[0])}</div>
        <div class="word-pt" style="font-size:27px">${esc(c[2])}</div>`;
    }
    if(!this.revealed) return `${topo}
      <div class="word-pt" style="font-size:27px">${esc(c[2])}</div>
      <div class="mini">Diga o bloco em inglês, em voz alta.</div>`;
    return `${topo}
      <div class="word-en" style="font-size:28px;text-transform:none">${esc(c[0])}</div>
      ${modo === "pt2en" ? `<div class="pron" style="font-size:23px">${esc(c[1])}</div>` : ""}
      <div class="muted" style="font-size:15px">${esc(c[2])}</div>`;
  }
  answer(ok){
    vibrar(ok);
    const it = this.fila.shift(), k = this.k;
    if(it.redo){
      // reteste do erro: não mexe na agenda, só reforça
    } else if(it.novo){
      const x = fd(k, it.id);
      x.l = x.l || Date.now(); x.s = 0; x.a++; if(!ok) x.e++;
      scheduleNext(x);
      today()[DECK[k].campo]++;
      S.ultimo = Date.now(); save();
      this.feitas++; if(ok) this.acertos++;
    } else {
      fApply(k, it.id, ok);
      this.feitas++; if(ok) this.acertos++;
    }
    if(!ok && (it.vezes||0) < 2){
      const pos = Math.min(this.fila.length, 3);
      this.fila.splice(pos, 0, {id:it.id, novo:false, redo:true, vezes:(it.vezes||0)+1});
      toast("Sem problema. Ela volta daqui a pouco.");
    }
    this.step = 0; this.revealed = false; this.chute = "";
    this.render($("#view"));
  }
  renderEnd(v){
    const k = this.k, d = today(), meta = DECK[k].meta, feito = d[DECK[k].campo] || 0;
    const completo = feito >= meta;
    const resto = fDue(k).length + fFaltaHoje(k);
    v.innerHTML = `
      <div class="sess">
        <div class="stage">
          <div class="celebrate">
            <div class="ic">${completo ? "🔥" : "✓"}</div>
            <div style="font-size:22px;font-weight:650;letter-spacing:-.02em">${completo ? DECK[k].nome + " do dia completos" : "Rodada concluída"}</div>
            <div class="muted" style="margin-top:6px">${this.feitas} ${plural(this.feitas,"item","itens")} · ${pct(this.acertos,Math.max(1,this.total))}% de acerto</div>
            <div class="mini" style="margin-top:8px">${feito} de ${meta} novos hoje</div>
          </div>
          <div class="acts">
            ${resto ? `<button class="btn pri" id="mais">Continuar</button>` : ""}
            <button class="btn ghost" id="home">Voltar ao início</button>
          </div>
        </div>
      </div>`;
    if($("#mais")) $("#mais").onclick = () => startFrases(k);
    $("#home").onclick = () => go("home");
  }
  key(e){
    if(!this.fila.length) return;
    const it = this.it;
    if(e.key === " "){
      e.preventDefault();
      if(it.novo && this.step < 2){ this.step++; this.render($("#view")); }
      else if(!this.revealed){ this.revealed = true; this.render($("#view")); }
      return;
    }
    if(!(it.novo && this.step < 2) && this.revealed){
      if(e.key === "1") this.answer(false);
      if(e.key === "2") this.answer(true);
    }
  }
}

  };
  v.innerHTML = `
    <div style="margin-bottom:16px">
      <h1>Frases</h1>

      <span id="ffg"></span>
      <span class="mini" id="ffc"></span>
    </div>
    <div id="flist"></div>`;
  v.querySelectorAll("[data-go]").forEach(b => b.onclick = () => startFrases(b.dataset.go));
  v.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    frasesTab = b.dataset.tab; frasesF = {q:"", g:"", n:60}; render();
  });
  const k = frasesTab;
  if(k === "chk"){
    const grupos = [...new Set(C.map(c=>c[3]))];
    $("#ffg").innerHTML = `<select id="ffgs"><option value="">Todos os grupos</option>${
      grupos.map(g=>`<option value="${esc(g)}" ${frasesF.g===g?"selected":""}>${esc(g)}</option>`).join("")}</select>`;
  } else {
    $("#ffg").innerHTML = "";
  }
  const draw = () => {
    const dados = DECK[k].dados(), q = frasesF.q.toLowerCase(), res = [];
    for(let i=0;i<dados.length;i++){
      const it = dados[i];
      if(k === "chk" && frasesF.g && it[3] !== frasesF.g) continue;
      if(q && !it.some(t => String(t).toLowerCase().includes(q))) continue;
      res.push(i);
    }
    $("#ffc").textContent = res.length + " " + plural(res.length,"resultado","resultados");
    const show = res.slice(0, frasesF.n);
    $("#flist").innerHTML = show.length ? `
      <div class="wlist">
        ${show.map(i=>{
          const it = dados[i], s = fStatus(k,i);

    : `<div class="empty"><div class="ic">∅</div>Nada com esse filtro.</div>`;

    document.querySelectorAll("#flist .wrow").forEach(r => r.onclick = () => openFrase(k, +r.dataset.i));

  if($("#ffgs")) $("#ffgs").onchange = e => { frasesF.g = e.target.value; frasesF.n = 60; draw(); };

/* vocabulário liberado: o que já está dominado mais o que está em estudo */
function vocabDisponivel(limite){
  const dom = [], estudo = [];
  for(let i = 0; i < W.length; i++){
    const x = S.w[i];
    if(!x || !x.l) continue;
    (x.m || x.s >= 6 ? dom : estudo).push(W[i][2]);
  }
  const fon = {};
  for(let i = 0; i < W.length && Object.keys(fon).length < 70; i++){
    const x = S.w[i];
    if(x && x.l) fon[W[i][2]] = W[i][1];
  }
  return {dom: dom.slice(-limite), estudo: estudo.slice(-60), fon};
}

function montarPrompt(cena){
  const v = vocabDisponivel(340);
  return [
    "Você escreve textos curtos em inglês para um brasileiro estudando vocabulário.",

    "- No mínimo 95% das palavras têm que sair das duas listas ou ser gramática básica (artigos, preposições, pronomes, verbos auxiliares).",
    "- Frases curtas e faladas, inglês americano do dia a dia. Nada de vocabulário literário.",

/* banco pronto primeiro (pedido dele em 25/09, pra não gastar IA toda vez):
   evita repetir os textos que ainda estão na lista guardada (os 12 mais
   recentes); só cai pra geração ao vivo se o banco estiver vazio. */
function txtBancoEscolher(){
  if(!TXT_BANCO.length) return null;
  const recentes = new Set((S.txt||[]).map(x => x.t));
  let pool = TXT_BANCO.filter(b => !recentes.has(b.titulo));
  if(!pool.length) pool = TXT_BANCO;
  return pool[Math.floor(Math.random()*pool.length)];
}
async function gerarTexto(aoTerminar, aoErro){
  const doBanco = txtBancoEscolher();
  if(doBanco){
    if(!S.txt) S.txt = [];
    S.txt.unshift({d: dayKey(), ctx: doBanco.ctx || "", t: doBanco.titulo, l: doBanco.linhas, lido: 0});
    S.txt = S.txt.slice(0, MAX_TXT_GUARDADOS);
    save();
    if(aoTerminar) aoTerminar();
    return;
  }
  if(!sampleRef){ if(aoErro) aoErro("sem"); return; }
  const cena = CENAS[Math.floor(Math.random() * CENAS.length)];
  gerando = new AbortController();
  try{
    const j = await sampleRef.json(montarPrompt(cena), {
      cache: false, modelTier: "default", signal: gerando.signal
    });
    const linhas = (j && Array.isArray(j.linhas) ? j.linhas : [])
      .map(l => [String(l.en || "").trim(), String(l.pt || "").trim()])
      .filter(l => l[0] && l[1]);
    if(linhas.length < 3) throw {code:"invalid_json"};
    if(!S.txt) S.txt = [];
    S.txt.unshift({d: dayKey(), ctx: cena, t: String((j && j.titulo) || "Sem título").slice(0, 60), l: linhas, lido: 0});
    S.txt = S.txt.slice(0, MAX_TXT_GUARDADOS);
    save();
    gerando = null;
    if(aoTerminar) aoTerminar();
  }catch(e){
    gerando = null;
    if(aoErro) aoErro((e && e.code) || "erro");
  }
}
function msgErroTexto(c){
  if(c === "cancelled") return null;
  if(c === "not_granted" || c === "sampling_disabled" || c === "not_declared")
    return "O sistema não tem permissão para escrever textos aqui.";
  if(c === "rate_limited") return "Muitos pedidos seguidos. Tente daqui a pouco.";
  if(c === "invalid_json" || c === "empty_completion") return "O texto saiu quebrado. Tente de novo.";
  if(c === "sem") return "Os textos só funcionam no link do sistema.";
  return "Não deu para escrever o texto agora.";
}

   treinos de fora, do lado de Listening/Speaking/Grammar. Não guarda

   a frase pra um modelo corrigir, sorteia uma frase já pronta de reduções
   ou blocos (custo zero, sempre disponível, funciona até na cópia offline)
   e mostra o português como o que ele tem que traduzir; ele escreve, depois

let escUltimo = -1;
function escSorteio(){
  const pool = [];
  for(let i = 0; i < R.length; i++) pool.push({en:R[i][0], pt:R[i][3]});
  for(let i = 0; i < C.length; i++) pool.push({en:C[i][0], pt:C[i][2]});
  if(!pool.length) return null;
  let idx;
  do{ idx = Math.floor(Math.random() * pool.length); } while(pool.length > 1 && idx === escUltimo);
  escUltimo = idx;
  return pool[idx];
}
function abrirEscrita(){
  const item = escSorteio();

/* ============================ MÓDULO: VERBOS ============================ */
/* 80 verbos reais. Cada um tem "componentes" (presente, negativa, perguntas,
   passado, particípio, futuro — só 3 pros modais) que sobem de domínio
   conforme ele pratica. A sugestão do dia sempre pega o verbo com menor
   domínio médio, pra passar pelos 80 antes de aprofundar demais um só. */
function verbProgresso(id){
  const verbo = VERBOS.find(x => x.id === id);
  if(!verbo) return [];
  if(!S.verb[id] || S.verb[id].length !== verbo.componentes.length) S.verb[id] = verbo.componentes.map(() => 0);
  return S.verb[id];
}
function verbDomain(id){
  const p = verbProgresso(id);
  return p.length ? Math.round(p.reduce((a,b) => a+b, 0) / p.length) : 0;
}
function verbStatusOf(dom){ return dom >= 90 ? "dom" : dom >= 40 ? "rev" : "nova"; }
function verbStatusLabel(dom){ return dom >= 90 ? "dominado" : dom >= 40 ? "em progresso" : "iniciando"; }
function pickStudyVerb(){
  return VERBOS.slice().sort((a,b) => verbDomain(a.id) - verbDomain(b.id))[0] || null;
}
/* ---- verbo do dia (17/10) ----
   Um verbo por dia, estudado a fundo. O sistema sorteia entre os que ainda
   não foram estudados e guarda a escolha do dia (S.vb.hoje), então voltar à
   tela mostra o mesmo verbo até ele ser estudado. Depois do primeiro estudo
   o verbo entra na MESMA agenda de 8 revisões das palavras (scheduleNext):
   1h, fim do dia, dia seguinte, 2 dias, 3 dias, 1 semana, 1 mês, 3 meses.
   Guardado em S.vb.w, separado de S.w — nunca mistura com o SRS das palavras. */
function vbEntry(id){
  if(!S.vb.w[id]) S.vb.w[id] = {s:0, n:null, l:null, e:0, a:0, m:false, r:false};
  return S.vb.w[id];
}
function vbLearned(id){ const x = S.vb.w[id]; return !!(x && x.l); }
function vbStatus(id){
  const x = S.vb.w[id];
  if(!x || !x.l) return "nova";
  if(x.r) return "ref";
  if(x.m) return "dom";
  if(x.s <= 2) return "aprend";
  if(x.s <= 6) return "rev";
  return "solida";
}
function vbDue(){
  const now = Date.now(), out = [];
  for(const id in S.vb.w){
    const x = S.vb.w[id];
    if(x.l && x.n && x.n <= now && x.s < 8 && VERBOS.some(v => v.id === id)) out.push(id);
  }
  out.sort((a,b) => S.vb.w[a].n - S.vb.w[b].n);
  return out;
}
function vbProxima(){
  const now = Date.now();
  let melhor = null;
  for(const id in S.vb.w){
    const x = S.vb.w[id];
    if(x.l && x.n && x.n > now && x.s < 8 && (!melhor || x.n < S.vb.w[melhor].n)) melhor = id;
  }
  return melhor;
}
function vbRevisao(x, ok){
  x.a++;
  const d = today(); d.vrev = (d.vrev||0) + 1;
  if(ok){
    x.s = Math.min(8, x.s + 1); x.r = false;
    if(x.s >= 8) x.m = true;
    scheduleNext(x);
  } else {
    x.e++; x.r = true; if(x.m) x.m = false;
    x.n = atHour(addDays(new Date(), 1), 9);
  }
}
/* fim de uma sessão do verbo: primeira vez entra na agenda; se já estava
   vencido conta como revisão (passou com 60% ou mais da prática); fora disso
   é só treino e a agenda não muda. */
function vbRegistra(id, nota){
  const x = vbEntry(id), agora = Date.now();
  S.ultimo = agora;
  if(!x.l){ x.l = agora; x.s = 0; x.a++; scheduleNext(x); return {tipo:"novo", n:x.n}; }
  if(x.n && x.n <= agora && x.s < 8){
    const ok = nota >= 0.6;
    vbRevisao(x, ok);
    return {tipo:"revisao", ok, s:x.s, n:x.n, m:x.m};
  }
  return {tipo:"treino"};
}
function verbDoDia(){
  const k = dayKey(), h = S.vb.hoje;
  if(h && h.k === k && VERBOS.some(v => v.id === h.id) && !vbLearned(h.id)) return h.id;
  return sorteiaVerbo(h && h.id);
}
function sorteiaVerbo(evita){
  let pool = VERBOS.filter(v => !vbLearned(v.id));
  if(!pool.length) pool = VERBOS.slice();
  if(pool.length > 1 && evita) pool = pool.filter(v => v.id !== evita);
  const id = pool[Math.floor(Math.random() * pool.length)].id;
  S.vb.hoje = {k:dayKey(), id};
  save();
  return id;
}
function vbQuando(t){ return t ? new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—"; }
/* regra de acúmulo: a meta de verbos não reseta sozinha (ver dia() em
   PERSISTÊNCIA) — o que faltou vira pendência, o que passou vira crédito. */
function metaEfetivaVerb(){ return GOAL_VERB + Math.max(0, S.acum.verb||0); }
function pendenteVerb(){ return Math.max(0, metaEfetivaVerb() - (today().verb||0)); }

function highlight(frase, termos){
  let out = esc(frase);
  (termos||[]).forEach(t => {
    const re = new RegExp("(" + String(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "i");
    out = out.replace(re, "<mark>$1</mark>");
  });
  return out;
}
/* ---- treino completo do verbo (17/10): formas → usos → tempos → prática ----
   Pedido dele: "quando eu entrar pra estudar um verbo, ter todas as opções
   (get, got, gotten...) e vários exemplos diferentes". O registro de
   progresso no fim é exatamente o mesmo de antes (componentes +14, conta 1
   verbo no dia). Verbo sem conteúdo em VERB_USOS cai no fluxo antigo. */
const VERB_ROTULO = {base:"base", s:"ele / ela", ing:"-ing", passado:"passado", participio:"particípio", negativa:"negativa", outra:"am / are / were"};
function verbUsos(id){ return VERB_USOS.find(x => x.id === id) || null; }
function verbFormasLista(vu){
  // [[chave, rótulo, texto]] sem repetir texto (put/put/put vira um só no exercício, mas aparece na tabela)
  if(!vu) return [];
  const f = vu.formas || {};
  if(f.negativa !== undefined) return [["base","afirmativa",f.base],["negativa","negativa",f.negativa]];
  if(vu.outras && vu.outras.length){
    // be: o presente e o passado têm mais de uma forma (am/is/are, was/were)
    const pres = ["am", f.s, "are"].filter(x => x === f.s || vu.outras.indexOf(x) >= 0);
    const pass = [f.passado].concat(vu.outras.filter(x => x === "were"));
    return [["base","base",f.base],["s","presente",pres.join(" · ")],["ing","-ing",f.ing],["passado","passado",pass.join(" · ")],["participio","particípio",f.participio]];
  }
  return [["base","base",f.base],["s","ele / ela",f.s],["ing","-ing",f.ing],["passado","passado",f.passado],["participio","particípio",f.participio]];
}
function verbOpcoesTexto(vu){
  const f = vu.formas || {};
  const todas = Object.values(f).concat(vu.outras || []);
  return todas.filter((t,i) => todas.findIndex(x => x.toLowerCase() === t.toLowerCase()) === i);

function reAlvo(alvo){ return new RegExp("(^|[^A-Za-z'’])(" + String(alvo).replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")(?![A-Za-z'’])", "i"); }
function marcaAlvo(frase, alvo){
  const m = frase.match(reAlvo(alvo));
  if(!m) return esc(frase);
  const i = m.index + m[1].length;
  return esc(frase.slice(0, i)) + "<mark>" + esc(frase.slice(i, i + m[2].length)) + "</mark>" + esc(frase.slice(i + m[2].length));
}
function lacunaAlvo(frase, alvo, preenchida, cor){
  const m = frase.match(reAlvo(alvo));
  if(!m) return esc(frase);
  const i = m.index + m[1].length;
  const meio = preenchida ? `<span class="lacuna cheia" style="--cor:${cor}">${esc(preenchida)}</span>` : `<span class="lacuna">&nbsp;</span>`;

function verbMontaPratica(vu){
  const todos = [];
  vu.usos.forEach(u => u.exemplos.forEach(e => todos.push(Object.assign({uso:u}, e))));
  const qs = [], usados = new Set();
  // 1) complete com a forma certa — tenta formas diferentes entre si
  const formasVistas = new Set();
  embaralha(todos).forEach(e => {
    if(qs.length >= 3 || formasVistas.has(e.forma)) return;
    const certa = e.alvo;
    const resto = embaralha(verbOpcoesTexto(vu).filter(t => t.toLowerCase() !== certa.toLowerCase())).slice(0, 3);
    if(!resto.length) return;
    formasVistas.add(e.forma); usados.add(e);
    qs.push({tipo:"lacuna", ex:e, opcoes:embaralha([certa].concat(resto)), certa});
  });
  // 2) o que quer dizer aqui — só faz sentido com 2+ usos
  if(vu.usos.length >= 2){
    embaralha(todos.filter(e => !usados.has(e))).slice(0, 2).forEach(e => {
      const outros = embaralha(vu.usos.filter(u => u !== e.uso).map(u => u.sentido)).slice(0, 3);
      usados.add(e);
      qs.push({tipo:"sentido", ex:e, opcoes:embaralha([e.uso.sentido].concat(outros)), certa:e.uso.sentido});
    });
  }

  const curtas = embaralha(todos.filter(e => !usados.has(e) && e.en.split(/\s+/).length >= 4 && e.en.split(/\s+/).length <= 9));

    const e = curtas[0], blocos = e.en.split(/\s+/);
    qs.push({tipo:"montar", ex:e, blocos, pool:embaralha(blocos.slice()), estado:{montada:[], confirmado:false}});
  }

}

    document.querySelectorAll(".wrow").forEach(r => r.onclick = () => openWord(+r.dataset.i));

/* ---- edição manual do PAV ---- */
function editarPav(id, depois){
  const w = W[id];
  const editado = !!(S.pav && S.pav[id]);
  const box = el(`<div class="modal">
    <div class="card" style="max-width:580px;width:100%;background:var(--panel-2)">
      <div class="spread" style="margin-bottom:14px">
        <div>
          <div class="lbl">Editar PAV</div>
          <div style="font-weight:650;font-size:19px;margin-top:3px">${esc(w[2])} <span class="dim" style="font-weight:500;font-size:15px">· ${esc(cap(w[0]))}</span></div>
        </div>
        <button class="btn sm ghost" id="x">Cancelar</button>
      </div>
      <textarea id="ta" rows="4" placeholder="Escreva a cena do PAV…">${esc(pavOf(id))}</textarea>
      <div class="mini" style="margin-top:8px">Uma frase curta: o significado, um elemento que puxa o som (${esc(w[1])}) e uma ação impossível.</div>
      <div class="sep"></div>
      <div class="lbl" style="margin-bottom:8px">Imagem da cena</div>
      ${temImagens()
        ? (imgOf(id)
            ? `${blocoImagem(id)}<div class="row" style="gap:8px;margin-top:10px;justify-content:center">
                 <button class="edt" id="imgTrocar">trocar imagem</button>
                 <button class="edt" id="imgTirar">remover</button>
               </div>`
            : `<div class="imgvazio">Nenhuma imagem ainda.<div style="margin-top:10px"><button class="btn sm" id="imgTrocar">Enviar imagem</button></div></div>`)
        : `<div class="imgvazio">As imagens só funcionam no link do sistema, não nesta cópia.</div>`}
      <div class="spread" style="margin-top:16px">
        <button class="edt" id="orig" ${editado?"":"style=visibility:hidden"}>voltar ao original</button>
        <button class="btn pri" id="ok">Salvar</button>
      </div>
    </div></div>`);
  document.body.appendChild(box);
  const ta = box.querySelector("#ta");
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  const fechar = () => { box.remove(); if(depois) depois(); };
  box.onclick = e => { if(e.target === box) fechar(); };
  box.querySelector("#x").onclick = fechar;
  const bTrocar = box.querySelector("#imgTrocar");
  if(bTrocar) bTrocar.onclick = () => { box.remove(); escolherImagem(id, () => editarPav(id, depois)); };
  const bTirar = box.querySelector("#imgTirar");
  if(bTirar) bTirar.onclick = async () => {
    if(!(await confirmar("Remover a imagem desta palavra?"))) return;
    await removerImagem(id);
    toast("Imagem removida.");
    box.remove(); editarPav(id, depois);
  };
  box.querySelector("#orig").onclick = () => {
    if(S.pav) delete S.pav[id];
    save(); toast("PAV original restaurado."); fechar();
  };
  box.querySelector("#ok").onclick = () => {
    const txt = ta.value.trim();
    if(!txt){ toast("O PAV não pode ficar vazio."); return; }
    if(!S.pav) S.pav = {};
    if(txt === W[id][3]) delete S.pav[id]; else S.pav[id] = txt;
    save(); toast("PAV salvo."); fechar();
  };
  ta.onkeydown = e => {
    if(e.key === "Escape"){ e.preventDefault(); fechar(); }
    if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); box.querySelector("#ok").click(); }
    e.stopPropagation();
  };
}

/* O número que importa no relâmpago não é o placar: é o tempo caindo. */
function cardRelampago(){
  const r = relEstado(), n = r.rodadas.length;
  if(!n) return "";
  const tempos = r.rodadas.filter(x => x[4] > 0).map(x => x[4]);
  const media = a => a.length ? Math.round(a.reduce((s,x)=>s+x,0)/a.length) : null;
  const k = Math.min(5, Math.floor(tempos.length/2));
  const inicio = k ? media(tempos.slice(0,k)) : null;
  const agora  = k ? media(tempos.slice(-k)) : null;
  const ganho  = (inicio && agora) ? Math.round((1 - agora/inicio) * 100) : null;
  return `
    <div class="card" style="margin-bottom:14px">
      <div class="spread" style="margin-bottom:12px">
        <h2 style="margin:0">Relâmpago</h2>
        <div class="mini">${n} ${plural(n,"rodada","rodadas")}</div>
      </div>
      <div class="rel-placarF">
        <div><b>${r.seq||0}</b><span>recorde de sequência</span></div>
        <div><b>${r.acertos||0}</b><span>recorde de acertos</span></div>
        <div><b>${relSeg(r.tempo)}</b><span>melhor tempo médio</span></div>
        <div><b>${relSeg(agora)}</b><span>tempo médio agora</span></div>
      </div>
      <div class="mini" style="margin-top:10px">
        ${ganho !== null && ganho !== 0
          ? (ganho > 0
              ? `Você reconhece as palavras <b style="color:var(--solida)">${ganho}% mais rápido</b> do que nas primeiras rodadas (${relSeg(inicio)} → ${relSeg(agora)}). É essa queda que aparece na hora de entender fala real.`
              : `Seu tempo subiu ${-ganho}% em relação ao começo (${relSeg(inicio)} → ${relSeg(agora)}). Normal quando entram palavras novas no sorteio.`)
          : "Jogue mais algumas rodadas para o sistema medir se o seu tempo está caindo."}
      </div>
    </div>`;
}

        <div class="tli"><div class="lbl">O que você tem</div><div>${comProgresso} ${plural(comProgresso,"palavra","palavras")} em estudo · ${Object.keys(S.r||{}).length} ${plural(Object.keys(S.r||{}).length,"redução","reduções")} · ${Object.keys(S.c||{}).length} ${plural(Object.keys(S.c||{}).length,"bloco","blocos")} · ${diasEstudados()} ${plural(diasEstudados(),"dia","dias")}</div></div>
        <div class="tli"><div class="lbl">Conteúdo</div><div>${LEVEL_TOTAL} palavras · ${RED_TOTAL} reduções · ${CHK_TOTAL} blocos</div></div>
        <div class="tli"><div class="lbl">Registros perdidos</div><div>${orfas
          ? `<span class="no-tx">${orfas} ${plural(orfas,"registro","registros")} de item que não existe mais na lista</span>`
          : "nenhum — todo o seu histórico casa com a lista atual"}</div></div>
      </div>
      <div class="sep"></div>
      <p class="mini" style="margin-bottom:14px">Seu progresso é guardado pela palavra, não pela posição dela na lista. É isso que permite acrescentar palavras novas sem embaralhar o que você já estudou.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn" id="exp2">Baixar cópia agora</button>
        <button class="btn ghost" id="imp2">Restaurar de um arquivo</button>
      </div>
    </div>

    <div class="banner ${dbRef?"ok":""}" style="margin-bottom:14px">
      <div style="flex:1">
        <b>${dbRef ? "Sincronizado entre seus aparelhos" : "Sem sincronização aqui"}</b>
        <div class="mini" style="margin-top:2px">
          ${dbRef
            ? "Salva sozinho a cada ação: não existe botão de salvar. Abra este mesmo link no PC e no celular, logado na sua conta, e os dois leem e gravam o mesmo progresso. Quem estudou por último manda."
            : "Esta é a cópia que abre direto do arquivo. Para ter o mesmo progresso no PC e no celular, use o link do sistema em vez deste arquivo."}
        </div>
      </div>
      <span class="pill ${dbRef?"s-solida":"s-nova"}"><span class="dotc"></span>${dbRef ? "ativo" : "local"}</span>
    </div>

    <div class="banner ${conectado?"ok":""}" style="margin-bottom:14px">
      <div style="flex:1">
        <b>${conectado ? "Arquivo conectado" : "Nenhum arquivo conectado"}</b>
        <div class="mini" style="margin-top:2px">
          ${conectado
            ? "Todo progresso é gravado no arquivo automaticamente, a cada ação."
            : (window.showSaveFilePicker
                ? "Hoje o progresso está só na memória do navegador. Conecte um arquivo dentro da pasta Inglês fluente: como ela está no OneDrive, o backup na nuvem acontece sozinho."
                : "Neste navegador não dá para conectar arquivo. Exporte uma cópia de vez em quando para não depender só da memória do navegador.")}
        </div>
      </div>
      ${window.showSaveFilePicker ? `<button class="btn sm ${conectado?"ghost":"pri"}" id="conn">${conectado ? "Trocar arquivo" : (window.__pendingHandle ? "Reconectar arquivo" : "Conectar arquivo")}</button>` : ""}
    </div>

    <div class="banner ${temLeitura()?"ok":""}" style="margin-bottom:14px">
      <div style="flex:1">
        <b>Leitura do dia</b>
        <div class="mini" style="margin-top:2px">
          ${temLeitura()
            ? "O sistema escreve histórias novas usando as palavras que você já domina, mais algumas que está estudando. Cada texto tem duas passadas: o inglês escrito e a tradução. Os " + MAX_TXT_GUARDADOS + " últimos ficam guardados."
            : "Nesta cópia não dá para escrever textos. Use o link do sistema."}
        </div>
      </div>
      <span class="pill ${(S.txt||[]).length?"s-solida":"s-nova"}"><span class="dotc"></span>${(S.txt||[]).length} ${plural((S.txt||[]).length,"texto","textos")}</span>
    </div>

    <div class="banner ${vibLigada?"ok":""}" style="margin-bottom:14px">
      <div style="flex:1">
        <b>Vibração no acerto ${vibLigada ? "ligada" : "desligada"}</b>
        <div class="mini" style="margin-top:2px">Um toque curto quando acerta, dois quando erra. Só funciona no celular; no PC não faz nada.</div>
      </div>
      <button class="btn sm ${vibLigada?"ghost":"pri"}" id="vibTgl">${vibLigada ? "Desligar" : "Ligar"}</button>
    </div>

    <div class="banner ${temImagens()?"ok":""}" style="margin-bottom:14px">
      <div style="flex:1">
        <b>Imagens dos PAV</b>
        <div class="mini" style="margin-top:2px">
          ${temImagens()
            ? "As imagens ficam guardadas junto do sistema, então o que você sobe no PC aparece no celular. Cada imagem é reduzida antes de subir. Envie pelo botão <b>+ imagem</b> na etapa do PAV, na revisão ou no banco de palavras."
            : "Nesta cópia não dá para guardar imagens. Use o link do sistema."}
        </div>
      </div>
      <div class="row" style="gap:8px">
        <span class="pill ${contaImagens()?"s-solida":"s-nova"}"><span class="dotc"></span>${contaImagens()} ${plural(contaImagens(),"imagem","imagens")}</span>
        ${temImagens() ? `<button class="btn sm ghost" id="imgEspaco">Espaço</button>` : ""}
      </div>
    </div>
    <div id="imgInfo" style="margin-bottom:14px"></div>

    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card">
        <h2>Cópia manual</h2>
        <p class="muted" style="font-size:13.5px;margin-bottom:14px">Baixa um arquivo com todo o seu progresso. Guarde quando quiser uma cópia extra.</p>
        <div class="row"><button class="btn" id="exp">Exportar</button><button class="btn ghost" id="imp">Importar</button></div>
      </div>
      <div class="card">
        <h2>Como o sistema funciona</h2>
        <div class="tl">
          <div class="tli"><div class="lbl">Meta diária</div><div>${GOAL_NEW} palavras novas + revisões</div></div>
          <div class="tli"><div class="lbl">Lote</div><div>A cada ${BATCH} novas, 1 revisão antiga</div></div>
          <div class="tli"><div class="lbl">Dia mínimo</div><div>${GOAL_MIN} novas + revisões em dia mantêm a sequência</div></div>
          <div class="tli"><div class="lbl">Revisões 1–3</div><div>Português + PAV → inglês</div></div>
          <div class="tli"><div class="lbl">Revisão 4</div><div>Inglês + PAV → português</div></div>
          <div class="tli"><div class="lbl">Revisões 5–6</div><div>Inglês → escolha a tradução em português</div></div>
          <div class="tli"><div class="lbl">Revisões 7–8</div><div>Só o português → inglês</div></div>
          <div class="tli"><div class="lbl">Dica</div><div>Disponível da revisão 7 em diante · conta como erro</div></div>
          <div class="tli"><div class="lbl">Erro</div><div>Resposta + PAV, reteste na mesma sessão, revisão repete amanhã</div></div>
          <div class="tli"><div class="lbl">Reduções</div><div>${RED_TOTAL} no total · opcional, fora da meta diária (aba Frases)</div></div>
          <div class="tli"><div class="lbl">Blocos</div><div>${CHK_TOTAL} no total · opcional, fora da meta diária (aba Frases)</div></div>
          <div class="tli"><div class="lbl">Frases nas revisões</div><div>Mesma agenda de 8 das palavras</div></div>
          <div class="tli"><div class="lbl">Leitura</div><div>${GOAL_TXT} textos por dia, escritos com o seu vocabulário</div></div>
          <div class="tli"><div class="lbl">Famílias</div><div>${Object.keys(FAM).length} palavras mostram suas flexões</div></div>
          <div class="tli"><div class="lbl">Chute</div><div>Escreva antes de revelar: tentar fixa mais que só ler</div></div>
          <div class="tli"><div class="lbl">Folgas</div><div>${ESCUDOS_MES} por mês mantêm a sequência viva</div></div>
          <div class="tli"><div class="lbl">PAVs editados</div><div>${Object.keys(S.pav||{}).length} de ${LEVEL_TOTAL}</div></div>
          <div class="tli"><div class="lbl">PAVs com imagem</div><div>${contaImagens()} de ${LEVEL_TOTAL}</div></div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>Zerar progresso</h2>
      <p class="muted" style="font-size:13.5px;margin-bottom:14px">Apaga todo o histórico e volta ao dia zero. As 1.200 palavras, os PAVs e as imagens continuam.</p>
      <button class="btn bad" id="zerar">Zerar tudo</button>
    </div>`;
  if($("#conn")) $("#conn").onclick = () => window.__pendingHandle && !fileHandle ? reauthFile() : connectFile();
  $("#exp").onclick = exportJSON;
  if($("#exp2")) $("#exp2").onclick = exportJSON;
  if($("#imp2")) $("#imp2").onclick = importJSON;
  if($("#vibTgl")) $("#vibTgl").onclick = () => {
    vibLigada = !vibLigada;
    try{ localStorage.setItem(VIB_KEY, vibLigada ? "1" : "0"); }catch(e){}
    if(vibLigada) vibrar(true);
    render();
  };
  if($("#imgEspaco")) $("#imgEspaco").onclick = async () => {
    const alvo = $("#imgInfo");
    alvo.innerHTML = `<div class="mini">Consultando…</div>`;
    try{
      const r = await assetsRef.list();
      const mb = n => (n / 1048576).toFixed(1) + " MB";
      const orfas = r.assets.filter(x => Object.values(S.img || {}).indexOf(x.id) < 0).length;
      alvo.innerHTML = `<div class="card tight"><div class="tl">
        <div class="tli"><div class="lbl">Imagens</div><div>${r.usage.files} de ${r.usage.maxFiles}</div></div>
        <div class="tli"><div class="lbl">Espaço</div><div>${mb(r.usage.bytes)} de ${mb(r.usage.maxBytes)}</div></div>
        <div class="tli"><div class="lbl">Sem dono</div><div>${orfas} ${plural(orfas,"arquivo","arquivos")} que nenhuma palavra usa</div></div>
      </div></div>`;
    }catch(e){ alvo.innerHTML = `<div class="mini">Não consegui consultar o espaço agora.</div>`; }
  };
  $("#imp").onclick = importJSON;
  $("#zerar").onclick = async () => {
    /* 23/10: o sistema agora protege o progresso contra apagão (mesclagem entre
       aparelhos + trava no banco). Zerar de propósito não é feito por aqui:
       peça ao Claude, que faz isso de forma controlada e guarda uma cópia. */
    toast("Zerar é feito só pelo Claude (proteção contra apagão). Peça a ele.");
  };
}

/* ============================ BOOT ============================ */
document.addEventListener("keydown", e => { if(SESSION && SESSION.key) SESSION.key(e); });

(async function boot(){
  try{
    const raw = localStorage.getItem(STORE);
    const cru = raw ? JSON.parse(raw) : null;
    // guardado empacotado (f) ou no formato cru antigo: os dois voltam
    S = cru ? (cru.f ? unpack(cru) : cru) : freshState();
    if(!S || !S.w) S = freshState();
    if(!S.pav) S.pav = {};
    if(!S.r) S.r = {};
    if(!S.img) S.img = {};
    if(!Array.isArray(S.txt)) S.txt = [];
    if(!S.c) S.c = {};
    // primeiro dia com o módulo Frases: só a partir daqui ele conta no dia completo
    if(!S.frasesDesde){ S.frasesDesde = dayKey(); try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
  }catch(e){ S = freshState(); }
  setSync("off");
  await restoreFile();
  if(fileHandle){
    // se o arquivo tiver dados mais recentes, usa ele
    try{
      const f = await fileHandle.getFile();
      if(f.size > 2){
        const j = JSON.parse(await f.text());
        if(j && j.w && (!S.ultimo || (j.ultimo||0) > (S.ultimo||0))) S = normaliza(j);
      }
    }catch(e){}
  }
  render();
  await initAssets();
  await initSample();
  await initSync();
  markClean();
  render();
})();
</script>
</body>
</html>
